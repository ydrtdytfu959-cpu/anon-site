ed);scroll-margin-top:180px}.v2-sort{display:flex;align-items:center;gap:12px;font-size:.875rem;color:var(--ink-2);max-width:280px;min-width:0}.v2-sort select{font-size:.8125rem;min-height:44px;max-width:210px}.v2-filter-trigger{display:none}.v2-selected-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.v2-selected-filters:empty{display:none}.v2-filter-chip{display:flex;gap:12px;align-items:center;background:var(--paper-2);border:0;border-radius:4px;min-height:44px;padding:8px 12px;font-size:.8125rem;max-width:100%;overflow-wrap:anywhere}.v2-filter-chip span{font-size:18px}.v2-catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px}.v2-catalog-disclaimer{font-size:.8125rem;color:var(--muted);margin-top:48px;max-width:860px;line-height:1.8}.catalog-pagination{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:40px}.catalog-pagination .btn{min-width:44px}.catalog-pagination [aria-disabled]{opacity:.5}.v2-filter-actions{position:sticky;bottom:-24px;background:var(--elevated);display:flex;gap:12px;padding-block:20px;margin-top:16px;border-top:1px solid var(--line)}.v2-filter-actions .primary{flex:1}.v2-filter-actions .btn{padding-inline:12px}
@media(max-width:1060px){.v2-catalog-layout{grid-template-columns:188px minmax(0,1fr);gap:28px}.v2-catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 18px}.v2-sort>span{display:none}}
@media(max-width:820px){.v2-catalog-page{padding-top:24px}.v2-catalog-layout{display:block}.v2-filter-panel{display:none}.v2-filter-trigger{display:inline-flex}.v2-category-title{display:block;padding-bottom:24px}.v2-category-note{display:block;max-width:none;margin-top:16px}.v2-category-links{gap:4px 20px;margin-bottom:24px;padding-bottom:16px}.v2-catalog-toolbar{flex-wrap:wrap;gap:12px}.v2-catalog-toolbar>div{flex:1}.v2-sort{max-width:200px}.v2-sort select{max-width:190px}.v2-catalog-grid{gap:28px 16px}.v2-catalog-toolbar .btn{padding-inline:12px}.v2-results-count{font-size:.8125rem}}
@media(max-width:430px){.v2-sort{width:100%;max-width:none}.v2-sort>span{display:inline}.v2-sort select{flex:1;max-width:none}.v2-category-title h1{font-size:2.1rem}.v2-category-links{font-size:.875rem;gap:4px 16px}}

/* home.css */
/* Standalone storefront primitives. All new surfaces use v2 classes. */
.v2-home{color:var(--ink);background:var(--bg);padding-bottom:64px}
.v2-home-shell{width:min(1440px,calc(100% - 96px));margin-inline:auto}
.v2-home h1,.v2-home h2,.v2-home h3,.v2-home p,.v2-home figure,.v2-product-card p{margin:0}
.v2-home a,.v2-product-card a{color:inherit;text-decoration:none}
.v2-kicker{color:var(--muted);font-size:.69rem;line-height:1.6;font-weight:650;letter-spacing:.12em;text-transform:uppercase}
[dir="rtl"] .v2-kicker{letter-spacing:0;font-size:.78rem}
.v2-primary-link{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 24px;background:var(--ink);color:var(--bg)!important;font-size:.875rem;font-weight:600;line-height:1.5;border:1px solid var(--ink);border-radius:2px;text-decoration:none;transition:background .18s ease,transform .18s ease}
.v2-primary-link:hover{background:var(--ink-2);transform:translateY(-1px)}
.v2-inline-link{display:inline-flex;align-items:center;justify-content:flex-start;min-height:44px;max-width:100%;font-size:.8125rem;line-height:1.5;font-weight:600;text-decoration:underline!important;text-underline-offset:5px;text-decoration-thickness:1px;white-space:normal}
.v2-inline-link:hover{text-decoration-thickness:2px}
.v2-home :is(a,button,[tabindex]):focus-visible,.v2-product-card :is(a,button):focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.v2-home-hero{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);align-items:center;gap:clamp(32px,4vw,72px);padding-block:40px 46px}
.v2-hero-copy{padding-block:28px;max-width:520px}
.v2-hero-copy h1{font-size:clamp(2.6rem,4.55vw,4.6rem);line-height:1.04;letter-spacing:-.055em;font-weight:500;max-width:10ch;margin-block:20px 24px}
[dir="rtl"] .v2-hero-copy h1{max-width:13ch;letter-spacing:-.035em;line-height:1.22}
.v2-hero-description{max-width:38ch;color:var(--ink-2);font-size:1rem;line-height:1.75}
.v2-hero-copy .v2-primary-link{margin-block-start:28px}
.v2-hero-visual{position:relative;min-width:0;background:var(--paper-2)}
.v2-hero-visual img{display:block;width:100%;height:clamp(360px,39vw,540px);object-fit:cover;object-position:center}
.v2-hero-visual figcaption{position:absolute;inset-inline:20px;bottom:15px;color:#423d35;background:#f5f1e9e8;width:fit-content;max-width:calc(100% - 40px);padding:5px 8px;font-size:.57rem;line-height:1.5;letter-spacing:.1em}
[dir="rtl"] .v2-hero-visual figcaption{letter-spacing:0;font-size:.67rem}
.v2-hero-fallback{height:clamp(360px,39vw,540px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;overflow:hidden}
.v2-hero-fallback svg{width:180%;max-width:none;transform:translateX(-22%)}
.v2-home-section{margin-block-start:72px}
.v2-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-block-end:24px}
.v2-section-heading h2,.v2-home-cost h2,.v2-home-request h2{font-size:clamp(1.625rem,2.2vw,2.25rem);font-weight:500;line-height:1.25;letter-spacing:-.035em}
.v2-section-heading .v2-kicker{margin-block-end:10px}
.v2-section-heading .v2-inline-link{flex:none}
.v2-section-heading--small{margin-block-end:18px}
.v2-section-heading--small h2{font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.v2-category-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.v2-category-tile{display:block;min-width:0}
.v2-category-tile-art{display:block;width:100%;aspect-ratio:1.08;background:var(--paper-2)}
.v2-category-tile-art svg{display:block;width:100%;height:100%;transition:transform .25s ease}
.v2-category-tile-label{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:8px;font-size:.8125rem;font-weight:600;line-height:1.4;padding-block:8px}
.v2-category-tile-label .icon{width:15px;height:15px;flex:none;transition:transform .2s ease}
[dir="rtl"] .v2-category-tile-label .icon{transform:rotate(180deg)}
.v2-category-tile:hover .v2-category-tile-art svg{transform:scale(1.04)}
.v2-product-rail-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - (var(--v2-rail-count) - 1)*24px)/var(--v2-rail-count));gap:24px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;scroll-padding-inline:6px;padding:6px 6px 14px;margin:-6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.v2-product-rail-track>.v2-product-card{scroll-snap-align:start}
.v2-product-card{position:relative;min-width:0;color:var(--ink);background:transparent;border:0;border-radius:0;box-shadow:none}
.v2-product-card-visual{position:relative;background:var(--paper-2)}
.v2-product-card-image{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;aspect-ratio:1/1.05}
.v2-product-card-image svg,.v2-product-card-image img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .28s ease}
.v2-product-wishlist{position:absolute;inset-inline-end:8px;top:8px;display:grid;place-items:center;width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:background .2s ease}
.v2-product-wishlist .icon{width:20px;height:20px}
.v2-product-wishlist:hover{background:var(--paper)}
.v2-product-wishlist[aria-pressed="true"] .icon{fill:currentColor}
.v2-product-card-info{padding-block-start:15px}
.v2-product-card-brand{display:block;color:var(--muted);font-size:.67rem;line-height:1.5;font-weight:500;letter-spacing:.075em;text-transform:uppercase;overflow-wrap:anywhere}
[dir="rtl"] .v2-product-card-brand{letter-spacing:.04em}
.v2-product-card-name{display:flex;align-items:flex-start;min-height:44px;font-size:.9rem;font-weight:500;line-height:1.5;padding-block:5px;overflow-wrap:anywhere}
.v2-product-card-name:hover{text-decoration:underline;text-underline-offset:4px}
.v2-price{font-size:.9rem;font-weight:650;line-height:1.5;margin-block:1px 11px;font-variant-numeric:tabular-nums}
.v2-landed-cost{display:grid;min-width:0;overflow-wrap:anywhere;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:3px 8px;padding-block-start:10px;border-top:1px solid var(--line);font-size:.65rem;line-height:1.5;color:var(--muted)}
.v2-landed-cost>bdi{min-width:0;overflow-wrap:anywhere;color:var(--ink-2);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.v2-landed-cost>small{font-size:inherit;grid-column:1/-1}
.v2-product-availability{font-size:.75rem;color:var(--muted);line-height:1.5;margin-block-start:10px!important}
.v2-product-card-action{margin-block-start:14px}
.v2-card-option{min-height:44px;padding:9px 14px;background:var(--paper);border:1px solid var(--line);border-radius:2px;color:var(--ink);font:inherit;font-size:.8rem;cursor:pointer}
.v2-card-option:disabled{opacity:.6;cursor:not-allowed}
.v2-home-campaign{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);margin-block-start:72px;min-height:390px;background:#e9ece5;color:#25342c}
.v2-campaign-copy{padding:clamp(28px,4vw,62px);align-self:center}
.v2-campaign-copy .v2-kicker{color:#536056}
.v2-campaign-copy h2{font-size:clamp(2rem,3.2vw,3.2rem);font-weight:500;line-height:1.13;letter-spacing:-.045em;max-width:14ch;margin-block:17px 20px}
.v2-campaign-copy>p:not(.v2-kicker){font-size:.875rem;line-height:1.7;max-width:40ch;color:#4d5a50}
.v2-campaign-copy .v2-inline-link{margin-block-start:20px}
.v2-campaign-art{position:relative;min-width:0;width:100%;min-height:390px;overflow:hidden;background:#dde3d8}
.v2-campaign-product{position:absolute;display:block}
.v2-campaign-product svg{display:block;width:100%;height:100%}
.v2-campaign-product--bag{width:79%;height:93%;top:-4%;inset-inline-end:-2%;transform:rotate(8deg)}
.v2-campaign-product--shoe{width:65%;height:67%;bottom:-5%;inset-inline-start:-4%;transform:rotate(-10deg)}
.v2-campaign-art-label{position:absolute;bottom:24px;inset-inline-end:27px;color:#4d5a50;font-size:.58rem;letter-spacing:.19em}
.v2-collection-strip{border-block:1px solid var(--line);padding-block:28px;margin-block-start:64px}
.v2-collection-strip>.v2-kicker{text-align:center;font-size:.62rem}
.v2-collection-strip>div{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;column-gap:26px;row-gap:5px;margin-block-start:16px}
.v2-collection-name{display:inline-flex;align-items:center;min-height:44px;font-size:clamp(1.125rem,1.7vw,1.6rem);letter-spacing:-.03em;font-weight:500;color:var(--ink-2)!important}
.v2-collection-name:hover{text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.v2-home-cost{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,8vw,120px);align-items:center;margin-block:72px}
.v2-home-cost-copy{max-width:470px}
.v2-home-cost-copy h2{margin-block:16px 20px;max-width:18ch}
.v2-home-cost-copy>p:not(.v2-kicker){font-size:.9rem;line-height:1.8;color:var(--ink-2);max-width:43ch}
.v2-home-cost-copy>.v2-inline-link{margin-block-start:20px}
.v2-cost-trust{display:grid;gap:13px;margin-block-start:28px;color:var(--muted);font-size:.75rem;line-height:1.65}
.v2-cost-trust>span{display:flex;align-items:center;gap:10px}
.v2-cost-trust .icon{width:17px;height:17px;flex:none}
.v2-cost-example{background:var(--paper);border:1px solid var(--line);padding:24px 28px;min-width:0}
.v2-cost-example-product{display:flex;align-items:center;gap:18px;padding-block-end:18px;border-bottom:1px solid var(--line)}
.v2-cost-example-art{width:74px;height:74px;flex:none;background:var(--paper-2)}
.v2-cost-example-art svg{width:100%;height:100%}
.v2-cost-example-product h3{margin-block-start:5px;font-weight:500;font-size:1rem;line-height:1.5}
.v2-cost-example-product .v2-kicker{font-size:.6rem}
.v2-cost-rows{display:grid;gap:12px;margin:22px 0}
.v2-cost-rows>div{display:flex;justify-content:space-between;gap:16px;font-size:.8rem;line-height:1.5}
.v2-cost-rows dt{color:var(--ink-2)}
.v2-cost-rows dd{margin:0;white-space:nowrap;font-weight:500}
.v2-landed-cost--large{font-size:.8rem;padding-block-start:20px;align-items:center;row-gap:4px}
.v2-landed-cost--large>bdi{font-size:1.5rem;color:var(--ink);line-height:1.5}
.v2-cost-exclusions{font-size:.68rem;color:var(--muted);line-height:1.7;margin-block-start:15px!important}
.v2-home-request{display:flex;align-items:center;justify-content:space-between;gap:40px;background:var(--paper-2);padding:38px 44px}
.v2-home-request h2{margin-block:10px 12px;font-size:1.7rem}
.v2-home-request p:not(.v2-kicker){max-width:65ch;color:var(--ink-2);font-size:.8125rem;line-height:1.75}
.v2-home-request .v2-primary-link{flex:none}
html[data-theme="dark"] .v2-home-campaign{background:#252c27;color:#ecf0e9}
html[data-theme="dark"] .v2-campaign-copy :is(.v2-kicker,p:not(.v2-kicker)){color:#b7c2b8}
html[data-theme="dark"] .v2-campaign-art{background:#333d34}
html[data-theme="dark"] .v2-campaign-art-label{color:#bdcbbb}
@media(hover:hover) and (prefers-reduced-motion:no-preference){.v2-product-card-image:hover svg{transform:scale(1.045)}}
@media(min-width:1600px){.v2-home-shell{width:min(1504px,calc(100% - 128px))}}
@media(max-width:1100px){
  .v2-home-shell{width:calc(100% - 64px)}
  .v2-home-hero{gap:32px;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
  .v2-hero-copy h1{font-size:3.15rem}
  .v2-hero-description{font-size:.9rem}
  .v2-category-tiles{gap:12px}
  .v2-category-tile-label{font-size:.75rem}
  .v2-product-rail-track{gap:18px;grid-auto-columns:calc((100% - (var(--v2-rail-count) - 1)*18px)/var(--v2-rail-count))}
  .v2-product-card-name{font-size:.85rem}
  .v2-landed-cost{grid-template-columns:1fr}
  .v2-landed-cost>bdi{font-size:.76rem}
  .v2-landed-cost--large{grid-template-columns:1fr auto}
  .v2-landed-cost--large>bdi{font-size:1.35rem}
  .v2-home-cost{gap:40px}
  .v2-home-campaign,.v2-campaign-art{min-height:350px}
}
@media(max-width:800px){
  .v2-home-shell{width:calc(100% - 40px)}
  .v2-home-hero{padding-block:28px 34px;gap:26px}
  .v2-hero-copy h1{font-size:2.6rem;margin-block:15px 18px}
  .v2-hero-copy{padding-block:14px}
  .v2-hero-description{font-size:.83rem}
  .v2-hero-visual img,.v2-hero-fallback{height:360px}
  .v2-hero-copy .v2-primary-link{padding-inline:17px;font-size:.8rem;margin-block-start:22px}
  .v2-category-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .v2-category-tile-art{aspect-ratio:1.4}
  .v2-category-tile-label{font-size:.85rem}
  .v2-product-rail-track{grid-auto-columns:calc((100% - 36px)/3)}
  .v2-home-section,.v2-home-campaign{margin-block-start:50px}
  .v2-home-campaign{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .v2-campaign-copy{padding:28px}
  .v2-campaign-copy h2{font-size:2.1rem}
  .v2-campaign-copy>p:not(.v2-kicker){font-size:.8rem}
  .v2-campaign-art{min-height:340px}
  .v2-home-cost{gap:28px;margin-block:50px}
  .v2-cost-example{padding:20px}
  .v2-cost-example-product{gap:12px}
  .v2-cost-example-art{width:54px;height:54px}
  .v2-cost-example-product h3{font-size:.875rem}
  .v2-landed-cost--large{grid-template-columns:1fr}
  .v2-home-request{padding:28px;gap:25px;align-items:flex-start}
  .v2-home-request h2{font-size:1.4rem}
  .v2-home-request .v2-primary-link{font-size:.8rem;padding-inline:18px}
}
@media(max-width:600px){
  .v2-home{padding-bottom:36px}
  .v2-home-shell{width:calc(100% - 32px)}
  .v2-home-hero{grid-template-columns:1fr;padding-block:26px 28px;gap:25px}
  .v2-hero-copy{padding:0;max-width:none}
  .v2-hero-copy h1{max-width:13ch;font-size:2.9rem;margin-block:15px 17px}
  [dir="rtl"] .v2-hero-copy h1{font-size:2.55rem;max-width:13ch}
  .v2-hero-description{font-size:.9rem;max-width:40ch;line-height:1.7}
  .v2-hero-copy .v2-primary-link{margin-block-start:22px;min-height:46px}
  .v2-hero-visual img,.v2-hero-fallback{height:auto;aspect-ratio:1.45}
  .v2-hero-visual figcaption{font-size:.48rem;inset-inline:11px;bottom:10px;max-width:calc(100% - 22px)}
  .v2-section-heading{align-items:flex-start;gap:14px;margin-block-end:17px}
  .v2-section-heading h2{font-size:1.55rem}
  .v2-section-heading .v2-inline-link{font-size:.7rem;max-width:110px;text-align:end;justify-content:flex-end}
  .v2-section-heading--small h2{font-size:1.05rem;line-height:1.7}
  .v2-section-heading--small{align-items:center;margin-block-end:12px}
  .v2-section-heading .v2-kicker{font-size:.58rem;margin-block-end:8px}
  .v2-category-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .v2-category-tile-art{aspect-ratio:.98}
  .v2-category-tile-label{font-size:.71rem;line-height:1.5;gap:3px}
  .v2-category-tile-label .icon{width:12px;height:12px}
  .v2-product-rail-track{gap:16px;grid-auto-columns:calc((100% - 16px)/2.2)}
  .v2-product-card-info{padding-block-start:11px}
  .v2-product-card-brand{font-size:.58rem}
  .v2-product-card-name{font-size:.8rem;min-height:48px}
  .v2-product-wishlist{inset-inline-end:2px;top:2px}
  .v2-product-wishlist .icon{width:18px;height:18px}
  .v2-price{font-size:.85rem;margin-block-end:8px}
  .v2-landed-cost{font-size:.62rem}
  .v2-home-campaign{grid-template-columns:1fr;margin-block-start:44px}
  .v2-campaign-copy{padding:28px}

/* identity.css */
/* One flat wordmark across every brand surface. Infinity is the lowercase o. */
:root{--logo-ink:#000}

.brand{display:inline-flex;align-items:center;min-height:44px;flex:none;line-height:1;direction:ltr}
.anox-wordmark{display:block;width:132px;height:auto;max-width:100%;flex:none;color:var(--logo-ink);direction:ltr;overflow:visible}
.footer .anox-wordmark{width:120px}
/* This existing boot surface disappears with the first route render; no timer. */
.boot{position:fixed;inset:0;z-index:210;display:grid;place-content:center;justify-items:center;padding:32px;background:#000;color:#fff;--logo-ink:#fff}
.boot-logo .anox-wordmark{width:min(68vw,360px)}

    function normalizeSearch(value){
      return String(value||"").toLowerCase().normalize("NFKD")
        .replace(/[\u0300-\u036f\u064b-\u065f\u0670\u0640]/g,"")

      ["bag","bags","backpack","duffel","sling","حقيبه","حقائب","شنطه","شنط"],
      ["phone","phones","mobile","هاتف","هواتف","جوال"],
      ["cream","skincare","كريم","البشره","بشره"],
      ["keyboard","keybord","لوحه","مفاتيح"],
      ["reader","ebook","قارئ","قراءه"],
      ["bottle","قاروره","زجاجه"],
      ["hoodie","sweatshirt","هودي"],
      ["shirt","قميص"],["jacket","جاكيت","ستره"],
      ["watch","ساعه"],["glasses","نظاره"],["lamp","مصباح","اضاءه"],

    function editDistance(a,b){if(Math.abs(a.length-b.length)>1)return 2;let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const next=[i];for(let j=1;j<=b.length;j++)next[j]=Math.min(next[j-1]+1,row[j]+1,row[j-1]+(a[i-1]===b[j-1]?0:1));if(Math.min(...next)>1)return 2;row=next;}return row[b.length];}
    // Query work is bounded: 100 characters, 12 distinct terms and 2,000 typo candidates per term.
    const SEARCH_STOP_WORDS=new Set(['the','a','an','for','and','or','with','to','of','in','on','my','i','me','need','want','please','some','best','great','buy','top','افضل','احسن','شراء','في','من','مع','و','او','عن','الي','لي','اريد','ابحث','فضلك','رجاء']);
    class LocalSearchIndex{

        this.postings=new Map();this.documents.forEach(({words},index)=>{for(const word of words){if(!this.postings.has(word))this.postings.set(word,[]);this.postings.get(word).push(index);}});
        this.words=[...this.postings.keys()].sort();this.wordLengths=new Map();
        for(const word of this.words){if(!this.wordLengths.has(word.length))this.wordLengths.set(word.length,[]);this.wordLengths.get(word.length).push(word);}

        const normalized=normalizeSearch(text(query,100));if(this.cache.has(normalized))return this.cache.get(normalized).slice();

        const totals=new Map(),usefulTokens=[];

            if(value.length<2)continue;

            for(let index=low,count=0;index<this.words.length&&this.words[index].startsWith(value)&&count<2000;index++,count++){const word=this.words[index];wordScores.set(word,Math.max(wordScores.get(word)||0,12));}
          }

          for(const [index,score] of termScores){const total=totals.get(index)||{index,matched:0,score:0};total.matched++;total.score+=score;totals.set(index,total);}

        if(this.cache.size>=80)this.cache.delete(this.cache.keys().next().value);this.cache.set(normalized,result);return result.slice();
      }
    }
    /* UI-facing search service: replace its adapter with an authorized server search when network commerce is introduced. Offline ingestion is explicitly bounded to 5,000 records per provider. */
    const SearchService=new LocalSearchIndex(Catalog);
    function searchCatalog(query){return SearchService.search(query);}
    
    function defaultFilters(){
      return {category:"",brand:"",maxPrice:0,budget:0,available:false,isNew:false,popular:false};
    }
    function parseCatalogPage(value){const page=Number(value);return Number.isSafeInteger(page)&&page>=1?page:1;}
    function parseCatalogParams(params,products=Catalog.all()){
      const filters=defaultFilters(),category=params.get("category")||"",brandName=params.get("brand")||"";
      if(Object.hasOwn(CATEGORIES,category))filters.category=category;
      if(products.some(product=>product.brand===brandName))filters.brand=brandName;
      // Zero alone means unlimited; a positive URL cap is explicit, including USD 1,000.
      const cap=params.get("maxPrice")||"";
      if(/^\d{1,7}(?:\.\d{1,2})?$/.test(cap)&&Number(cap)>0&&Number(cap)<=1000000)filters.maxPrice=Number(cap);
      if([0,10000,15000,25000,50000,100000].includes(Number(params.get("budget"))))filters.budget=Number(params.get("budget"));
      for(const key of ["available","isNew","popular"])filters[key]=params.get(key)==="1";
      return {filters,sort:["featured","low","high","newest"].includes(params.get("sort"))?params.get("sort"):"featured",page:parseCatalogPage(params.get("page"))};
    }
    function readFilterParams(params){Object.assign(ui,parseCatalogParams(params));}
    function filterCatalogProducts(source,filters,sort="featured"){
      const f=filters,estimates=new Map(),estimate=product=>{if(!estimates.has(product.id))estimates.set(product.id,productQuote(product));return estimates.get(product.id);};
      const list=source.filter(product=>
        (!f.category||product.category===f.category)&&(!f.brand||product.brand===f.brand)&&
        (!f.maxPrice||product.priceCents<=f.maxPrice*100)&&(!f.budget||estimate(product).totalDzd<=f.budget)&&
        (!f.available||product.stock>0)&&(!f.isNew||product.isNew)&&(!f.popular||product.isPopular)
      );
      if(sort==="low"||sort==="high")list.sort((a,b)=>(estimate(a).totalCents-estimate(b).totalCents)*(sort==="high"?-1:1));

    function serializeCatalogParams(filters,sort="featured",page=1){

    }

    function catalogPaginationMarkup(pagination,routeName,baseParams){
      if(pagination.pages<=1)return "";
      const link=(page,label,current=false)=>{
        const params=new URLSearchParams(baseParams);if(page===1)params.delete("page");else params.set("page",String(page));
        const href="#"+routeName+(params.toString()?"?"+params.toString():"");
        return '<a class="btn '+(current?'primary':'secondary')+' small" href="'+esc(href)+'" data-catalog-page="'+page+'"'+(current?' aria-current="page"':'')+' aria-label="'+esc((label===String(page)?"":label+" · ")+tx("الصفحة ","Page ")+page)+'">'+esc(label)+'</a>';
      };
      const pages=[...new Set([1,pagination.page-1,pagination.page,pagination.page+1,pagination.pages].filter(page=>page>=1&&page<=pagination.pages))].sort((a,b)=>a-b);
      let previous=0;
      const numbered=pages.map(page=>{const gap=previous&&page-previous>1?'<span class="pagination-gap" aria-hidden="true">…</span>':"";previous=page;return gap+link(page,String(page),page===pagination.page);}).join("");
      const previousLink=pagination.page>1?link(pagination.page-1,tx("السابق","Previous")):'<span class="btn secondary small" aria-disabled="true">'+esc(tx("السابق","Previous"))+'</span>';
      const nextLink=pagination.page<pagination.pages?link(pagination.page+1,tx("التالي","Next")):'<span class="btn secondary small" aria-disabled="true">'+esc(tx("التالي","Next"))+'</span>';
      return '<nav class="catalog-pagination" aria-label="'+esc(tx("صفحات المنتجات","Product result pages"))+'">'+previousLink+numbered+nextLink+'</nav>';
    }

    async function addSelectedProduct(){
      if(ui.cartBusy)return;
      const selection=clone(ui.selection),product=selection&&productBy(selection.productId);
      if(!product)return;
      const editKey=ui.editKey,editing=!!editKey,previousEdit=editing?clone(state.cart.find(line=>cartKey(line)===editKey)):null,moveWishlist=ui.moveWishlist===product.id;
      const target=$("dialog-content").querySelector("[data-add-product]");ui.cartBusy=true;if(target)target.disabled=true;
      try{
      const synchronized=await Storage.sync();
      if(Storage.notice==="clearedElsewhere"||!jsonEqual(selection,ui.selection)||ui.editKey!==editKey)return;
      if(!synchronized&&['cart_stock_conflict','cart_coordination_required'].includes(Storage.notice)){if(ui.dialog==='product')renderProduct(product,false,'[data-add-product]');return;}
      const variant=variantFor(product,selection.color,selection.size);
      if(!variant){toast(tx("اختر المقاس أو الخيار أولًا.","Choose a size or option first."),"warning");$("dialog-content").querySelector("[data-size]")?.focus();return;}
      if(!CommercePolicy.line(product,variant,selection.qty,'preview').allowed){toast(tx('هذا الخيار غير مؤهل للمحاكاة، والشراء الحقيقي غير متصل.','This option is not eligible for preview; live purchasing is not connected.'),'warning');return;}
      if(!whole(selection.qty,1,20)||selection.qty>remainingStock(product,selection.color,selection.size,ui.editKey)){
        toast(tx("الكمية تتجاوز المتاح لهذا اللون والمقاس، مع احتساب السلة.","Quantity exceeds this color and size’s availability, including your cart."),"warning");return;
      }
      const saved=await Storage.save({
        guard:(remote,current)=>cartEditUnchanged(remote,current,editKey,previousEdit),
        mutate:current=>{
          const updated=current.cart.filter(line=>!editKey||cartKey(line)!==editKey),newLine={productId:product.id,color:selection.color,size:selection.size,qty:selection.qty},existing=updated.find(line=>cartKey(line)===cartKey(newLine));
          if(existing)existing.qty+=newLine.qty;else updated.push(newLine);current.cart=updated;
          if(moveWishlist)current.wishlist=current.wishlist.filter(id=>id!==product.id);
        }
      });updateShell();
      if(!saved){if(ui.dialog==='product')renderProduct(product,false,'[data-add-product]');toast(tx("لم نؤكد تعديل السلة. راجع الكمية ورسالة الحفظ قبل المحاولة مجددًا.","The cart edit was not confirmed. Review the quantity and storage message before retrying."),'warning');return;}
      if(editing){ui.editKey="";ui.moveWishlist="";dismissDialog();}
      else if(ui.dialog==="product"&&ui.selection?.productId===product.id)renderProduct(product,false,"[data-add-product]");
      toast(editing?tx("حُفظت خيارات السلة.","Cart options updated."):tx("أُضيف إلى السلة.","Added to cart."),"success");
      }finally{ui.cartBusy=false;if(target?.isConnected)target.disabled=false;}
    }

    function cartQuote(){if(cartIssues().length)return null;return quote(state.cart.map(line=>({...line,priceCents:productBy(line.productId).priceCents,weightGrams:productBy(line.productId).weightGrams,dimensionsMm:productBy(line.productId).dimensionsMm,classification:productBy(line.productId).classification,handling:productBy(line.productId).handling})));}
    function cartIssues(){
      const counts=new Map(),issues=[];
      const gate=CommercePolicy.checkout(state.cart,{mode:"preview"});if(state.cart.length&&!gate.allowed)issues.push(tx("راجع السلة: منتج أو خيار غير صالح للمحاكاة، أو أن المزوّد غير متاح.","Review the cart: a product or option is ineligible for preview, or its provider is unavailable."));
      for(const line of state.cart){
        const product=productBy(line.productId),variant=variantFor(product,line.color,line.size),key=cartKey(line);
        counts.set(key,(counts.get(key)||0)+line.qty);
        if(!variant||!whole(line.qty,1,20)||counts.get(key)>Math.min(variant.stock,20))issues.push(tx("راجع الخيار والكمية: ","Review option and quantity: ")+(product?localized(product.name):line.productId));
      }
      return issues;
    }

    async function generateQuote(form){
      const data=Object.fromEntries(new FormData(form).entries()),request=state.requests.find(value=>value.id===data.requestId);
      if(!request||request.status==="accepted")return;
      const price=numberInput(data.unitUsd),weight=numberInput(data.weightKg),errors={};
      if(!Number.isFinite(price)||price<.01||price>10000||Math.abs(price*100-Math.round(price*100))>.00001)errors.unitUsd=tx("أدخل سعرًا من 0.01 إلى 10000، حتى منزلتين عشريتين.","Use 0.01–10000, with at most two decimal places.");
      if(!Number.isFinite(weight)||weight<.001||weight>100||Math.abs(weight*1000-Math.round(weight*1000))>.00001)errors.weightKg=tx("أدخل وزنًا من 0.001 إلى 100 كغ، حتى ثلاثة منازل.","Use 0.001–100 kg, with at most three decimal places.");
      setFormErrors(form,errors);if(Object.keys(errors).length)return;
      const now=Date.now(),unitCents=Math.round(price*100),unitWeightGrams=Math.round(weight*1000),config=clone(state.settings);
      const original=clone(request),estimate={createdAt:new Date(now).toISOString(),expiresAt:new Date(now+72*60*60*1000).toISOString(),unitCents,unitWeightGrams,config,totals:quote([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config),decisionAt:"",legacy:false};
      estimate.pricingSnapshot=pricingSnapshot([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config,estimate.totals);
      const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.settings,config),mutate:current=>{const value=current.requests.find(value=>value.id===request.id);value.quote=estimate;value.status="quoted";}});
      if(!saved){toast(tx("تعذر حفظ العرض أو تغيّر الطلب في تبويب آخر. راجع حالته ثم أعد المحاولة.","The quote could not be saved or the request changed in another tab. Review its status and try again."),"warning");return;}
      delete ui.formMemory[formMemoryKey(form)];form.dataset.discarded="true";
      if(currentRoute().name==="quote"){renderQuote();$("main").focus({preventScroll:true});}
    }
    async function decideQuote(id,decision){

      if(!request||!request.quote||request.quote.legacy||!request.quote.pricingSnapshot||request.status!=="quoted"||!["accepted","rejected"].includes(decision))return;

      try{
        const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===id),original)&&jsonEqual(current.requests.find(value=>value.id===id),original)&&!quoteExpired(original.quote),mutate:current=>{const value=current.requests.find(value=>value.id===id);value.status=decision;value.quote.decisionAt=new Date().toISOString();}});
        if(currentRoute().name==="quote")renderQuote();

    const SETTING_FIELDS=[
      ["usdToDzd",bi("سعر الصرف: دينار لكل دولار","Exchange rate: DZD per USD"),1,1000],
      ["serviceFeePercent",bi("رسوم الخدمة %","Service fee %"),0,50],

      ["shippingPerKgUsd",bi("الشحن USD لكل كغ","Shipping USD per kg"),0,100]
    ];
    function parseSettingsDraft(draft){
      const result={};
      for(const [key,,min,max] of SETTING_FIELDS){
        const value=numberInput(draft&&draft[key]);
        if(!Number.isFinite(value)||value<min||value>max||Math.abs(value*100-Math.round(value*100))>.00001)return null;
        result[key]=value;
      }
      return result;
    }

    function searchPreviewCatalog(input){
      if(!isObject(input)||Object.keys(input).some(key=>!["query","limit"].includes(key))||typeof input.query!=="string"||!input.query.trim()||input.query.length>100){
        throw new Error("Provide a query of 1–100 characters.");
      }
      const limit=input.limit===undefined?6:input.limit;
      requireInteger(limit,1,12,"search limit");
      const matches=searchCatalog(input.query).filter(product=>product.source.mode==="preview");
      return {
        mode:"preview",livePurchasing:false,query:input.query.trim(),total:matches.length,
        items:matches.slice(0,limit).map(product=>({
          id:product.id,slug:product.slug,name:clone(product.name),currency:"USD",itemPriceMinor:product.priceCents,
          estimatedLandedDzd:productQuote(product,1,DEFAULT_SETTINGS).totalDzd,excludes:["customs","local_taxes","insurance"],
          sourceMode:"preview",purchasable:false
        }))
      };
    }
    function registerCatalogTool(){
      let context;try{context=document.modelContext;}catch{return;}
      if(!context||typeof context.registerTool!=="function"||catalogToolLifecycle)return;
      const lifecycle=new AbortController();catalogToolLifecycle=lifecycle;
      const failed=()=>{lifecycle.abort();if(catalogToolLifecycle===lifecycle)catalogToolLifecycle=null;};
      try{
        Promise.resolve(context.registerTool({
          name:"search_preview_catalog",title:"Search AnoX preview catalog",
          description:"Read-only Arabic or English search of fictional AnoX products. Returns illustrative prices under fixed public illustrative cost assumptions. No purchasing, navigation, inventory verification or access to private device records.",
          inputSchema:{
            type:"object",properties:{query:{type:"string",minLength:1,maxLength:100},limit:{type:"integer",minimum:1,maximum:12}},
            required:["query"],additionalProperties:false
          },
          annotations:{readOnlyHint:true,untrustedContentHint:true},execute:searchPreviewCatalog
        },{signal:lifecycle.signal})).catch(failed);
      }catch{failed();}
    }
    window.addEventListener("pagehide",()=>{
      if(catalogToolLifecycle){catalogToolLifecycle.abort();catalogToolLifecycle=null;}
    });
    window.addEventListener("pageshow",registerCatalogTool);

// Category discovery is a presentation adapter over the verified catalog filter.
const V2_CATEGORY_COPY={
  Shoes:bi('خطوتك القادمة.','Your next move.'),Fashion:bi('قطع تختارها لنفسك.','Make it your own.'),
  Beauty:bi('تفاصيل لروتينك اليومي.','A little everyday ritual.'),Electronics:bi('تقنية تناسب يومك.','Better-connected days.'),
  Accessories:bi('التفاصيل تصنع الفرق.','The finishing touches.')
};
function V2CatalogChoices(params=currentRoute().params){
  const products=Catalog.all(),result={};
  for(const [key,field] of [['size','sizes'],['color','colors']]){
    const value=params.get(key)||'';
    result[key]=value.length<=80&&products.some(p=>p[field].includes(value))?value:'';
  }
  return result;
}
function V2ChoiceResults(products){
  const choices=V2CatalogChoices();
  return products.filter(p=>(!choices.size||p.sizes.includes(choices.size))&&(!choices.color||p.colors.includes(choices.color)));
}
function V2FilterSelect({id,key,label,values,value,choice=false,help=''}){
  return `<div class="v2-filter-field"><label for="${esc(id)}">${esc(label)}</label><select class="select" id="${esc(id)}" ${choice?'data-v2-filter':'data-filter'}="${esc(key)}">${values.map(([val,title])=>`<option value="${esc(val)}"${String(val)===String(value)?' selected':''}>${esc(title)}</option>`).join('')}</select>${help?`<p class="field-help">${esc(help)}</p>`:''}</div>`;
}
function filterMarkup(suffix){
  const f=ui.filters,choice=V2CatalogChoices(),all=Catalog.all(),source=f.category?all.filter(p=>p.category===f.category):all;
  const any=tx('الكل','All'),options=(values,label=v=>v)=>[['',any],...values.map(v=>[v,label(v)])];
  const select=(key,label,values,value,extra={})=>V2FilterSelect({id:`${key}-${suffix}`,key,label,values,value,...extra});
  return `<div class="v2-filter-fields">
    ${select('category',tx('الفئة','Category'),options(Object.keys(CATEGORIES),categoryLabel),f.category)}
    ${select('brand',tx('العلامة','Brand'),options([...new Set(all.map(p=>p.brand))]),f.brand)}
    <details class="v2-filter-section"${choice.size||choice.color?' open':''}><summary>${esc(tx('المقاس واللون','Size & color'))}</summary>
      ${select('size',tx('المقاس أو الخيار','Size or option'),options([...new Set([...source.flatMap(p=>p.sizes),...(choice.size?[choice.size]:[])])]),choice.size,{choice:true})}
      ${select('color',tx('اللون','Color'),options([...new Set([...source.flatMap(p=>p.colors),...(choice.color?[choice.color]:[])])],colorName),choice.color,{choice:true})}
    </details>
    <details class="v2-filter-section"${f.maxPrice||f.budget?' open':''}><summary>${esc(tx('السعر وتكلفة الوصول','Price & landed cost'))}</summary>
      ${select('maxPrice',tx('سعر المنتج بالدولار','Item price in USD'),[...new Set([0,50,75,150,300,f.maxPrice])].sort((a,b)=>a-b).map(v=>[v,v?tx('حتى ','Up to ')+formatUSD(v*100):any]),f.maxPrice)}
      ${select('budget',tx('ميزانية الوصول بالدينار','Landed budget in DZD'),[0,10000,15000,25000,50000,100000].map(v=>[v,v?tx('حتى ','Up to ')+formatDZD(v):any]),f.budget,{help:tx('تقدير لقطعة واحدة، دون الجمارك.','One-item estimate, excluding customs.')})}
    </details>
    <fieldset class="v2-filter-checks"><legend>${esc(tx('الاكتشاف','Discover'))}</legend>${[['available',tx('متاح للاختيار','Available to select')],['isNew',tx('المضاف حديثًا','Recently added')],['popular',tx('مختارات AnoX','AnoX picks')]].map(([k,label])=>`<label><input type="checkbox" data-filter="${k}"${f[k]?' checked':''}><span>${esc(label)}</span></label>`).join('')}</fieldset>
  </div>`;
}
function filterChips(){
  const f=ui.filters,choice=V2CatalogChoices();
  const base=Object.keys(f).filter(k=>f[k]).map(key=>{
    const label=key==='category'?v2CategoryLabel(f[key]):key==='brand'?f[key]:key==='budget'?formatDZD(f[key]):key==='maxPrice'?formatUSD(f[key]*100):key==='available'?tx('متوفر','Available'):key==='isNew'?tx('جديد','New'):tx('مختارات','Picks');
    return `<button type="button" class="v2-filter-chip" data-remove-filter="${key}" aria-label="${esc(tx('إزالة: ','Remove: ')+label)}">${esc(label)}<span aria-hidden="true">×</span></button>`;
  });
  for(const key of ['size','color'])if(choice[key]){const label=key==='color'?colorName(choice[key]):choice[key];base.push(`<button type="button" class="v2-filter-chip" data-v2-remove-choice="${key}" aria-label="${esc(tx('إزالة: ','Remove: ')+label)}">${esc(label)}<span aria-hidden="true">×</span></button>`);}
  return base.join('');
}
function catalogResults(products,query=''){
  products=V2ChoiceResults(products);
  const pagination=catalogPage(products,ui.page),route=currentRoute();ui.page=pagination.page;
  const pageParams=filterParams();for(const [k,v] of Object.entries(V2CatalogChoices()))if(v)pageParams.set(k,v);if(route.name==='search'&&query)pageParams.set('q',query);
  const resultLabel=products.length?`${pagination.start}–${pagination.end} ${tx('من','of')} ${pagination.total} ${tx('منتج','products')}`:tx('لا توجد نتائج','No results');
  const sorts=[['featured',tx('مختاراتنا','Featured')],['low',tx('تكلفة الوصول: الأقل','Landed cost: low first')],['high',tx('تكلفة الوصول: الأعلى','Landed cost: high first')],['newest',tx('الأحدث','Newest')]];
  const toolbar=`<div class="v2-catalog-toolbar"><div><button type="button" class="btn secondary small v2-filter-trigger" data-open="filters">${icon('filter')}${esc(tx('الفلاتر','Filters'))}</button><span id="results-count" class="v2-results-count" role="status" tabindex="-1">${esc(resultLabel)}</span></div><label class="v2-sort"><span>${esc(tx('الترتيب','Sort'))}</span><select class="select" data-sort>${sorts.map(([v,l])=>`<option value="${v}"${ui.sort===v?' selected':''}>${esc(l)}</option>`).join('')}</select></label></div>`;
  const liveMore=liveLoadMoreMarkup(query);
  const content=products.length?`<div class="product-grid v2-catalog-grid">${pagination.items.map(p=>productCard(p)).join('')}</div>${Catalog.usingLive(query)?liveMore:catalogPaginationMarkup(pagination,route.name==='search'?'search':'shop',pageParams)}`:emptyMarkup(tx('مساحة لاختيار مختلف','Room for a different choice'),tx('وسّع الفلاتر أو أرسل رابط المنتج الذي تبحث عنه.','Try fewer filters, or send the link to what you want.'),tx('طلب منتج','Request a product'),'request','search');
  return `${toolbar}<div class="v2-selected-filters">${filterChips()}</div>${!products.length?button(tx('مسح الفلاتر','Clear filters'),'data-clear-filters','text-btn'):''}${content}`;
}
function V2CategoryHeader(){
  const category=ui.filters.category,cap=ui.filters.maxPrice;
  const title=category?v2CategoryLabel(category):cap===50?tx('اختيارات بأقل من 50 دولارًا','The under-$50 edit'):tx('عالم من الاختيارات','A world to choose from');
  const desc=category&&V2_CATEGORY_COPY[category]?localized(V2_CATEGORY_COPY[category]):tx('اكتشف المنتج. واعرف تقدير وصوله إلى الجزائر.','Discover the product. See its estimated cost to Algeria.');
  const links=[['',tx('كل المنتجات','All products')],...['Shoes','Fashion','Beauty','Electronics','Accessories'].map(c=>[c,v2CategoryLabel(c)])];

}
function V2CatalogPage(heading,products,query='',extra=''){
  $('main').innerHTML=`<div class="v2-page v2-catalog-page ${extra}"><div class="v2-container">${heading}<div class="v2-catalog-layout"><aside class="v2-filter-panel" aria-label="${esc(tx('فلاتر المنتجات','Product filters'))}"><div class="v2-filter-heading"><h2>${esc(tx('الفلاتر','Filters'))}</h2>${button(tx('مسح الكل','Clear all'),'data-clear-filters','text-btn')}</div>${filterMarkup('side')}</aside><section aria-label="${esc(tx('المنتجات','Products'))}">${catalogResults(products,query)}</section></div></div></div>`;

function renderShop(){
  pageTitle(ui.filters.category?v2CategoryLabel(ui.filters.category):tx('تسوّق Nike','Shop Nike'));
  if(Catalog.liveStatus==='idle'||Catalog.liveQuery!=='')void ensureLiveCatalog('');
  const usingLive=Catalog.usingLive(''),source=usingLive?Catalog.liveSource(''):[];
  if(Catalog.liveStatus==='loading'&&!Catalog.liveRecords.length){$('main').innerHTML='<div class="v2-page v2-catalog-page"><div class="v2-container">'+V2CategoryHeader()+liveCatalogStateMessage('loading')+'</div></div>';return;}
  if(Catalog.liveStatus==='unavailable'){ $('main').innerHTML='<div class="v2-page v2-catalog-page"><div class="v2-container">'+V2CategoryHeader()+liveCatalogStateMessage('unavailable')+'</div></div>';return; }
  V2CatalogPage(V2CategoryHeader(),filteredProducts(source),'');
}

function refreshCatalog(){
  ui.page=1;
  const active=document.activeElement,focusId=active?.id,sortFocused=active?.matches('[data-sort]'),route=currentRoute(),params=filterParams();
  for(const [k,v] of Object.entries(V2CatalogChoices()))if(v)params.set(k,v);
  if(route.name==='search'&&route.params.get('q'))params.set('q',route.params.get('q'));
  history.replaceState(null,'','#'+(route.name==='search'?'search':'shop')+(params.toString()?'?'+params.toString():''));
  if(route.name==='search')renderSearch();else renderShop();updateShell();
  if(ui.dialog==='filters'){
    const target=focusId?$(focusId):null;if(target)target.focus({preventScroll:true});
    const apply=$('apply-filters');if(apply)apply.textContent=tx('عرض المنتجات','Show products')+' · '+V2ChoiceResults(filteredProducts(route.name==='search'&&route.params.get('q')?searchCatalog(route.params.get('q')):Catalog.all())).length;
  }else{const target=focusId?$(focusId):sortFocused?$('main').querySelector('[data-sort]'):null;target?.focus({preventScroll:true});}
}
function openFilters(){
  const route=currentRoute(),count=V2ChoiceResults(filteredProducts(route.name==='search'?searchCatalog(route.params.get('q')||''):Catalog.all())).length;
  openDialog('filters',tx('تصفية المنتجات','Filter products'),`<div class="v2-filter-drawer">${filterMarkup('drawer')}<div class="v2-filter-actions">${button(tx('مسح الكل','Clear all'),'data-clear-filters','btn secondary')}${button(tx('عرض المنتجات','Show products')+' · '+count,'id="apply-filters" data-close','btn primary')}</div></div>`);
}
function V2SetChoice(key,value){
  if(!['size','color'].includes(key))return;
  const route=currentRoute(),params=new URLSearchParams(route.params);value?params.set(key,value):params.delete(key);params.delete('page');
  const validated=V2CatalogChoices(params);if(value&&!validated[key])return;
  history.replaceState(null,'','#'+route.path+(params.toString()?'?'+params.toString():''));refreshCatalog();
}
document.addEventListener('change',e=>{if(e.target.matches('[data-v2-filter]'))V2SetChoice(e.target.dataset.v2Filter,e.target.value);});
document.addEventListener('click',e=>{const t=e.target.closest('[data-v2-remove-choice],[data-clear-filters]');if(!t)return;if(t.hasAttribute('data-clear-filters')){const r=currentRoute(),p=new URLSearchParams(r.params);p.delete('size');p.delete('color');history.replaceState(null,'','#'+r.path+(p.toString()?'?'+p.toString():''));}else V2SetChoice(t.dataset.v2RemoveChoice,'');},true);

function updateStorageBanner(){

abindex="-1">'+icon("info")+'<h2>'+esc(tx("التواصل والتشغيل الفعلي","Contact & live operations"))+'</h2><p>'+esc(tx("لا توجد قناة دعم أو فريق مبيعات متصل بهذا الملف، ولا ندّعي إرسال رسالتك إلى أحد. طلبات المنتجات والأعمال تبقى محلية. يجب ربط بيانات الشركة وقنوات الدعم والموردين والدفع قبل فتح المنصة لطلبات شراء حقيقية.","No support channel or sales team is connected to this file, and it does not claim to send your message to anyone. Product and business requests remain local. Company information, support channels, suppliers and payments must be connected before accepting real purchases."))+'</p><div class="actions actions-spaced">'+routeLink("requests",tx("مراجعة طلباتي المحلية","Review my local requests"),"btn secondary small")+'</div></section></div>',"HELP CENTER");

function v2OpenMega(key){

  if(!trigger||!panel||!window.matchMedia("(min-width: 1050px)").matches)return;

function v2BindNavigation(){
  if(v2Navigation.bound)return;v2Navigation.bound=true;
  const header=$("site-header");
  header.addEventListener("click",event=>{
    const trigger=event.target.closest("[data-v2-mega]");
    if(trigger){const key=trigger.dataset.v2Mega;v2Navigation.open===key?v2CloseMega():v2OpenMega(key);return;}
    if(event.target.closest("a, [data-open], [data-language], [data-theme]"))v2CloseMega();
  });
  header.addEventListener("pointerover",event=>{
    if(event.pointerType==="touch")return;
    const root=event.target.closest("[data-v2-mega-root]");
    if(!root||root.contains(event.relatedTarget))return;
    clearTimeout(v2Navigation.leaveTimer);clearTimeout(v2Navigation.hoverTimer);
    const key=root.dataset.v2MegaRoot;
    if(key!==v2Navigation.open)v2Navigation.hoverTimer=setTimeout(()=>v2OpenMega(key),325);
  });
  header.addEventListener("pointerout",event=>{
    const root=event.target.closest("[data-v2-mega-root]");
    if(!root||root.contains(event.relatedTarget))return;
    clearTimeout(v2Navigation.hoverTimer);
    v2Navigation.leaveTimer=setTimeout(()=>{
      if(!root.contains(document.activeElement)&&v2Navigation.open===root.dataset.v2MegaRoot)v2CloseMega();
    },225);
  });
  header.addEventListener("focusout",()=>setTimeout(()=>{
    const active=document.activeElement,root=header.querySelector('[data-v2-mega-root="'+v2Navigation.open+'"]');
    if(v2Navigation.open&&root&&!root.contains(active))v2CloseMega();
  },0));
  document.addEventListener("pointerdown",event=>{if(v2Navigation.open&&!event.target.closest(".v2-category-nav"))v2CloseMega();});
  document.addEventListener("focusin",event=>{
    const root=header.querySelector('[data-v2-mega-root="'+v2Navigation.open+'"]');
    if(v2Navigation.open&&root&&!root.contains(event.target))v2CloseMega();
  });
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"&&v2Navigation.open){event.preventDefault();event.stopPropagation();v2CloseMega(true);}
  },true);
  window.addEventListener("hashchange",()=>v2CloseMega());
  window.matchMedia("(min-width: 1050px)").addEventListener("change",()=>v2CloseMega());
}

function renderRoute({focus=true}={}){
      if(ui.rendering)return;
      ui.rendering=true;
      try{
        const route=currentRoute();
        if(!authRoute())authReset();
        if(ui.dialog)closeDialog(false);
        if(route.name!=="product"){ui.editKey="";ui.moveWishlist="";}
        if(["shop","search"].includes(route.name))readFilterParams(route.params);
        switch(route.name){
          case "home":renderHome();break;
          case "shop":renderShop();break;
          case "search":renderSearch();break;
          case "wishlist":renderWishlist();break;
          case "cart":renderCart();break;
          case "checkout":renderCheckout();break;
          case "account":renderAccount();break;
          case "signin":case "signup":renderAuth();break;
          case "order":renderOrder();break;
          case "request":renderRequest(false);break;
          case "business":renderRequest(true);break;
          case "requests":renderRequests();break;
          case "quote":renderQuote();break;
          case "settings":renderSettings();break;
          case "compare":renderCompare();break;
          case "brands":renderCollections();break;
          case "new":renderNew();break;
          case "how":renderHow();break;
          case "track":renderTrack();break;
          case "help":renderHelp();break;
          case "debug":if(DEVELOPER_MODE)renderDeveloperTests();else renderHelp();break;
          case "product":{
            let slug;
            try{slug=decodeURIComponent(route.path.slice(8));}catch{slug="";}
            const product=productBy(slug);
            if(!product){
              history.replaceState(null,"","#shop");readFilterParams(new URLSearchParams());renderShop();
              toast(tx("هذا المنتج غير موجود في الكتالوج.","This product is not in the catalog."),"warning");
              break;
            }
            
            pageTitle(localized(product.name));
            if(!ui.selection||ui.selection.productId!==product.id){
              ui.editKey="";ui.moveWishlist="";
              ui.selection={productId:product.id,color:product.colors[0],size:product.sizes.length===1?product.sizes[0]:"",qty:1,view:0,zoom:false};
            }
            if(!state.viewed.includes(product.id)){state.viewed.unshift(product.id);state.viewed=state.viewed.slice(0,50);Storage.save();}
            renderProduct(product,true);
            focus=true;
            break;
          }
          default:
            pageTitle(tx("الصفحة غير موجودة","Page not found"));
            $("main").innerHTML=pageShell(tx("لم نجد هذه الصفحة","We couldn’t find that page"),"",emptyMarkup(tx("لنعد إلى طريق واضح","Let’s get you back on track"),tx("الرابط غير صالح أو لم يعد موجودًا.","The link is invalid or no longer available."),navLabel("home"),"home"));
        }
        updateShell();restoreForms();updateCatalogStatus();
        $("main").setAttribute("aria-busy","false");
        if(focus&&!ui.dialog){
          const catalogTarget=ui.catalogPageFocus?$("results-count"):null;ui.catalogPageFocus=false;
          (catalogTarget||$("main")).focus({preventScroll:true});
          if(catalogTarget)catalogTarget.scrollIntoView({block:"start",behavior:"auto"});
          else window.scrollTo({top:0,behavior:"auto"});
        }
        if(ui.returnProductFocus&&!ui.dialog){const productId=ui.returnProductFocus;ui.returnProductFocus="";requestAnimationFrame(()=>{if(!ui.dialog){const target=[...$("main").querySelectorAll("[data-product]")].find(node=>node.dataset.product===productId);(target||$("main")).focus({preventScroll:true});}});}
        if(focus&&authRoute()){const input=$("auth-password")||$("auth-email")||$("auth-fullName")||$("auth-heading");input?.focus({preventScroll:true});}
        const section=currentRoute().params.get("section");
        if(section&&["shipping","privacy","contact"].includes(section)){
          requestAnimationFrame(()=>{
            const target=$("help-"+section);
            if(target){target.scrollIntoView({block:"start"});target.focus({preventScroll:true});}
          });
        }
      }catch(error){
        closeDialog(false);
        pageTitle(tx("تعذر عرض الصفحة","Unable to display this page"));
        $("main").innerHTML=pageShell(tx("لنحاول مرة أخرى","Let’s try again"),tx("لم نرسل أي بيانات ولم نعالج أي دفعة. سجلاتك المحفوظة لم تُحذف.","No data was sent and no payment was processed. Your saved records were not deleted."),
          '<div class="notice warning">'+icon("warning")+'<span>'+esc(tx("حدث خطأ أثناء عرض هذه الصفحة.","An error occurred while displaying this page."))+'</span></div><div class="actions actions-spaced">'+button(tx("إعادة المحاولة","Try again"),"data-retry","btn primary")+routeLink("home",navLabel("home"),"btn secondary")+'</div>');
        $("main").setAttribute("aria-busy","false");
        console.error("AnoX rendering error:",error);
      }finally{ui.rendering=false;ui.lastHash=location.hash||"#home";}
    }


/* Component: search.js */
/* Search presentation. This URL screen never fetches and is not an SSRF boundary.
   A future ingestion service must validate DNS/IPs and every redirect, restrict
   egress, and bound response time, bytes and MIME types on a trusted server. */
function v2PublicURLHost(hostname){
  const host=hostname.toLowerCase().replace(/\.$/,"");
  if(!host||host==="localhost"||/(?:^|\.)(?:localhost|local|internal|home|lan|corp|intranet|invalid|test)$/.test(host))return false;
  if(host.startsWith("[")){
    const address=host.slice(1,-1),parts=address.split(":"),first=parseInt(parts[0],16),second=parseInt(parts[1]||"0",16);
    // Only global unicast, excluding documentation and transition ranges.
    return first>=0x2000&&first<=0x3fff&&first!==0x2002&&!(first===0x2001&&[0,2,0x10,0x20,0xdb8].includes(second));
  }
  if(/^\d+\.\d+\.\d+\.\d+$/.test(host)){
    const [a,b,c]=host.split(".").map(Number);
    return !(a===0||a===10||a===127||a>=224||(a===100&&b>=64&&b<=127)||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&(b===168||(b===0&&(c===0||c===2))))||(a===198&&(b===18||b===19||(b===51&&c===100)))||(a===203&&b===0&&c===113));
  }
  return host.includes(".")&&host.split(".").every(label=>/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i.test(label));
}
function v2ClassifySearch(value){
  const raw=String(value??"").trim();
  const looksLikeURL=/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith("//")||/^www\./i.test(raw);
  if(!looksLikeURL)return raw.length>100?{kind:"invalid",reason:"query-length"}:{kind:"query",query:raw};
  if(raw.length>2000)return {kind:"invalid",reason:"url-length"};
  if(/[\u0000-\u0020\u007f\\]/.test(raw))return {kind:"invalid",reason:"url-invalid"};
  let parsed;try{parsed=new URL(raw);}catch{return {kind:"invalid",reason:"url-invalid"};}
  if(!["https:","http:"].includes(parsed.protocol))return {kind:"invalid",reason:"scheme"};
  if(parsed.username||parsed.password)return {kind:"invalid",reason:"credentials"};
  if(!v2PublicURLHost(parsed.hostname))return {kind:"invalid",reason:"public-host"};
  if(parsed.protocol!=="https:")return {kind:"invalid",reason:"https-required"};
  if(parsed.href.length>2000)return {kind:"invalid",reason:"url-length"};
  return {kind:"url",url:raw,host:parsed.hostname};
}
function v2SearchMessage(reason){
  const labels={
    "query-length":tx("اجعل البحث 100 حرف أو أقل.","Keep your search to 100 characters or fewer."),
    "url-length":tx("يقبل نموذج الطلب روابط بطول 2000 حرف كحد أقصى. استخدم رابطًا أقصر؛ لم نقتطع الرابط.","The request form accepts links up to 2,000 characters. Use a shorter link; your link has not been truncated."),
    "https-required":tx("تم التعرف على الرابط. يتطلب نموذج الطلب رابط HTTPS آمنًا؛ الصق النسخة الآمنة من صفحة المنتج.","Link recognized. The request form requires HTTPS; paste the secure version of the product page."),
    "credentials":tx("استخدم رابط منتج دون اسم مستخدم أو كلمة مرور مضمنة.","Use a product link without an embedded username or password."),
    "public-host":tx("استخدم رابط موقع عام، وليس عنوانًا محليًا أو خاصًا.","Use a public website link, rather than a local or private address."),
    "scheme":tx("الصق رابط منتج يبدأ بـ https://.","Paste a product link that starts with https://."),
    "url-invalid":tx("تحقق من الرابط والصق عنوان صفحة منتج كاملًا يبدأ بـ https://.","Check the link and paste a complete https:// product page address.")
  };
  return labels[reason]||labels["url-invalid"];
}
function v2RequestFromURL(value){
  const result=v2ClassifySearch(value);if(result.kind!=="url")return false;
  // Preserve the complete link in the existing draft; do not route it through
  // requestFromQuery, which is intentionally a product-name-only helper.
  captureForms();
  const previous=state.drafts.request||{};
  const form=$("request-form");if(form)form.dataset.discarded="true";
  state.drafts.request={...previous,name:previous.url===result.url?(previous.name||""):"",url:result.url};
  delete ui.formMemory["request-form"];
  navigate("request");return true;
}
function submitSearch(value){
  const result=v2ClassifySearch(value);
  if(result.kind==="url"){v2RequestFromURL(result.url);return;}
  if(result.kind==="invalid"){
    if($("search-query"))renderSuggestions();
    else openSearch(String(value??""));
    $("search-query")?.focus();return;
  }
  const query=result.query;saveRecent(query);
  ui.filters=defaultFilters();ui.sort="featured";
  navigate("search",query?{q:query}:{});
}
let v2SearchBound=false;
function v2BindSearch(){
  if(v2SearchBound)return;v2SearchBound=true;
  // Clear old options immediately, so Enter/click during the debounce cannot
  // activate a suggestion for text the shopper has already replaced.
  document.addEventListener("input",event=>{
    if(event.target.id!=="search-query")return;
    ui.searchIndex=-1;ui.searchItems=[];
    event.target.removeAttribute("aria-activedescendant");
    event.target.setAttribute("aria-expanded","false");
    const suggestions=$("suggestions");if(suggestions)suggestions.innerHTML="";
  },true);
}
function openSearch(query=""){
  v2BindSearch();ui.searchIndex=-1;
  openDialog("search",tx("اعثر على اختيارك القادم","Find your next discovery"),
    '<div class="v2-search"><p class="v2-search-intro">'+esc(tx("ابحث في الكتالوج أو الصق رابط منتج لبدء طلب خاص.","Search the catalog or paste a product link to start a request."))+'</p><div class="v2-search-input-row">'+icon("search")+'<label class="sr-only" for="search-query">'+esc(tx("ابحث عن منتج أو مجموعة أو فئة، أو الصق رابطًا","Search a product, collection or category, or paste a link"))+'</label><input class="input" id="search-query" type="search" value="'+esc(String(query??""))+'" maxlength="2048" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-describedby="v2-search-help v2-search-error" aria-expanded="false" placeholder="'+esc(tx("منتج، مجموعة، فئة أو رابط…","Product, collection, category or link…"))+'"></div><p id="v2-search-error" class="v2-search-error" hidden></p><div id="suggestions" role="listbox" aria-label="'+esc(tx("اقتراحات البحث","Search suggestions"))+'"></div><p class="sr-only" id="search-status" role="status" aria-live="polite"></p><p class="v2-search-help" id="v2-search-help">'+esc(tx("↑ ↓ للاختيار · Enter للمتابعة · Esc للإغلاق.","↑ ↓ to choose · Enter to continue · Esc to close."))+'</p></div>');
  renderSuggestions();
}
function renderSuggestions(){
  const input=$("search-query"),target=$("suggestions");if(!input||!target)return;
  const result=v2ClassifySearch(input.value),error=$("v2-search-error");
  ui.searchItems=[];let markup="";
  function option(item,html){
    const index=ui.searchItems.push(item)-1;
    return '<button type="button" class="v2-suggestion" role="option" tabindex="-1" id="suggestion-'+index+'" aria-selected="'+(ui.searchIndex===index)+'" data-suggestion="'+index+'">'+html+'</button>';
  }
  function label(value){return '<div class="v2-suggestion-label">'+esc(value)+'</div>';}
  function copy(title,detail=""){return '<span class="v2-suggestion-copy"><strong>'+esc(title)+'</strong>'+(detail?'<small>'+esc(detail)+'</small>':"")+'</span>';}
  if(error){error.hidden=result.kind!=="invalid";error.textContent=result.kind==="invalid"?v2SearchMessage(result.reason):"";}
  input.setAttribute("aria-invalid",String(result.kind==="invalid"));
  if(result.kind==="url"){
    markup=label(tx("رابط منتج","Product link"))+option({type:"url-request",url:result.url},'<span class="v2-suggestion-symbol">'+icon("external")+'</span>'+copy(tx("ابدأ طلبًا بهذا الرابط","Start a request with this link"),result.host)+icon("arrow","arrow"))+'<p class="v2-search-note">'+esc(tx("أضف اسم المنتج وخياراته إلى الرابط، ثم راجع طلبك.","Add the product name and your preferred options, then review your request."))+'</p>';
  }else if(result.kind==="query"&&result.query){
    const query=result.query,products=SearchService.search(query),normalized=normalizeSearch(query);
    const matchingBrands=[...new Set(products.map(product=>product.brand))].filter(name=>normalizeSearch(name).includes(normalized)).slice(0,2);
    const matchingCategories=[...new Set(products.map(product=>product.category))].filter(key=>normalizeSearch([key,CATEGORIES[key]?.ar,CATEGORIES[key]?.en].join(" ")).includes(normalized)).slice(0,2);
    if(matchingCategories.length){markup+=label(tx("الفئات","Categories"));markup+=matchingCategories.map(category=>option({type:"category",category},icon("bag")+copy(v2CategoryLabel(category),tx("استكشف الفئة","Explore the category"))+icon("arrow","arrow"))).join("");}
    if(matchingBrands.length){markup+=label(tx("المجموعات","Collections"));markup+=matchingBrands.map(brandName=>option({type:"brand",brand:brandName},icon("box")+copy(brandName,tx("اكتشف المجموعة","Explore the collection"))+icon("arrow","arrow"))).join("");}
    if(products.length){
      markup+=label(tx("المنتجات","Products"));
      markup+=products.slice(0,5).map(product=>option({type:"product",id:product.id},'<span class="v2-suggestion-art">'+productArt(product)+'</span>'+copy(localized(product.name),product.brand+" · "+v2CategoryLabel(product.category))+'<bdi>'+formatUSD(product.priceCents)+'</bdi>')).join("");
      markup+=option({type:"search",query},copy(tx("عرض كل النتائج","View all results"),products.length+" "+tx("منتج","products"))+icon("arrow","arrow"));
    }else{
      markup+='<p class="v2-search-note">'+esc(tx("لا توجد منتجات مطابقة. جرّب كلمة أخرى أو ابدأ طلب منتج خاص.","No products matched. Try another word or start a product request."))+'</p>';
      markup+=option({type:"request",query},icon("box")+copy(tx("اطلب منتجًا بهذا الاسم","Request a product with this name"),query)+icon("arrow","arrow"));
    }
  }else if(result.kind==="query"){
    const recent=state.recent.filter(query=>v2ClassifySearch(query).kind==="query").slice(0,4);
    if(recent.length){markup+=label(tx("عمليات البحث الأخيرة","Recent searches"));markup+=recent.map(query=>option({type:"search",query},icon("search")+copy(query,tx("بحث سابق","Recent search")))).join("");}
    markup+=label(tx("ابدأ بفئة","Start with a category"));
    markup+=Object.keys(CATEGORIES).slice(0,5).map(category=>option({type:"category",category},icon("bag")+copy(v2CategoryLabel(category))+icon("arrow","arrow"))).join("");
    markup+='<p class="v2-search-note">'+esc(tx("هل وجدت منتجًا في موقع آخر؟ الصق رابط المنتج لبدء طلبك.","Found a product elsewhere? Paste the product link to start your request."))+'</p>';
  }
  target.innerHTML=markup;input.setAttribute("aria-expanded",String(ui.searchItems.length>0));
  $("search-status").textContent=result.kind==="invalid"?v2SearchMessage(result.reason):ui.searchItems.length+" "+tx("اقتراح متاح","suggestions available");
  if(ui.searchIndex>=ui.searchItems.length)ui.searchIndex=-1;
  updateSearchSelection();
}
function activateSuggestion(index){
  const item=ui.searchItems[index];if(!item)return;
  const input=$("search-query"),result=v2ClassifySearch(input?input.value:"");
  if(item.type==="url-request"){v2RequestFromURL(item.url);return;}
  if(item.type==="product"){if(result.kind==="query")saveRecent(result.query);openProduct(item.id);}
  else if(item.type==="request")requestFromQuery(item.query);
  else if(item.type==="category"||item.type==="brand"){
    if(result.kind==="query"&&result.query)saveRecent(result.query);
    ui.filters=defaultFilters();ui.sort="featured";
    navigate("shop",item.type==="category"?{category:item.category}:{brand:item.brand});
  }else submitSearch(item.query);
}

function renderSearch(){
  const query=text(currentRoute().params.get('q')||'',100).trim();
  pageTitle(tx('نتائج البحث','Search results'));
  if(Catalog.liveStatus==='idle'||Catalog.liveQuery!==query)void ensureLiveCatalog(query);
  const usingLive=Catalog.usingLive(query),source=usingLive?Catalog.liveSource(query):[];
  const heading='<header class="v2-category-heading"><nav class="v2-breadcrumb" aria-label="'+esc(tx('مسار التنقل','Breadcrumb'))+'">'+routeLink('home',tx('الرئيسية','Home'))+'<span aria-hidden="true">/</span><span>'+esc(tx('البحث','Search'))+'</span></nav><div class="v2-category-title"><div><h1>'+esc(query?tx('نتائج «','Results for “')+query+(state.lang==='ar'?'»':'”'):tx('ابحث عن اختيارك القادم','Find your next discovery'))+'</h1></div></div><form class="v2-search-page-form" id="search-page-form"><label class="sr-only" for="search-page-input">'+esc(tx('منتج، علامة، فئة أو رابط','Product, brand, category or URL'))+'</label><input class="input" id="search-page-input" name="q" type="search" maxlength="2048" value="'+esc(query)+'" placeholder="'+esc(tx('ابحث عن منتج أو الصق رابطًا','Search products or paste a link'))+'"><button class="btn primary" type="submit">'+icon('search')+'<span>'+esc(tx('بحث','Search'))+'</span></button></form></header>';
  if(Catalog.liveStatus==='loading'&&!Catalog.liveRecords.length){$('main').innerHTML='<div class="v2-page v2-catalog-page v2-search-page"><div class="v2-container">'+heading+liveCatalogStateMessage('loading',query)+'</div></div>';return;}
  if(Catalog.liveStatus==='unavailable'){ $('main').innerHTML='<div class="v2-page v2-catalog-page v2-search-page"><div class="v2-container">'+heading+liveCatalogStateMessage('unavailable',query)+'</div></div>';return; }
  V2CatalogPage(heading,filteredProducts(source),query,'v2-search-page');
}


/* Component: storefront.js */
/* Storefront presentation only. Pricing and catalog records stay in the verified core. */
function V2Price(product) {
  const sale=whole(product.compareAtPriceCents,0,1e8)&&product.compareAtPriceCents>product.priceCents;
  return '<div class="v2-price"><bdi>'+formatUSD(product.priceCents)+'</bdi>'+(sale?'<del>'+formatUSD(product.compareAtPriceCents)+'</del>':'')+'</div>';
}
function liveProductMeta(product){if(product.source?.mode!=='live')return '';const availability=product.stock>0?tx('متوفر','Available'):tx('غير متوفر','Unavailable');const updated=product.updatedAt?dateLabel(product.updatedAt,true):tx('تاريخ التحديث غير متاح','Update date unavailable');return '<div class="v2-live-product-meta"><span class="'+(product.stock>0?'is-available':'is-unavailable')+'">'+esc(tx('التوفر: ','Availability: ')+availability)+'</span><span>'+esc(tx('آخر تحديث: ','Updated: ')+updated)+'</span></div>';}
function liveProductLink(product,label=tx('عرض المنتج','View product')){const url=safeURL(product.source?.merchantUrl);return url?'<a class="text-btn v2-live-product-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':'<span class="fine">'+esc(tx('رابط المنتج غير متاح','Product link unavailable'))+'</span>';}

function V2LandedCost(product,{compact=true}={}) {
  const estimate=productQuote(product);
  return '<div class="v2-landed-cost'+(compact?'':' v2-landed-cost--large')+'"><span>'+esc(tx('وصول تقديري إلى الجزائر','Estimated to Algeria'))+'</span><bdi>'+formatDZD(estimate.totalDzd)+'</bdi><small>'+esc(tx('دون الجمارك','Excludes customs'))+'</small></div>';
}

function productCard(product,context='catalog') {
  const liked=state.wishlist.includes(product.id),name=localized(product.name),live=product.source?.mode==='live';
  const productAttributes='href="#product/'+esc(product.slug)+'" data-product="'+esc(product.id)+'"';
  const wishlistAction=context==='wishlist'?'<div class="v2-product-card-action"><button type="button" class="v2-card-option" data-options="'+esc(product.id)+'" data-move-wishlist="true" '+(!product.stock?'disabled':'')+'>'+esc(product.stock?tx('اختر الخيارات','Choose options'):tx('غير متوفر','Unavailable'))+'</button></div>':(!product.stock&&!live?'<p class="v2-product-availability">'+esc(tx('غير متوفر','Unavailable'))+'</p>':'');
  const action=live?liveProductLink(product):wishlistAction;
  return '<article class="v2-product-card"><div class="v2-product-card-visual"><a class="v2-product-card-image" '+productAttributes+' aria-label="'+esc(tx('عرض المنتج: ','View product: ')+name)+'">'+productArt(product,product.colors[0],0,!live)+'</a><button type="button" class="v2-product-wishlist" data-wishlist="'+esc(product.id)+'" aria-label="'+esc(navLabel('wishlist')+' · '+name)+'" aria-pressed="'+liked+'">'+icon('heart')+'</button></div><div class="v2-product-card-info"><span class="v2-product-card-brand">'+esc(product.brand)+'</span><a class="v2-product-card-name" '+productAttributes+'>'+esc(name)+'</a>'+V2Price(product)+liveProductMeta(product)+action+'</div></article>';
}

function V2CategoryTile({category,product,route,label}) {
  const destination=route||'shop?category='+encodeURIComponent(category);
  return '<a class="v2-category-tile" href="#'+esc(destination)+'" data-nav><span class="v2-category-tile-art" aria-hidden="true">'+productArt(product,product.colors[0],0,true)+'</span><span class="v2-category-tile-label">'+esc(label||v2CategoryLabel(category))+icon('arrow')+'</span></a>';
}

function V2ProductRail({id,title,kicker,products,route='shop',linkLabel}) {
  const items=products.filter(Boolean);
  if(!items.length)return '';
  return '<section class="v2-home-section v2-product-rail" aria-labelledby="'+esc(id)+'-title"><div class="v2-section-heading"><div>'+(kicker?'<p class="v2-kicker">'+esc(kicker)+'</p>':'')+'<h2 id="'+esc(id)+'-title">'+esc(title)+'</h2></div>'+routeLink(route,linkLabel||tx('اكتشف المجموعة','Explore the edit'),'v2-inline-link')+'</div><div class="v2-product-rail-track" role="region" aria-labelledby="'+esc(id)+'-title" tabindex="0" style="--v2-rail-count:'+Math.min(4,items.length)+'">'+items.map(product=>productCard(product,'home')).join('')+'</div></section>';
}

function V2HomeCostExample(product) {
  const estimate=productQuote(product);
  const rows=[
    [tx('سعر المنتج','Item price'),estimate.subtotalCents],
    [tx('خدمة AnoX','AnoX fee'),estimate.serviceCents],
    [tx('الشحن','Shipping'),estimate.shippingCents]
  ];
  return '<div class="v2-cost-example"><div class="v2-cost-example-product"><span class="v2-cost-example-art" aria-hidden="true">'+productArt(product,product.colors[0],0,true)+'</span><div><p class="v2-kicker">'+esc(tx('مثال لقطعة واحدة','A one-item example'))+'</p><h3>'+esc(localized(product.name))+'</h3></div></div><dl class="v2-cost-rows">'+rows.map(([label,value])=>'<div><dt>'+esc(label)+'</dt><dd><bdi>'+formatUSD(value)+'</bdi></dd></div>').join('')+'</dl>'+V2LandedCost(product,{compact:false})+'<p class="v2-cost-exclusions">'+esc(tx('لا يشمل الجمارك والضرائب المحلية والتأمين. تعتمد المبالغ على سعر الصرف وتكاليف الشحن الحالية للحساب.','Excludes customs, local taxes and insurance. Amounts use the current exchange-rate and shipping assumptions.'))+'</p></div>';
}
