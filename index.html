  <style>
@layer compatibility {


    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:100px;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--font);overflow-wrap:break-word}
    html[dir="rtl"] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    body.modal-open{overflow:hidden}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48;box-shadow:none!important;transform:none!important}
    input,select,textarea{min-width:0}
    a{color:inherit;text-decoration:none}
    img,svg{max-width:100%}
    svg{display:block}
    h1,h2,h3,h4,p,figure{margin:0}
    h1,h2,h3,h4{line-height:1.17;letter-spacing:-.045em}
    html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0;line-height:1.45}
    h1{font-size:clamp(2.25rem,5.2vw,4.8rem);font-weight:600}
    h2{font-size:clamp(1.8rem,3.1vw,3rem);font-weight:600}
    h3{font-size:1.25rem;font-weight:600}
    p{overflow-wrap:anywhere}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    [tabindex="-1"]:focus{outline:none}
    ::selection{background:#c5d2ff;color:#101b2a}
    .container{width:min(calc(100% - 64px),var(--max));margin-inline:auto}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip-link:focus{position:fixed;inset:12px auto auto 12px;z-index:300;width:auto;height:auto;margin:0;padding:12px 20px;clip:auto;background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:var(--shadow)}
    .muted{color:var(--muted)}
    .fine{font-size:var(--text-label);line-height:1.65;color:var(--muted)}
    .eyebrow{display:flex;align-items:center;gap:10px;font-size:var(--text-label);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    .eyebrow::before{content:"";width:22px;height:2px;background:currentColor;flex:none}
    html[dir="rtl"] .eyebrow{letter-spacing:0}
    .section{padding-block:72px}
    .section-tight{padding-block:46px}
    .page{padding-block:48px 84px;min-height:55vh}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:34px}
    .page-heading h1{margin-block:13px}
    .page-heading p{max-width:760px;color:var(--muted);font-size:1.04rem}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:26px}
    .section-head h2{margin-top:12px}
    .surface{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
    .stack>*+*{margin-top:20px}
    .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .actions-spaced{margin-top:24px}
    .btn{min-height:48px;padding:11px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:99px;font-weight:600;font-size:.93rem;line-height:1.4;transition:background .18s,transform .18s,box-shadow .18s;text-align:center}
    .btn:hover{transform:translateY(-1px)}
    .btn.primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(49,84,206,.12)}
    .btn.primary:hover{background:var(--blue-hover)}
    .btn.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}
    .btn.secondary:hover{background:var(--paper-2)}
    .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
    .btn.small{min-height:44px;font-size:var(--text-label);padding-inline:16px}
    .btn.full{width:100%}
    form[aria-busy="true"] button[type="submit"]{cursor:progress;opacity:.7}
    .text-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px;border:0;background:none;color:var(--accent);font-size:var(--text-label);font-weight:600;border-radius:8px}
    .text-btn:hover{text-decoration:underline}
    .icon-btn{width:44px;min-width:44px;height:44px;padding:10px;border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);position:relative}
    .icon-btn:hover{background:var(--paper-2)}
    .icon{width:21px;height:21px;flex:none;display:inline-block;vertical-align:middle}
    .arrow{transition:transform .2s}
    html[dir="rtl"] .arrow,html[dir="rtl"] .menu-links a>span{transform:rotate(180deg)}
    .pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:var(--text-label);font-weight:600;color:var(--muted);background:var(--paper-2)}
    .pill.success{color:var(--success)}
    .notice{display:flex;gap:11px;padding:15px 17px;border-radius:13px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);font-size:var(--text-label)}
    .notice>.icon{margin-top:2px}
    .notice.warning{color:var(--warning)}
    .notice.success{color:var(--success)}
    .price-number,bdi{font-variant-numeric:tabular-nums}
    .price-number{white-space:normal;overflow-wrap:anywhere}
    .route-enter{animation:route-enter .22s var(--ease)}
    @keyframes route-enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}
    .announcement{min-height:34px;padding:7px 16px;text-align:center;background:var(--deep);color:var(--on-deep);font-size:var(--text-label);line-height:1.5}
    .site-header{position:sticky;top:0;z-index:50;background:var(--header);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .brand{display:inline-flex;min-height:44px;align-items:center;gap:10px;white-space:nowrap;flex:none;font-size:1.55rem;font-weight:600;letter-spacing:-.065em;line-height:1.2}
    .brand-mark{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#497dfc,#3154ce);font-size:23px;font-weight:600;letter-spacing:-.08em}
    kbd{font:inherit;font-size:var(--text-label);padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}
    .badge{position:absolute;top:0;inset-inline-end:0;min-width:22px;height:22px;display:grid;place-items:center;padding-inline:4px;border:2px solid var(--paper);border-radius:99px;background:var(--blue);color:#fff;font-size:var(--text-label);font-weight:600}
    .storage-banner{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;font-size:var(--text-label);color:var(--warning);text-align:center}
    .mobile-nav{display:none}
    .menu-links{display:grid;gap:3px}
    .menu-links a{display:flex;align-items:center;justify-content:space-between;min-height:49px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:1.05rem;font-weight:600}
    .menu-links a[aria-current="page"]{color:var(--accent)}
    .menu-tools{display:flex;gap:10px;margin-top:24px}
    .scene-label{position:absolute;top:18px;inset-inline-start:18px;z-index:4;background:#f6fbffcc;padding:7px 11px;border-radius:6px;font:700 var(--text-label)/1.3 var(--font);letter-spacing:.14em;direction:ltr}
    .scene-floor{position:absolute;left:-15%;right:-15%;height:43%;bottom:-18%;background:linear-gradient(120deg,#f5f8fb,#a9bed3);transform:rotate(-9deg);box-shadow:0 -10px 50px #ffffff70}
    .plinth{position:absolute;background:linear-gradient(120deg,#fcffff,#bccbdc);box-shadow:20px 24px 35px #344b6726;border-radius:3px}
    .plinth.back{width:37%;height:34%;left:39%;bottom:23%;transform:skewY(-8deg)}
    .plinth.front{width:53%;height:24%;left:9%;bottom:2%;transform:skewY(-8deg)}
    .product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
    .pagination-gap{color:var(--muted);padding:0 2px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink-2);font-size:var(--text-label)}
    .chip:hover{color:var(--accent);border-color:var(--accent)}
    .empty{border:1px dashed var(--line);border-radius:24px;background:var(--paper);padding:60px 25px;text-align:center}
    .empty-icon{display:grid;place-items:center;width:72px;height:72px;background:var(--paper-2);border-radius:50%;margin:0 auto 22px;color:var(--accent)}
    .empty-icon .icon{width:30px;height:30px}
    .empty h2,.empty h3{font-size:1.5rem}
    .empty p{color:var(--muted);max-width:540px;margin:15px auto 23px}
    .empty .actions{justify-content:center}
    .search-page-form{display:flex;gap:12px;margin-bottom:26px;padding:17px}
    .search-page-form input{flex:1}
    .collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .collection-card{display:block;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;text-align:start;color:var(--ink);padding:0}
    .collection-card .art{aspect-ratio:1.8;overflow:hidden}
    .collection-card svg{width:100%;height:100%}
    .collection-card strong,.collection-card span{display:block;padding-inline:22px}
    .collection-card strong{font-size:1.3rem;margin-block:18px 7px}
    .collection-card span{color:var(--muted);font-size:var(--text-label);margin-bottom:22px}
    .editorial-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
    .editorial-feature{background:var(--deep);color:#fff;border-radius:24px;padding:35px;overflow:hidden}
    .editorial-feature .eyebrow{color:#a9baff}
    .editorial-feature svg{max-height:340px;margin:10px auto}
    .editorial-feature h2{font-size:2rem;margin-bottom:14px}
    .editorial-feature p{color:#c2cddd;font-size:var(--text-base);margin-bottom:22px}
    .editorial-side{display:grid;gap:24px}
    .editorial-small{display:grid;grid-template-columns:1fr 1fr;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;padding:22px;gap:15px}
    .editorial-small svg{border-radius:14px}
    .editorial-small h3{margin-top:10px;font-size:1.2rem}
    .split{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;align-items:start}
    .summary{border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:25px}
    .summary-head{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
    .summary-head strong{font-size:1rem;line-height:1.6}
    .summary-head .pill{flex:none;max-width:100%;font-size:var(--text-label)}
    .summary-row{display:flex;justify-content:space-between;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);font-size:var(--text-label);align-items:baseline;flex-wrap:wrap}
    .summary-row>span{color:var(--muted)}
    .summary-row bdi{white-space:normal;overflow-wrap:anywhere;font-weight:600}
    .summary-row.total{font-size:var(--text-base);border-bottom:0;padding-top:17px;font-weight:600}
    .summary-row.total>span{color:var(--ink)}
    .landed-total{padding:5px 0 20px}
    .landed-total strong{display:block;font-size:1.95rem;line-height:1.4;letter-spacing:-.04em}
    .landed-total span{font-size:var(--text-label);color:var(--muted)}
    .rate-foot{border-top:1px solid var(--line);margin-top:17px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:var(--text-label)}
    .cost-boundaries{margin-top:20px;border-top:1px solid var(--line);font-size:var(--text-label)}
    .cost-boundaries summary{min-height:48px;padding-block:12px;font-weight:650;cursor:pointer;color:var(--ink-2)}
    .cost-boundaries[open] summary{margin-bottom:4px}
    .cost-boundaries .spec-list{margin-top:12px}
    .summary.compact{padding:0;border:0;background:transparent}
    .summary .fine{font-size:var(--text-label)}
    .cart-line{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:19px;padding-block:24px;border-bottom:1px solid var(--line);align-items:start}
    .cart-line:first-child{padding-top:0}
    .cart-line:last-child{border-bottom:0;padding-bottom:0}
    .line-art{display:block;width:100%;border:0;padding:0;background:#e6edf5;border-radius:13px;overflow:hidden}
    .line-art svg{width:100%;height:auto}
    .line-info h3{font-size:1.04rem;line-height:1.5;margin-top:3px}
    .line-info p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .line-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:14px}
    .line-price{text-align:end;min-width:0;flex-wrap:wrap}
    .line-price strong{display:block;font-size:var(--text-base)}
    .line-price span{display:block;color:var(--muted);font-size:var(--text-label);margin-top:5px}
    .quantity{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden;min-height:44px;background:var(--paper)}
    .quantity button{width:44px;height:44px;padding:10px;border:0;color:var(--ink);background:none}
    .quantity button:hover{background:var(--paper-2)}
    .quantity span{min-width:26px;text-align:center;font-weight:600;font-size:var(--text-label)}
    .checkout-steps{display:flex;list-style:none;padding:0;margin:0 0 27px;gap:12px;counter-reset:step}
    .checkout-steps li{flex:1;display:flex;align-items:center;gap:10px;font-size:var(--text-label);color:var(--muted);padding:13px 15px;background:var(--paper);border:1px solid var(--line);border-radius:13px}
    .checkout-steps li::before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:29px;height:29px;flex:none;border-radius:50%;background:var(--paper-2);font-weight:600;font-size:var(--text-label)}
    .checkout-steps li[aria-current="step"]{border-color:var(--accent);color:var(--accent)}
    .checkout-steps li[aria-current="step"]::before{background:var(--blue);color:#fff}
    .review-address{margin-bottom:24px}
    .review-address h2{font-size:1.25rem;margin-bottom:14px}
    .review-address p{font-size:var(--text-base);color:var(--ink-2)}
    .review-address .text-btn{margin-top:9px}
    .order-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
    .snapshot-item{display:flex;justify-content:space-between;gap:18px;padding-block:20px;border-bottom:1px solid var(--line)}
    .snapshot-item:last-child{border:0}
    .snapshot-item h3{font-size:1rem;line-height:1.5}
    .snapshot-item p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .snapshot-item>div:last-child{text-align:end;white-space:nowrap}
    .snapshot-item small{display:block;color:var(--muted);font-size:var(--text-label);margin-top:5px}
    .order-delivery{margin-top:24px}
    .order-delivery h2{font-size:1.2rem;margin-bottom:15px}
    .order-delivery p{font-size:var(--text-base);color:var(--ink-2)}
    .success-banner{margin-bottom:26px}
    .order-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.93rem;overflow-wrap:anywhere}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:21px 18px}
    .field{min-width:0}
    .field.full{grid-column:1/-1}
    .field label{display:block;font-weight:600;font-size:var(--text-label);margin-bottom:8px}
    .input,.select,.textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);background:var(--paper);outline-offset:2px;line-height:1.5}
    .textarea{resize:vertical;min-height:118px}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--focus)}
    [aria-invalid="true"]{border-color:var(--danger)!important}
    .field-error{display:block;min-height:1.3em;font-size:var(--text-label);color:var(--danger);padding-top:5px}
    .field-help{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .form-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:25px}
    .request-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:42px;align-items:start}
    .request-aside{padding:20px}
    .request-aside h2{margin-block:18px 22px;line-height:1.45}
    .request-steps{list-style:none;padding:0;margin:20px 0}
    .request-steps li{padding-block:18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.95rem}
    .business-aside{padding:34px;background:var(--deep);color:white;border-radius:22px}
    .business-aside .eyebrow{color:#a9baff}
    .business-aside h2{margin-block:20px;line-height:1.4}
    .business-aside p{color:#c3cede;font-size:var(--text-base)}
    .requests-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .request-card{display:flex;flex-direction:column;align-items:start;gap:14px}
    .request-card h2{font-size:1.3rem;line-height:1.5}
    .request-card .btn{margin-top:auto}
    .request-card .request-card-top{display:flex;align-items:center;gap:12px;justify-content:space-between;width:100%}
    .spec-list{margin:0}
    .spec-list>div{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.2fr);gap:16px;border-bottom:1px solid var(--line);padding-block:13px;font-size:var(--text-label)}
    .spec-list dt{color:var(--muted)}
    .spec-list dd{margin:0;font-weight:650;overflow-wrap:anywhere}
    .request-details h2{font-size:1.7rem;margin-block:15px 20px}
    .source-link{display:inline-flex;gap:6px;align-items:center;font-size:var(--text-label);color:var(--accent);margin-block:20px;overflow-wrap:anywhere}
    .request-notes{white-space:pre-wrap;color:var(--muted);font-size:var(--text-base);margin-block:16px}
    .quote-decision{margin-top:22px}
    .quote-decision p{margin-top:13px;font-size:var(--text-base)}
    .quote-decision .actions{margin-top:21px}
    .budget-warning{color:var(--warning)}
    .account-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}
    .account-nav{display:grid;gap:7px;align-content:start}
    .account-nav a,.account-nav button{display:block;text-align:start;padding:12px 15px;min-height:45px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:11px;font-weight:600;font-size:.9rem}
    .profile-form{display:flex;align-items:flex-end;gap:16px}
    .profile-form .field{flex:1}
    .profile-form .field-error{display:none}
    .account-section{margin-top:30px}
    .account-section>h2{font-size:1.5rem;margin-bottom:20px}
    .order-card{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px;border:1px solid var(--line);border-radius:17px;background:var(--paper);margin-bottom:12px}
    .order-card h3{font-size:var(--text-base);line-height:1.5}
    .order-card p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .order-card-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}

/* navigation.css */
/* Header: utility row, primary row, category disclosures. */
.v2-site-header{background:var(--paper);backdrop-filter:none;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.v2-utility{background:var(--paper-2);border-bottom:1px solid var(--line);font-size:.75rem;color:var(--ink-2)}
.v2-utility-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px}
.v2-utility-links{display:flex;align-items:center;gap:22px}
.v2-utility-links>a,.v2-utility-links>button{display:inline-flex;align-items:center;min-height:34px;background:none;border:0;padding:0;color:inherit;font-size:inherit}
.v2-theme-button{justify-content:center;width:30px}
.v2-theme-button .icon{width:17px;height:17px}
.v2-header-main{display:grid;grid-template-columns:160px minmax(180px,1fr) auto;align-items:center;gap:36px;min-height:92px}
.v2-header-brand{font-size:2rem;min-height:44px;letter-spacing:-.075em;display:inline-flex;align-items:center}
.v2-header-search{display:flex;align-items:center;gap:13px;min-width:0;min-height:48px;width:100%;padding:10px 16px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-sm,10px);color:var(--muted);text-align:start;font-size:.9375rem}
.v2-header-search:hover{border-color:var(--ink-2)}
.v2-header-search>span{min-width:0;flex:1}
.v2-header-search>kbd{display:grid;place-items:center;flex:none;width:23px;height:24px;border:1px solid var(--line);border-radius:4px;font:inherit;color:var(--muted);background:var(--paper)}
.v2-header-actions{display:flex;align-items:center;gap:20px}
.v2-header-action{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;min-width:46px;padding:3px;background:none;border:0;color:var(--ink);font-size:.75rem;font-weight:550}
.v2-action-icon{position:relative;display:block}
.v2-action-icon>.icon{height:23px;width:23px}
.v2-header-badge{position:absolute;inset-block-start:-8px;inset-inline-end:-11px;min-width:18px;min-height:18px;border-radius:99px;padding:1px 5px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-size:.6875rem;line-height:1.3;border:2px solid var(--paper)}
.v2-menu-toggle{display:none}
.v2-category-band{border-top:1px solid var(--line)}
.v2-category-nav{position:relative}
.v2-category-list{display:flex;align-items:center;gap:21px;list-style:none;margin:0;padding:0;min-height:47px}
.v2-category-trigger,.v2-category-simple>a{display:flex;align-items:center;gap:8px;min-height:47px;padding:9px 0;background:none;border:0;color:var(--ink-2);font-size:.8125rem;font-weight:550;white-space:nowrap;text-decoration:none}
.v2-category-trigger[aria-expanded="true"],.v2-category-trigger.v2-is-current,.v2-category-trigger:hover,.v2-category-simple>a:hover{color:var(--accent)}
.v2-caret{display:block;width:6px;height:6px;border-inline-end:1.5px solid;border-block-end:1.5px solid;transform:rotate(45deg);margin-top:-3px}
[aria-expanded="true"]>.v2-caret{transform:rotate(225deg);margin-top:3px}
.v2-request-link{margin-inline-start:auto}
.v2-request-link>a{color:var(--accent)}
.v2-mega-panel{position:absolute;z-index:52;inset-inline:0;top:100%;max-height:calc(100dvh - 190px);overflow:auto;padding:28px;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;box-shadow:0 18px 35px #0002}
.v2-mega-panel[hidden]{display:none}
.v2-mega-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:30px;align-items:start}
.v2-mega-group h3{font-size:.75rem;letter-spacing:.045em;line-height:1.5;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.v2-mega-group ul{list-style:none;margin:0;padding:0}
.v2-mega-group a{display:block;min-height:36px;padding-block:7px;color:var(--ink);font-size:.875rem;line-height:1.45}
.v2-mega-group a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
.v2-mega-group p{font-size:.75rem;color:var(--muted);line-height:1.6;margin-top:12px;max-width:23ch}
.v2-mega-feature{display:block;background:var(--paper-2);border-radius:8px;overflow:hidden;min-width:0}
.v2-mega-art{display:block;height:160px;overflow:hidden}
.v2-mega-art svg,.v2-mega-art img{display:block;width:100%;height:100%;object-fit:contain}
.v2-mega-feature>span:last-child{display:grid;gap:8px;padding:16px}
.v2-mega-feature small{color:var(--muted);font-size:.6875rem;line-height:1.5}
.v2-mega-feature strong{font-size:1rem;line-height:1.4;font-weight:600}
.v2-mega-feature>span>span{font-size:.75rem;color:var(--accent)}
.v2-mega-feature .icon{height:15px;width:15px;margin-inline-start:3px}
.v2-mobile-menu a{color:var(--ink);font-size:1rem}
.v2-mobile-main-links{display:grid}
.v2-mobile-main-links>a{display:flex;align-items:center;min-height:48px;border-bottom:1px solid var(--line);padding-block:10px;font-weight:550}
.v2-mobile-menu-label{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-block:24px 10px}
.v2-mobile-category{border-bottom:1px solid var(--line)}
.v2-mobile-category>summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;cursor:pointer;font-weight:550;list-style:none}
.v2-mobile-category>summary::-webkit-details-marker{display:none}
.v2-mobile-category>summary::after{content:"+";font-size:1.4rem;font-weight:400;color:var(--muted)}
.v2-mobile-category[open]>summary::after{content:"−"}
.v2-mobile-category-links{display:grid;gap:22px;padding:14px 16px 22px;background:var(--paper-2);border-radius:8px;margin-bottom:12px}
.v2-mobile-category-links .v2-mega-group h3{margin-bottom:5px}
.v2-mobile-category-links .v2-mega-group a{min-height:44px;padding-block:11px;font-size:.875rem}
.v2-menu-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
@media(min-width:1050px) and (max-width:1200px){.v2-category-list{gap:15px}.v2-category-trigger,.v2-category-simple>a{font-size:.75rem}.v2-header-main{grid-template-columns:140px minmax(180px,1fr) auto;gap:24px}.v2-header-actions{gap:14px}}
@media(max-width:1049px){
  .v2-category-band{display:none}.v2-menu-toggle{display:flex}.v2-action-label{display:none}
  .v2-header-main{grid-template-columns:130px minmax(150px,1fr) auto;gap:22px;min-height:86px}
  .v2-header-actions{gap:10px}.v2-header-action{min-width:40px}.v2-action-account,.v2-action-wishlist{display:none}
  .v2-utility-links{gap:16px}.v2-utility-links>a{display:none}
}
@media(max-width:650px){
  .v2-utility-inner{font-size:.6875rem;min-height:32px;gap:10px}.v2-utility-links{gap:12px}
  .v2-header-main{grid-template-columns:1fr auto;gap:8px;padding-block:10px 13px;min-height:0}
  .v2-header-brand{font-size:1.75rem}.v2-header-actions{gap:7px}.v2-header-action{min-height:44px;min-width:40px}
  .v2-header-search{grid-row:2;grid-column:1/-1;min-height:44px;font-size:.8125rem;padding-inline:12px;gap:10px}
  .v2-header-search>kbd{display:none}.v2-header-search>.icon{width:19px;height:19px}
}
@media(prefers-reduced-motion:reduce){.v2-site-header *{scroll-behavior:auto;transition:none}}

margin-block:0 28px;background:var(--paper);border-radius:8px;padding:16px 20px}.v2-pdp-cost>summary{display:grid;gap:6px;cursor:pointer;list-style:none}.v2-pdp-cost>summary::-webkit-details-marker{display:none}.v2-pdp-cost>summary>span:first-child{font-size:.8125rem;color:var(--ink-2)}.v2-pdp-cost>summary strong{font-size:1.3rem;font-weight:500;overflow-wrap:anywhere}.v2-pdp-cost>summary small{font-size:.75rem;color:var(--muted);line-height:1.8}.v2-cost-link{font-size:.8125rem;color:var(--accent);text-decoration:underline;text-underline-offset:4px;padding-top:4px;min-height:32px}.v2-pdp-breakdown{padding-top:20px}.v2-pdp-breakdown .summary{padding:0;background:transparent}.v2-pdp-breakdown :is(.summary-head,.landed-total){display:none}.v2-option{border:0;padding:0;margin:0 0 24px;min-width:0}.v2-option legend{font-size:.875rem;margin-bottom:12px;float:none}.v2-option legend span{margin-inline-start:12px;color:var(--muted)}.v2-swatches{display:flex;flex-wrap:wrap;gap:12px;padding:2px}.v2-swatch{width:44px;height:44px;border:4px solid var(--elevated);outline:1px solid #7b8078;border-radius:50%;position:relative}.v2-swatch[aria-pressed="true"]{outline:2px solid var(--accent)}.v2-swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:10px;border:2px solid white;border-top:0;border-left:0;width:8px;height:12px;transform:rotate(45deg);filter:drop-shadow(0 1px 1px black)}.v2-sizes{display:flex;gap:8px;flex-wrap:wrap}.v2-size{min-width:50px;min-height:44px;border:1px solid #8a9186;border-radius:6px;background:var(--elevated);color:var(--ink);padding:8px 12px;font-size:.875rem}.v2-size[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--paper)}.v2-size:disabled{text-decoration:line-through}.v2-option-help{font-size:.8125rem;color:var(--muted);margin-top:12px}.v2-option-label{display:block;font-size:.875rem;margin-bottom:10px}.v2-quantity-stock{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.v2-quantity-stock>p{color:var(--muted);font-size:.8125rem;max-width:180px}.v2-pdp-actions{display:flex;gap:12px}.v2-pdp-actions>.primary{flex:1;min-height:52px}.v2-pdp-wish{display:grid;place-items:center;min-width:52px;border:1px solid var(--line);border-radius:8px;background:transparent}.v2-pdp-wish[aria-pressed="true"]{color:var(--accent);background:var(--paper)}.v2-pdp-trust{font-size:.8125rem;color:var(--muted);margin-block:16px 28px}.v2-product-disclosure,.v2-size-guide{border-top:1px solid var(--line)}.v2-product-disclosure>summary,.v2-size-guide summary{padding-block:16px;min-height:52px;cursor:pointer;font-size:.9375rem;font-weight:500}.v2-product-disclosure>div{padding-bottom:24px;font-size:.875rem;color:var(--ink-2);line-height:1.85}.v2-product-disclosure .spec-list{margin-top:20px}.v2-size-guide .size-guide{border:0;margin:0}.v2-pdp-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}html[data-theme="dark"] .v2-size{border-color:#686868}html[dir="rtl"] .v2-pdp-brand{letter-spacing:0}

/* search.css */
.v2-search{min-width:0}
.v2-search-intro{font-size:.875rem;line-height:1.7;color:var(--muted);margin:0 0 18px}
.v2-search-input-row{display:flex;align-items:center;gap:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.v2-search-input-row:focus-within{outline:2px solid var(--focus);outline-offset:3px}
.v2-search-input-row>.icon{color:var(--muted);width:22px;height:22px}
.v2-search-input-row #search-query{border:0;background:transparent;box-shadow:none;outline:none;width:100%;min-height:54px;padding:12px 0;font-size:1rem;color:var(--ink);border-radius:0}
.v2-search-input-row #search-query::placeholder{color:var(--muted);opacity:1}
.v2-suggestion-label{font-size:.6875rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;padding-inline:10px}
.v2-suggestion{display:flex;align-items:center;gap:14px;text-align:start;width:100%;min-height:56px;padding:10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font-size:.875rem}
.v2-suggestion:hover,.v2-suggestion[aria-selected="true"]{background:var(--paper-2);border-color:var(--line)}
.v2-suggestion[aria-selected="true"]{box-shadow:inset 3px 0 var(--accent)}
html[dir="rtl"] .v2-suggestion[aria-selected="true"]{box-shadow:inset -3px 0 var(--accent)}
.v2-suggestion-copy{display:grid;gap:4px;min-width:0;flex:1}
.v2-suggestion-copy strong{font-weight:550;line-height:1.45;overflow-wrap:anywhere}
.v2-suggestion-copy small{font-size:.75rem;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.v2-suggestion>bdi{flex:none;font-size:.8125rem;font-weight:550}
.v2-suggestion>.icon{width:18px;height:18px;color:var(--muted)}
.v2-suggestion-art{display:block;flex:none;width:56px;height:56px;overflow:hidden;border-radius:6px;background:var(--paper-2)}
.v2-suggestion-art>svg,.v2-suggestion-art>img{width:100%;height:100%;object-fit:contain}
.v2-suggestion-symbol{display:grid;place-items:center;flex:none;width:40px;height:40px;background:var(--paper-2);border-radius:8px;color:var(--accent)}
.v2-search-note,.v2-search-help{font-size:.75rem;line-height:1.8;color:var(--muted);margin:18px 10px 0;overflow-wrap:anywhere}
.v2-search-help{margin-top:24px;padding-top:15px;border-top:1px solid var(--line)}
.v2-search-error{background:var(--paper-2);border-inline-start:3px solid var(--danger);padding:12px 14px;color:var(--danger);font-size:.875rem;line-height:1.7;margin-top:14px;overflow-wrap:anywhere}
.v2-search-error[hidden]{display:none}
@media(max-width:480px){.v2-search-input-row{gap:8px;padding-inline:11px}.v2-search-input-row #search-query{font-size:.875rem}.v2-search-input-row>.icon{width:18px;height:18px}.v2-suggestion{gap:10px;padding:8px}.v2-suggestion-art{height:45px;width:45px}.v2-suggestion-copy strong{font-size:.8125rem}.v2-suggestion>bdi{font-size:.75rem}.v2-search-help{margin-inline:0}}

/* storefront.css */
/* Standalone storefront primitives. All new surfaces use v2 classes. */
.v2-home{color:var(--ink);background:var(--bg);padding-bottom:64px}
.v2-home-shell{width:min(1440px,calc(100% - 96px));margin-inline:auto}
.v2-home h1,.v2-home h2,.v2-home h3,.v2-home p,.v2-home figure,.v2-product-card p{margin:0}
.v2-home a,.v2-product-card a{color:inherit;text-decoration:none}
.v2-kicker{color:var(--muted);font-size:.69rem;line-height:1.6;font-weight:650;letter-spacing:.12em;text-transform:uppercase}
[dir="rtl"] .v2-kicker{letter-spacing:0;font-size:.78rem}
.v2-primary-link{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 24px;background:var(--ink);color:var(--bg)!important;font-size:.875rem;font-weight:600;line-height:1.5;border:1px solid var(--ink);border-radius:2px;text-decoration:none;transition:background .18s ease,transform .18s ease}
.v2-primary-link:hover{background:var(--ink-2);transform:translateY(-1px)}
.v2-inline-link{display:inline-flex;align-items:center;justify-content:flex-start;min-height:44px;max-width:100%;font-size:.8125rem;line-height:1.5;font-weight:600;text-decoration:underline!important;text-underline-offset:5px;text-decoration-thickness:1px;white-space:normal}
.v2-inline-link:hover{text-decoration-thickness:2px}
.v2-home :is(a,button,[tabindex]):focus-visible,.v2-product-card :is(a,button):focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.v2-home-hero{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);align-items:center;gap:clamp(32px,4vw,72px);padding-block:40px 46px}
.v2-hero-copy{padding-block:28px;max-width:520px}
.v2-hero-copy h1{font-size:clamp(2.6rem,4.55vw,4.6rem);line-height:1.04;letter-spacing:-.055em;font-weight:500;max-width:10ch;margin-block:20px 24px}
[dir="rtl"] .v2-hero-copy h1{max-width:13ch;letter-spacing:-.035em;line-height:1.22}
.v2-hero-description{max-width:38ch;color:var(--ink-2);font-size:1rem;line-height:1.75}
.v2-hero-copy .v2-primary-link{margin-block-start:28px}
.v2-home-preview{max-width:43ch;margin-block-start:23px!important;color:var(--muted);font-size:.6875rem;line-height:1.65}
.v2-hero-visual{position:relative;min-width:0;background:var(--paper-2)}
.v2-hero-visual>img{display:block;width:100%;height:clamp(360px,39vw,540px);object-fit:cover;object-position:center}
.v2-hero-visual figcaption{position:absolute;inset-inline:20px;bottom:15px;color:#423d35;background:#f5f1e9e8;width:fit-content;max-width:calc(100% - 40px);padding:5px 8px;font-size:.57rem;line-height:1.5;letter-spacing:.1em}
[dir="rtl"] .v2-hero-visual figcaption{letter-spacing:0;font-size:.67rem}
.v2-hero-fallback{height:clamp(360px,39vw,540px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;overflow:hidden}
.v2-hero-fallback svg{width:180%;max-width:none;transform:translateX(-22%)}
.v2-home-section{margin-block-start:72px}
.v2-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-block-end:24px}
.v2-section-heading h2,.v2-home-cost h2,.v2-home-request h2{font-size:clamp(1.625rem,2.2vw,2.25rem);font-weight:500;line-height:1.25;letter-spacing:-.035em}
.v2-section-heading .v2-kicker{margin-block-end:10px}
.v2-section-heading .v2-inline-link{flex:none}
.v2-section-heading--small{margin-block-end:18px}
.v2-section-heading--small h2{font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.v2-category-tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.v2-category-tile{display:block;min-width:0}
.v2-category-tile-art{display:block;width:100%;aspect-ratio:1.08;background:var(--paper-2)}
.v2-category-tile-art svg{display:block;width:100%;height:100%;transition:transform .25s ease}
.v2-category-tile-label{display:flex;min-height:44px;align-items:center;justify-content:space-between;gap:8px;font-size:.8125rem;font-weight:600;line-height:1.4;padding-block:8px}
.v2-category-tile-label .icon{width:15px;height:15px;flex:none;transition:transform .2s ease}
[dir="rtl"] .v2-category-tile-label .icon{transform:rotate(180deg)}
.v2-category-tile:hover .v2-category-tile-art svg{transform:scale(1.04)}
.v2-product-rail-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - (var(--v2-rail-count) - 1)*24px)/var(--v2-rail-count));gap:24px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;scroll-padding-inline:6px;padding:6px 6px 14px;margin:-6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.v2-product-rail-track>.v2-product-card{scroll-snap-align:start}
.v2-product-card{position:relative;min-width:0;color:var(--ink);background:transparent;border:0;border-radius:0;box-shadow:none}
.v2-product-card-visual{position:relative;background:var(--paper-2)}
.v2-product-card-image{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;aspect-ratio:1/1.05}
.v2-product-card-image svg,.v2-product-card-image img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .28s ease}
.v2-product-wishlist{position:absolute;inset-inline-end:8px;top:8px;display:grid;place-items:center;width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;transition:background .2s ease}
.v2-product-wishlist .icon{width:20px;height:20px}
.v2-product-wishlist:hover{background:var(--paper)}
.v2-product-wishlist[aria-pressed="true"] .icon{fill:currentColor}
.v2-product-card-info{padding-block-start:15px}
.v2-product-card-brand{display:block;color:var(--muted);font-size:.67rem;line-height:1.5;font-weight:500;letter-spacing:.075em;text-transform:uppercase;overflow-wrap:anywhere}
[dir="rtl"] .v2-product-card-brand{letter-spacing:.04em}
.v2-product-card-name{display:flex;align-items:flex-start;min-height:44px;font-size:.9rem;font-weight:500;line-height:1.5;padding-block:5px;overflow-wrap:anywhere}
.v2-product-card-name:hover{text-decoration:underline;text-underline-offset:4px}
.v2-price{font-size:.9rem;font-weight:650;line-height:1.5;margin-block:1px 11px;font-variant-numeric:tabular-nums}
.v2-landed-cost{display:grid;min-width:0;overflow-wrap:anywhere;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:3px 8px;padding-block-start:10px;border-top:1px solid var(--line);font-size:.65rem;line-height:1.5;color:var(--muted)}
.v2-landed-cost>bdi{min-width:0;overflow-wrap:anywhere;color:var(--ink-2);font-size:.74rem;font-weight:600;font-variant-numeric:tabular-nums}
.v2-landed-cost>small{font-size:inherit;grid-column:1/-1}
.v2-product-availability{font-size:.75rem;color:var(--muted);line-height:1.5;margin-block-start:10px!important}
.v2-product-card-action{margin-block-start:14px}
.v2-card-option{min-height:44px;padding:9px 14px;background:var(--paper);border:1px solid var(--line);border-radius:2px;color:var(--ink);font:inherit;font-size:.8rem;cursor:pointer}
.v2-card-option:disabled{opacity:.6;cursor:not-allowed}
.v2-home-campaign{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);margin-block-start:72px;min-height:390px;background:#e9ece5;color:#25342c}
.v2-campaign-copy{padding:clamp(28px,4vw,62px);align-self:center}
.v2-campaign-copy .v2-kicker{color:#536056}
.v2-campaign-copy h2{font-size:clamp(2rem,3.2vw,3.2rem);font-weight:500;line-height:1.13;letter-spacing:-.045em;max-width:14ch;margin-block:17px 20px}
.v2-campaign-copy>p:not(.v2-kicker){font-size:.875rem;line-height:1.7;max-width:40ch;color:#4d5a50}
.v2-campaign-copy .v2-inline-link{margin-block-start:20px}
.v2-campaign-art{position:relative;min-width:0;width:100%;min-height:390px;overflow:hidden;background:#dde3d8}
.v2-campaign-product{position:absolute;display:block}
.v2-campaign-product svg{display:block;width:100%;height:100%}
.v2-campaign-product--bag{width:79%;height:93%;top:-4%;inset-inline-end:-2%;transform:rotate(8deg)}
.v2-campaign-product--shoe{width:65%;height:67%;bottom:-5%;inset-inline-start:-4%;transform:rotate(-10deg)}
.v2-campaign-art-label{position:absolute;bottom:24px;inset-inline-end:27px;color:#4d5a50;font-size:.58rem;letter-spacing:.19em}
.v2-collection-strip{border-block:1px solid var(--line);padding-block:28px;margin-block-start:64px}
.v2-collection-strip>.v2-kicker{text-align:center;font-size:.62rem}
.v2-collection-strip>div{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;column-gap:26px;row-gap:5px;margin-block-start:16px}
.v2-collection-name{display:inline-flex;align-items:center;min-height:44px;font-size:clamp(1.125rem,1.7vw,1.6rem);letter-spacing:-.03em;font-weight:500;color:var(--ink-2)!important}
.v2-collection-name:hover{text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:1px}
.v2-home-cost{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,8vw,120px);align-items:center;margin-block:72px}
.v2-home-cost-copy{max-width:470px}
.v2-home-cost-copy h2{margin-block:16px 20px;max-width:18ch}
.v2-home-cost-copy>p:not(.v2-kicker){font-size:.9rem;line-height:1.8;color:var(--ink-2);max-width:43ch}
.v2-home-cost-copy>.v2-inline-link{margin-block-start:20px}
.v2-cost-trust{display:grid;gap:13px;margin-block-start:28px;color:var(--muted);font-size:.75rem;line-height:1.65}
.v2-cost-trust>span{display:flex;align-items:center;gap:10px}
.v2-cost-trust .icon{width:17px;height:17px;flex:none}
.v2-cost-example{background:var(--paper);border:1px solid var(--line);padding:24px 28px;min-width:0}
.v2-cost-example-product{display:flex;align-items:center;gap:18px;padding-block-end:18px;border-bottom:1px solid var(--line)}
.v2-cost-example-art{width:74px;height:74px;flex:none;background:var(--paper-2)}
.v2-cost-example-art svg{width:100%;height:100%}
.v2-cost-example-product h3{margin-block-start:5px;font-weight:500;font-size:1rem;line-height:1.5}
.v2-cost-example-product .v2-kicker{font-size:.6rem}
.v2-cost-rows{display:grid;gap:12px;margin:22px 0}
.v2-cost-rows>div{display:flex;justify-content:space-between;gap:16px;font-size:.8rem;line-height:1.5}
.v2-cost-rows dt{color:var(--ink-2)}
.v2-cost-rows dd{margin:0;white-space:nowrap;font-weight:500}
.v2-landed-cost--large{font-size:.8rem;padding-block-start:20px;align-items:center;row-gap:4px}
.v2-landed-cost--large>bdi{font-size:1.5rem;color:var(--ink);line-height:1.5}
.v2-cost-exclusions{font-size:.68rem;color:var(--muted);line-height:1.7;margin-block-start:15px!important}
.v2-home-request{display:flex;align-items:center;justify-content:space-between;gap:40px;background:var(--paper-2);padding:38px 44px}
.v2-home-request h2{margin-block:10px 12px;font-size:1.7rem}
.v2-home-request p:not(.v2-kicker){max-width:65ch;color:var(--ink-2);font-size:.8125rem;line-height:1.75}
.v2-home-request .v2-primary-link{flex:none}
html[data-theme="dark"] .v2-home-campaign{background:#252c27;color:#ecf0e9}
html[data-theme="dark"] .v2-campaign-copy :is(.v2-kicker,p:not(.v2-kicker)){color:#b7c2b8}
html[data-theme="dark"] .v2-campaign-art{background:#333d34}
html[data-theme="dark"] .v2-campaign-art-label{color:#bdcbbb}
@media(hover:hover) and (prefers-reduced-motion:no-preference){.v2-product-card-image:hover svg{transform:scale(1.045)}}
@media(min-width:1600px){.v2-home-shell{width:min(1504px,calc(100% - 128px))}}
@media(max-width:1100px){
  .v2-home-shell{width:calc(100% - 64px)}
  .v2-home-hero{gap:32px;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
  .v2-hero-copy h1{font-size:3.15rem}
  .v2-hero-description{font-size:.9rem}
  .v2-category-tiles{gap:12px}
  .v2-category-tile-label{font-size:.75rem}
  .v2-product-rail-track{gap:18px;grid-auto-columns:calc((100% - (var(--v2-rail-count) - 1)*18px)/var(--v2-rail-count))}
  .v2-product-card-name{font-size:.85rem}
  .v2-landed-cost{grid-template-columns:1fr}
  .v2-landed-cost>bdi{font-size:.76rem}
  .v2-landed-cost--large{grid-template-columns:1fr auto}
  .v2-landed-cost--large>bdi{font-size:1.35rem}
  .v2-home-cost{gap:40px}
  .v2-home-campaign,.v2-campaign-art{min-height:350px}
}
@media(max-width:800px){
  .v2-home-shell{width:calc(100% - 40px)}
  .v2-home-hero{padding-block:28px 34px;gap:26px}
  .v2-hero-copy h1{font-size:2.6rem;margin-block:15px 18px}
  .v2-hero-copy{padding-block:14px}
  .v2-hero-description{font-size:.83rem}
  .v2-hero-visual>img,.v2-hero-fallback{height:360px}
  .v2-hero-copy .v2-primary-link{padding-inline:17px;font-size:.8rem;margin-block-start:22px}
  .v2-home-preview{font-size:.63rem;margin-block-start:18px!important}
  .v2-category-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .v2-category-tile-art{aspect-ratio:1.4}
  .v2-category-tile-label{font-size:.85rem}
  .v2-product-rail-track{grid-auto-columns:calc((100% - 36px)/3)}
  .v2-home-section,.v2-home-campaign{margin-block-start:50px}
  .v2-home-campaign{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .v2-campaign-copy{padding:28px}
  .v2-campaign-copy h2{font-size:2.1rem}
  .v2-campaign-copy>p:not(.v2-kicker){font-size:.8rem}
  .v2-campaign-art{min-height:340px}
  .v2-home-cost{gap:28px;margin-block:50px}
  .v2-cost-example{padding:20px}
  .v2-cost-example-product{gap:12px}
  .v2-cost-example-art{width:54px;height:54px}
  .v2-cost-example-product h3{font-size:.875rem}
  .v2-landed-cost--large{grid-template-columns:1fr}
  .v2-home-request{padding:28px;gap:25px;align-items:flex-start}
  .v2-home-request h2{font-size:1.4rem}
  .v2-home-request .v2-primary-link{font-size:.8rem;padding-inline:18px}
}
@media(max-width:600px){
  .v2-home{padding-bottom:36px}
  .v2-home-shell{width:calc(100% - 32px)}
  .v2-home-hero{grid-template-columns:1fr;padding-block:26px 28px;gap:25px}
  .v2-hero-copy{padding:0;max-width:none}
  .v2-hero-copy h1{max-width:13ch;font-size:2.9rem;margin-block:15px 17px}
  [dir="rtl"] .v2-hero-copy h1{font-size:2.55rem;max-width:13ch}
  .v2-hero-description{font-size:.9rem;max-width:40ch;line-height:1.7}
  .v2-hero-copy .v2-primary-link{margin-block-start:22px;min-height:46px}
  .v2-home-preview{font-size:.65rem;max-width:42ch;margin-block-start:16px!important}
  .v2-hero-visual>img,.v2-hero-fallback{height:auto;aspect-ratio:1.45}
  .v2-hero-visual figcaption{font-size:.48rem;inset-inline:11px;bottom:10px;max-width:calc(100% - 22px)}
  .v2-section-heading{align-items:flex-start;gap:14px;margin-block-end:17px}
  .v2-section-heading h2{font-size:1.55rem}
  .v2-section-heading .v2-inline-link{font-size:.7rem;max-width:110px;text-align:end;justify-content:flex-end}
  .v2-section-heading--small h2{font-size:1.05rem;line-height:1.7}
  .v2-section-heading--small{align-items:center;margin-block-end:12px}
  .v2-section-heading .v2-kicker{font-size:.58rem;margin-block-end:8px}
  .v2-category-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .v2-category-tile-art{aspect-ratio:.98}
  .v2-category-tile-label{font-size:.71rem;line-height:1.5;gap:3px}
  .v2-category-tile-label .icon{width:12px;height:12px}
  .v2-product-rail-track{gap:16px;grid-auto-columns:calc((100% - 16px)/2.2)}
  .v2-product-card-info{padding-block-start:11px}
  .v2-product-card-brand{font-size:.58rem}
  .v2-product-card-name{font-size:.8rem;min-height:48px}
  .v2-product-wishlist{inset-inline-end:2px;top:2px}
  .v2-product-wishlist .icon{width:18px;height:18px}
  .v2-price{font-size:.85rem;margin-block-end:8px}
  .v2-landed-cost{font-size:.62rem}
  .v2-home-campaign{grid-template-columns:1fr;margin-block-start:44px}
  .v2-campaign-copy{padding:28px}
  .v2-campaign-copy h2{font-size:2.1rem;max-width:14ch}
  .v2-campaign-copy .v2-inline-link{margin-block-start:13px}
  .v2-campaign-art{min-height:270px;max-height:340px;aspect-ratio:1.45}
  .v2-campaign-product--bag{width:67%;height:105%;top:-10%;inset-inline-end:1%}
  .v2-campaign-product--shoe{width:61%;height:91%;bottom:-12%;inset-inline-start:-2%}
  .v2-collection-strip{margin-block-start:42px;padding-block:23px}
  .v2-collection-strip>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 18px}
  .v2-collection-name{justify-content:center;font-size:1.2rem}
  .v2-home-cost{grid-template-columns:1fr;gap:26px;margin-block:44px}
  .v2-home-cost-copy h2{font-size:1.85rem;margin-block:12px 16px;max-width:19ch}
  .v2-home-cost-copy>p:not(.v2-kicker){font-size:.86rem}
  .v2-home-cost-copy>.v2-inline-link{margin-block-start:13px}
  .v2-cost-trust{margin-block-start:17px;gap:10px;font-size:.7rem}
  .v2-cost-example{padding:22px}
  .v2-cost-example-art{width:65px;height:65px}
  .v2-landed-cost--large{grid-template-columns:1fr auto;font-size:.75rem}
  .v2-landed-cost--large>bdi{font-size:1.35rem}
  .v2-home-request{display:block;padding:27px}
  .v2-home-request h2{font-size:1.6rem;line-height:1.25}
  .v2-home-request .v2-primary-link{margin-block-start:22px}
}
@media(max-width:380px){
  .v2-hero-copy h1{font-size:2.55rem}
  [dir="rtl"] .v2-hero-copy h1{font-size:2.2rem}
  .v2-category-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .v2-category-tile-art{aspect-ratio:1.2}
  .v2-category-tile-label{font-size:.8rem}
  .v2-product-rail-track{grid-auto-columns:76%;gap:16px}
  .v2-product-card-name{font-size:.9rem;min-height:44px}
  .v2-product-card-brand{font-size:.65rem}
  .v2-landed-cost{grid-template-columns:minmax(0,1fr);font-size:.65rem}
  .v2-product-card .v2-landed-cost>bdi{font-size:.75rem}
  .v2-section-heading h2{font-size:1.35rem}
  .v2-section-heading--small h2{font-size:1rem}
  .v2-section-heading .v2-inline-link{max-width:89px}
  .v2-cost-example{padding:18px}
  .v2-landed-cost--large{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .v2-home *, .v2-product-card *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

</style>
</head>

  <a id="skip-link" class="sr-only skip-link" href="#main">انتقل إلى المحتوى</a>
  <div id="announcement" class="announcement">معاينة قبل الإطلاق · منتجات توضيحية، دون دفع حقيقي</div>
  <header id="site-header" class="site-header"></header>
  <div id="storage-banner" class="storage-banner" role="status" hidden></div>

  <main id="main" tabindex="-1" aria-busy="true">
    <div class="boot">
      <div class="boot-logo">AnoX</div>
      <div class="boot-bar" aria-hidden="true"></div>
      <p>جارٍ تجهيز تجربتك… / Preparing your experience…</p>
      <noscript>
        <p>هذه التجربة تحتاج JavaScript. لا تتصل بخادم ولا تعالج مدفوعات.</p>
        <p>Enable JavaScript to use this self-contained storefront. No payments are processed.</p>
      </noscript>
    </div>
  </main>

  <footer id="footer" class="footer" hidden></footer>
  <nav id="mobile-nav" class="mobile-nav" aria-label="التنقل على الهاتف"></nav>
  <aside id="compare-bar" class="compare-bar" aria-label="المقارنة" hidden></aside>

  <div id="scrim" class="scrim" hidden></div>
  <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1" hidden>

        weightGrams+=line.weightGrams*line.qty;

      requireInteger(weightGrams,0,1e10,"shipping weight");

        numerator:Math.round(s.usdToDzd*100),denominator:100

    const catalogBudget=(name,limits)=>({name,limits,used:{payload:0,media:0,pixels:0,records:0,nodes:0},blocked:''});

        const add=amount=>charge('payload',amount,media);

        if(typeof value==='string'){add(16+value.length*2);return;}
        if(typeof value==='number'){if(!Number.isFinite(value))throw Error('invalid_provider_payload');add(8);return;}

    }
    class ProductProviderRegistry{
      constructor(limits={}){this.providers=new Map();this.limits=catalogLimits(limits);}
      register(provider){
        if(this.providers.size>=this.limits.providers||!isObject(provider)||!/^[-a-z0-9]{1,40}$/.test(provider.id)||this.providers.has(provider.id)||!['preview','live'].includes(provider.mode)||typeof provider.list!=='function'||provider.transport!=='offline')throw Error('Invalid offline provider');
        this.providers.set(provider.id,Object.freeze({...provider,approvedLive:false}));
      }
      descriptor(id){return this.providers.get(id)||null;}
      async page(id,offset=0,limit=100,budgets=null){
        const provider=this.descriptor(id);if(!provider)return {providerId:id,status:'unavailable',items:[],nextOffset:null,total:null,errors:['provider_missing']};

        try{
          requireInteger(offset,0,100000,'offset');requireInteger(limit,1,100,'page size');
          const result=await Promise.race([Promise.resolve().then(()=>provider.list({offset,limit,signal:abort.signal})),new Promise((_,reject)=>{timer=setTimeout(()=>{abort.abort();reject(Error('timeout'));},8000);})]);

    /* Own ordinary Tab movement so platform keyboard preferences cannot let

    function moveDialogFocus(event,root,active=document.activeElement){
      if(event.key!=="Tab"||event.altKey||event.ctrlKey||event.metaKey)return false;
      const elements=focusables(root),index=elements.indexOf(active);
      event.preventDefault();
      if(!elements.length){root.focus();return true;}
      const next=index<0?(event.shiftKey?elements.length-1:0):(index+(event.shiftKey?-1:1)+elements.length)%elements.length;
      elements[next].focus();

    function formMemoryKey(form){

    const routeOwnsForm=form=>["search-page-form","track-form"].includes(form.getAttribute("id"));
    function captureForm(form){
      if(!form||!form.getAttribute("id")||form.dataset.discarded==="true"||routeOwnsForm(form))return;
      const values={};
      for(const element of form.elements){
        if(!element.name||["submit","button","reset","file"].includes(element.type))continue;
        values[element.name]=element.type==="checkbox"?element.checked:element.value;
      }
      const id=form.getAttribute("id");
      ui.formMemory[formMemoryKey(form)]=values;
      if(id==="delivery-form")state.checkoutData=cleanDelivery(values);
      else{
        const key={"profile-form":"profile","settings-form":"settings","request-form":"request","business-form":"business"}[id];
        if(key)state.drafts[key]=values;
      }
    }
    function captureForms(){document.querySelectorAll("form").forEach(captureForm);}
    function restoreForm(form){
        // Search and tracking inputs belong to their URL, not to form drafts.
        if(routeOwnsForm(form))return;
        const values=ui.formMemory[formMemoryKey(form)];
        if(!values)return;
        for(const [name,value] of Object.entries(values)){
          const element=form.elements.namedItem(name);
          if(!element||element.type==="hidden"||element.type==="submit")continue;
          if(element.type==="checkbox")element.checked=!!value;
          else if(typeof value==="string")element.value=value;
        }
    }

    function catalogPaginationMarkup(pagination,routeName,baseParams){

      let previous=0;
      const numbered=pages.map(page=>{const gap=previous&&page-previous>1?'<span class="pagination-gap" aria-hidden="true">…</span>':"";previous=page;return gap+link(page,String(page),page===pagination.page);}).join("");

    async function addSelectedProduct(){
      if(ui.cartBusy)return;
      const selection=clone(ui.selection),product=selection&&productBy(selection.productId);
      if(!product)return;
      const editKey=ui.editKey,editing=!!editKey,previousEdit=editing?clone(state.cart.find(line=>cartKey(line)===editKey)):null,moveWishlist=ui.moveWishlist===product.id;
      const target=$("dialog-content").querySelector("[data-add-product]");ui.cartBusy=true;if(target)target.disabled=true;
      try{
      const synchronized=await Storage.sync();
      if(Storage.notice==="clearedElsewhere"||!jsonEqual(selection,ui.selection)||ui.editKey!==editKey)return;
      if(!synchronized&&['cart_stock_conflict','cart_coordination_required'].includes(Storage.notice)){if(ui.dialog==='product')renderProduct(product,false,'[data-add-product]');return;}
      const variant=variantFor(product,selection.color,selection.size);
      if(!variant){toast(tx("اختر المقاس أو الخيار أولًا.","Choose a size or option first."),"warning");$("dialog-content").querySelector("[data-size]")?.focus();return;}
      if(!CommercePolicy.line(product,variant,selection.qty,'preview').allowed){toast(tx('هذا الخيار غير مؤهل للمحاكاة، والشراء الحقيقي غير متصل.','This option is not eligible for preview; live purchasing is not connected.'),'warning');return;}
      if(!whole(selection.qty,1,20)||selection.qty>remainingStock(product,selection.color,selection.size,ui.editKey)){
        toast(tx("الكمية تتجاوز المتاح لهذا اللون والمقاس، مع احتساب السلة.","Quantity exceeds this color and size’s availability, including your cart."),"warning");return;
      }
      const saved=await Storage.save({
        guard:(remote,current)=>cartEditUnchanged(remote,current,editKey,previousEdit),
        mutate:current=>{
          const updated=current.cart.filter(line=>!editKey||cartKey(line)!==editKey),newLine={productId:product.id,color:selection.color,size:selection.size,qty:selection.qty},existing=updated.find(line=>cartKey(line)===cartKey(newLine));
          if(existing)existing.qty+=newLine.qty;else updated.push(newLine);current.cart=updated;
          if(moveWishlist)current.wishlist=current.wishlist.filter(id=>id!==product.id);
        }
      });updateShell();
      if(!saved){if(ui.dialog==='product')renderProduct(product,false,'[data-add-product]');toast(tx("لم نؤكد تعديل السلة. راجع الكمية ورسالة الحفظ قبل المحاولة مجددًا.","The cart edit was not confirmed. Review the quantity and storage message before retrying."),'warning');return;}
      if(editing){ui.editKey="";ui.moveWishlist="";dismissDialog();}
      else if(ui.dialog==="product"&&ui.selection?.productId===product.id)renderProduct(product,false,"[data-add-product]");
      toast(editing?tx("حُفظت خيارات السلة.","Cart options updated."):tx("أُضيف إلى السلة.","Added to cart."),"success");
      }finally{ui.cartBusy=false;if(target?.isConnected)target.disabled=false;}
    }

    async function generateQuote(form){
      const data=Object.fromEntries(new FormData(form).entries()),request=state.requests.find(value=>value.id===data.requestId);
      if(!request||request.status==="accepted")return;
      const price=numberInput(data.unitUsd),weight=numberInput(data.weightKg),errors={};
      if(!Number.isFinite(price)||price<.01||price>10000||Math.abs(price*100-Math.round(price*100))>.00001)errors.unitUsd=tx("أدخل سعرًا من 0.01 إلى 10000، حتى منزلتين عشريتين.","Use 0.01–10000, with at most two decimal places.");
      if(!Number.isFinite(weight)||weight<.001||weight>100||Math.abs(weight*1000-Math.round(weight*1000))>.00001)errors.weightKg=tx("أدخل وزنًا من 0.001 إلى 100 كغ، حتى ثلاثة منازل.","Use 0.001–100 kg, with at most three decimal places.");
      setFormErrors(form,errors);if(Object.keys(errors).length)return;
      const now=Date.now(),unitCents=Math.round(price*100),unitWeightGrams=Math.round(weight*1000),config=clone(state.settings);
      const original=clone(request),estimate={createdAt:new Date(now).toISOString(),expiresAt:new Date(now+72*60*60*1000).toISOString(),unitCents,unitWeightGrams,config,totals:quote([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config),decisionAt:"",legacy:false};
      estimate.pricingSnapshot=pricingSnapshot([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config,estimate.totals);
      const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.settings,config),mutate:current=>{const value=current.requests.find(value=>value.id===request.id);value.quote=estimate;value.status="quoted";}});
      if(!saved){toast(tx("تعذر حفظ العرض أو تغيّر الطلب في تبويب آخر. راجع حالته ثم أعد المحاولة.","The quote could not be saved or the request changed in another tab. Review its status and try again."),"warning");return;}
      delete ui.formMemory[formMemoryKey(form)];form.dataset.discarded="true";
      if(currentRoute().name==="quote"){renderQuote();$("main").focus({preventScroll:true});}
    }
    async function decideQuote(id,decision){
      if(ui.quoteBusy)return;
      const request=state.requests.find(value=>value.id===id);
      if(!request||!request.quote||request.quote.legacy||!request.quote.pricingSnapshot||request.status!=="quoted"||!["accepted","rejected"].includes(decision))return;
      if(quoteExpired(request.quote)){toast(tx("انتهت صلاحية العرض. أنشئ تقديرًا جديدًا.","The quote expired. Create a new estimate."),"warning");renderQuote();return;}
      const original=clone(request);ui.quoteBusy=true;
      try{
        const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===id),original)&&jsonEqual(current.requests.find(value=>value.id===id),original)&&!quoteExpired(original.quote),mutate:current=>{const value=current.requests.find(value=>value.id===id);value.status=decision;value.quote.decisionAt=new Date().toISOString();}});
        if(currentRoute().name==="quote")renderQuote();
        toast(saved?tx("حُفظ قرارك محليًا. لم يحدث شراء أو دفع.","Your decision was saved locally. No purchase or payment occurred."):tx("تعذر حفظ القرار أو تغيّر العرض أو انتهت صلاحيته. راجع حالته قبل المحاولة مجددًا.","The decision could not be saved, or the quote changed or expired. Review its status before trying again."),saved?"success":"warning");
      }finally{ui.quoteBusy=false;}
    }

    const SETTING_FIELDS=[

    function parseSettingsDraft(draft){
      const result={};

        const value=numberInput(draft&&draft[key]);
        if(!Number.isFinite(value)||value<min||value>max||Math.abs(value*100-Math.round(value*100))>.00001)return null;

      }
      return result;
    }
