        [bi("هل يمكنني فتح الملف دون إنترنت؟","Can I open the file without internet?"),bi("نعم. التصميم والرسوم والكود مضمنة داخل الملف. التخزين المحلي يعتمد على المتصفح وإعداداته؛ إذا تعذر الحفظ ستظهر رسالة واضحة وستبقى البيانات في الجلسة الحالية فقط.","Yes. Design, illustrations and code are embedded in the file. Local storage depends on your browser and settings. If saving fails, a clear notice appears and data remains only in the current session.")]
      ];
      $("main").innerHTML=pageShell(tx("معلومات واضحة، من البداية","Clarity from the start"),tx("كل ما تحتاج معرفته عن هذه النسخة، وما يحدث لبياناتك، وما لم يُربط بعد.","What you need to know about this version, what happens to your data and what is not connected."),
        '<div class="faq-list">'+faqs.map(([question,answer])=>'<details class="faq"><summary>'+esc(localized(question))+'</summary><p>'+esc(localized(answer))+'</p></details>').join("")+'</div><div class="help-grid"><section class="surface help-card" id="help-shipping" tabindex="-1">'+icon("truck")+'<h2>'+esc(tx("الشحن والإرجاع","Shipping & returns"))+'</h2><p>'+esc(tx("تغطية الشحن والمدة والرسوم وسياسة الإرجاع غير مفعّلة تجاريًا في هذا الملف. اختيار ولاية أو عرض مرحلة تتبّع لا يؤكد توفر خدمة. يجب عرض شروط واضحة وتأكيد التكلفة والأهلية قبل أي شراء حقيقي.","Shipping coverage, timing, charges and returns are not commercially enabled in this file. Selecting a wilaya or displaying a tracking stage does not confirm service availability. Clear terms, cost and eligibility must be confirmed before any real purchase."))+'</p></section><section class="surface help-card" id="help-privacy" tabindex="-1">'+icon("shield")+'<h2>'+esc(tx("الخصوصية والشروط المحلية","Local privacy & terms"))+'</h2><p>'+esc(tx("لا يستخدم الملف تحليلات أو ملفات تتبّع أو خطوطًا خارجية، ولا يرسل النماذج إلى خادم. تُحفظ التفضيلات والمسودات والسلة والسجلات في تخزين هذا المتصفح إن سمح بذلك. يمكنك مسح بيانات AnoX من صفحة الحساب. البيانات ليست مشفّرة كخزنة خاصة، ولا تُدخل كلمات مرور أو بيانات بطاقات أو معلومات حساسة. الروابط الخارجية لا تُفتح إلا باختيارك وقد تخضع لسياسات مواقعها.","This file uses no analytics, tracking cookies or external fonts, and does not send forms to a server. Preferences, drafts, cart and records are stored in this browser when permitted. You can clear AnoX data from Account. Storage is not a private encrypted vault; do not enter passwords, card data or sensitive information. External links open only when you choose them and are subject to their own policies."))+'</p><div class="actions actions-spaced">'+routeLink("account",tx("إدارة بياناتي","Manage my data"),"btn secondary small")+'</div></section><section class="surface help-card" id="help-contact" tabindex="-1">'+icon("info")+'<h2>'+esc(tx("التواصل والتشغيل الفعلي","Contact & live operations"))+'</h2><p>'+esc(tx("لا توجد قناة دعم أو فريق مبيعات متصل بهذا الملف، ولا ندّعي إرسال رسالتك إلى أحد. طلبات المنتجات والأعمال تبقى محلية. يجب ربط بيانات الشركة وقنوات الدعم والموردين والدفع قبل فتح المنصة لطلبات شراء حقيقية.","No support channel or sales team is connected to this file, and it does not claim to send your message to anyone. Product and business requests remain local. Company information, support channels, suppliers and payments must be connected before accepting real purchases."))+'</p><div class="actions actions-spaced">'+routeLink("requests",tx("مراجعة طلباتي المحلية","Review my local requests"),"btn secondary small")+'</div></section></div>',"HELP CENTER");
    }

    /* ================================================================
       16. Clear-data lifecycle and honest clipboard fallback
       ================================================================ */

    function confirmClearData(){
      openDialog("confirm",tx("مسح بيانات AnoX المحلية؟","Clear local AnoX data?"),
        '<p class="muted">'+esc(tx("سيُحذف من هذا المتصفح: السلة والمفضلة والمقارنة والطلبات والعروض والعناوين والمسودات والإعدادات ونسخة الاسترداد. لا يمكن التراجع عن ذلك من داخل التطبيق. لا تُمس بيانات المواقع الأخرى.","This removes this browser’s cart, wishlist, comparison, orders, quotations, delivery details, drafts, settings and recovery copy. It cannot be undone inside the app. Other sites’ data is not affected."))+'</p><div class="actions actions-spaced">'+button(tx("إلغاء","Cancel"),"data-close","btn secondary")+button(tx("نعم، امسح بيانات AnoX","Yes, clear AnoX data"),"data-confirm-clear","btn danger")+'</div>');
    }
    function resetDeviceView(generation){
      discardForms();closeDialog(false);state=defaultState();
      Storage.generation=generation||"0";Storage.initial=null;Storage.lastSignature="";Storage.author=LocalPreviewIds.create("TAB");Storage.revision=0;Storage.available=true;Storage.notice="";Storage.recoveryRaw=null;Storage.pendingAppend=null;Storage.baseline=Storage.snapshot();
      ui.selection=null;ui.editKey="";ui.moveWishlist="";ui.checkoutStep=1;ui.deliveryErrors={};
      ui.filters=defaultFilters();ui.sort="featured";
      history.replaceState(null,"","#home");renderRoute();
    }
    async function clearLocalData(){
      if(ui.clearing)return;ui.clearing=true;
      discardForms();
      try{if(await Storage.clear()){resetDeviceView(Storage.generation);toast(tx("مُسحت بيانات AnoX المحلية من هذا المتصفح.","Local AnoX data was cleared from this browser."),"success");}
      else toast(tx("تعذر إكمال المسح الآمن. استخدم إعدادات بيانات المواقع في المتصفح.","Safe clearing could not finish. Use your browser’s site-data settings."),"error");}
      finally{ui.clearing=false;}
    }
    async function copyText(value,title){
      try{
        if(!navigator.clipboard||typeof navigator.clipboard.writeText!=="function")throw new Error("Clipboard unavailable");
        await navigator.clipboard.writeText(value);
        toast(tx("نُسخ إلى الحافظة.","Copied to clipboard."),"success");
      }catch{
        openDialog("copy",title,'<p class="fine" style="margin-bottom:16px">'+esc(tx("النسخ التلقائي غير متاح في هذا المتصفح. حدّد النص وانسخه يدويًا.","Automatic copying is unavailable in this browser. Select the text and copy it manually."))+'</p><textarea id="copy-text" class="textarea copy-area" readonly aria-label="'+esc(title)+'">'+esc(value)+'</textarea>');
        requestAnimationFrame(()=>{const field=$("copy-text");if(ui.dialog==="copy"&&field){field.focus();field.select();}});
      }
    }

    /* ================================================================
       17. Interaction controller
       ================================================================ */

    function setLanguage(lang){
      if(!["ar","en"].includes(lang)||lang===state.lang)return;
      captureForms();
      const overlay=ui.dialog,searchValue=$("search-query")?.value||"";
      state.lang=lang;
      if(Object.keys(ui.deliveryErrors).length)ui.deliveryErrors=deliveryErrors(state.checkoutData);
      Storage.save();
      if(overlay==="product"){
        updateShell();renderProduct(productBy(ui.selection.productId),false);
      }else{
        closeDialog(false);renderRoute({focus:false});
        if(overlay==="menu")openDialog("menu","AnoX",menuMarkup());
        else if(overlay==="cart")openDialog("cart",tx("سلة AnoX","AnoX cart"),cartDrawerMarkup());
        else if(overlay==="filters")openFilters();
        else if(overlay==="search")openSearch(searchValue);
      }
      restoreForms();
    }
    function toggleTheme(){
      captureForms();state.theme=state.theme==="dark"?"light":"dark";Storage.save();updateShell();
      if(ui.dialog==="product")renderProduct(productBy(ui.selection.productId),false);
      else if(ui.dialog==="menu")$("dialog-content").innerHTML=menuMarkup();
      restoreForms();
    }

    document.addEventListener("click",event=>{
      const target=event.target.closest("button,a");
      if(!target)return;
      const data=target.dataset;
      if(target.matches("a[data-catalog-page]")){
        if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
        event.preventDefault();ui.catalogPageFocus=true;navigateHash(target.getAttribute("href"));return;
      }
      if(target.matches("a[data-nav]")){
        if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
        event.preventDefault();
        ui.editKey="";ui.moveWishlist="";
        navigateHash(target.getAttribute("href"));
        return;
      }
      if(target.matches("[data-product]")){
        if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
        event.preventDefault();openProduct(data.product);return;
      }
      if(target.matches("[data-route]")){
        navigate(data.route);return;
      }
      if(target.matches("[data-open]")){
        target.focus({preventScroll:true});
        captureForms();
        if(data.open==="search")openSearch();
        else if(data.open==="menu")openDialog("menu","AnoX",menuMarkup());
        else if(data.open==="cart")openDialog("cart",tx("سلة AnoX","AnoX cart"),cartDrawerMarkup());
        else if(data.open==="filters")openFilters();
        return;
      }
      if(target.matches("[data-close]")){dismissDialog();return;}
      if(target.matches("[data-language]")){setLanguage(data.language);return;}
      if(target.matches("[data-theme]")){toggleTheme();return;}
      if(target.matches("[data-options]")){openProduct(data.options,{moveWishlist:data.moveWishlist==="true"});return;}
      if(target.matches("[data-wishlist]")){toggleWishlist(data.wishlist);return;}
      if(target.matches("[data-compare]")){toggleCompare(data.compare);return;}
      if(target.matches("[data-clear-compare]")){
        state.compare=[];Storage.save();updateShell();
        if(currentRoute().name==="compare")renderCompare();
        else document.querySelectorAll("[data-compare]").forEach(node=>{node.setAttribute("aria-pressed","false");if(node.classList.contains("text-btn"))node.textContent=tx("+ قارن","+ Compare");});
        return;
      }
      if(target.matches("[data-category]")){
        ui.filters=defaultFilters();ui.sort="featured";navigate("shop",{category:data.category});return;
      }
      if(target.matches("[data-brand]")){
        ui.filters=defaultFilters();ui.sort="featured";navigate("shop",{brand:data.brand});return;
      }
      if(target.matches("[data-clear-filters]")){
        ui.filters=defaultFilters();ui.sort="featured";
        if(ui.dialog==="filters")$("dialog-content").innerHTML=filterMarkup("drawer")+'<div class="actions actions-spaced">'+button(tx("عرض النتائج","Show results"),'id="apply-filters" data-close',"btn primary")+'</div>';
        refreshCatalog();return;
      }
      if(target.matches("[data-remove-filter]")){
        const defaults=defaultFilters();
        if(Object.hasOwn(defaults,data.removeFilter))ui.filters[data.removeFilter]=defaults[data.removeFilter];
        refreshCatalog();return;
      }
      if(target.matches("[data-request-query]")){requestFromQuery(data.requestQuery);return;}
      if(target.matches("[data-suggestion]")){activateSuggestion(Number(data.suggestion));return;}
      if(target.matches("[data-color],[data-size],[data-gallery],[data-zoom],[data-detail-delta]")){
        const selection=ui.selection,product=selection&&productBy(selection.productId);
        if(!product)return;
        let selector="";
        if(data.color!==undefined){
          if(!product.colors.includes(data.color))return;
          selection.color=data.color;selection.qty=1;
          if(!remainingStock(product,selection.color,selection.size,ui.editKey))selection.size=product.sizes.length===1?product.sizes[0]:"";
          selector='[data-color="'+CSS.escape(selection.color)+'"]';
        }else if(data.size!==undefined){
          if(!product.sizes.includes(data.size)||!remainingStock(product,selection.color,data.size,ui.editKey))return;
          selection.size=data.size;selection.qty=1;selector='[data-size="'+CSS.escape(selection.size)+'"]';
        }else if(data.gallery!==undefined){
          const view=Number(data.gallery);if(![0,1,2].includes(view))return;
          selection.view=view;selection.zoom=false;selector='[data-gallery="'+view+'"]';
        }else if(data.detailDelta!==undefined){
          const maximum=remainingStock(product,selection.color,selection.size,ui.editKey);
          selection.qty=clamp(selection.qty+Number(data.detailDelta),1,Math.max(1,maximum));
          selector='[data-detail-delta="'+data.detailDelta+'"]';
        }else{selection.zoom=!selection.zoom;selector=".gallery-main";}
        renderProduct(product,false,selector);return;
      }
      if(target.matches("[data-size-guide]")){
        const guide=$("size-guide");if(guide){guide.open=true;guide.scrollIntoView({block:"nearest"});guide.querySelector("summary").focus();}return;
      }
      if(target.matches("[data-add-product]")){addSelectedProduct();return;}
      if(target.matches("[data-edit-line]")){
        const line=state.cart.find(value=>cartKey(value)===data.editLine);
        if(line)openProduct(line.productId,{editLine:line});return;
      }
      if(target.matches("[data-cart-delta]")){
        const line=state.cart.find(value=>cartKey(value)===data.line);if(!line)return;
        const variant=variantFor(productBy(line.productId),line.color,line.size),next=line.qty+Number(data.cartDelta);
        if(!whole(next,1,Math.min(20,variant?variant.stock:0))){toast(tx("لا تتوفر كمية إضافية لهذا الخيار.","No additional quantity is available for this option."),"warning");return;}
        line.qty=next;refreshCart({line:data.line,delta:data.cartDelta});return;
      }
      if(target.matches("[data-remove-line]")){
        state.cart=state.cart.filter(value=>cartKey(value)!==data.removeLine);refreshCart();
        const focus=(ui.dialog?$("dialog-content"):$("main")).querySelector("button,a");
        if(focus)focus.focus({preventScroll:true});return;
      }
      if(target.matches("[data-checkout-start]")){
        ui.checkoutStep=1;ui.deliveryErrors={};navigate("checkout");return;
      }
      if(target.matches("[data-checkout-step]")){
        captureForms();
        const step=Number(data.checkoutStep);
        if(![1,2,3].includes(step))return;
        const issues=cartIssues();if(issues.length){toast(issues[0],"error");return;}
        if(step===3&&Object.keys(deliveryErrors(state.checkoutData)).length){ui.checkoutStep=2;ui.deliveryErrors=deliveryErrors(state.checkoutData);}
        else ui.checkoutStep=step;
        Storage.save();renderCheckout();restoreForms();$("main").focus({preventScroll:true});return;
      }
      if(target.matches("[data-place-order]")){placeOrder(target);return;}
      if(target.matches("[data-advance-order]")){
        const order=state.orders.find(value=>value.id===data.advanceOrder);
        if(order){order.stage=Math.min(6,order.stage+1);Storage.save();renderTrack();}return;
      }
      if(target.matches("[data-copy-order]")){void copyText(data.copyOrder,tx("رقم الطلب المحلي","Local order ID"));return;}
      if(target.matches("[data-quote-decision]")){decideQuote(data.requestId,data.quoteDecision);return;}
      if(target.matches("[data-reset-settings]")){
        state.drafts.settings=clone(DEFAULT_SETTINGS);delete ui.formMemory["settings-form"];
        renderSettings();return;
      }
      if(target.matches("[data-clear-local]")){confirmClearData();return;}
      if(target.matches("[data-confirm-clear]")){clearLocalData();return;}
      if(target.matches("[data-account-section]")){
        event.preventDefault();const section=$("account-"+data.accountSection);
        if(section){section.focus({preventScroll:true});section.scrollIntoView({block:"start"});}return;
      }
      if(target.matches("[data-retry]")){renderRoute();return;}
    });

    document.addEventListener("submit",async event=>{
      const form=event.target;
      if(!(form instanceof HTMLFormElement))return;
      event.preventDefault();if(form.dataset.submitting==="true")return;captureForm(form);
      form.dataset.submitting="true";form.setAttribute("aria-busy","true");
      const submitters=[...form.querySelectorAll('button[type="submit"],input[type="submit"]')].map(node=>({node,disabled:node.disabled}));
      for(const entry of submitters)entry.node.disabled=true;
      try{
      const id=form.getAttribute("id");
      if(id==="search-page-form")submitSearch(new FormData(form).get("q"));
      else if(id==="delivery-form")validateDelivery(form);
      else if(id==="track-form")navigate("track",{order:text(new FormData(form).get("order"),80).trim().toUpperCase()});
      else if(id==="request-form"||id==="business-form")await saveRequest(form);
      else if(id==="quote-form")await generateQuote(form);
      else if(id==="settings-form")await saveSettings(form);
      else if(id==="profile-form"){
        state.profile.name=text(new FormData(form).get("name"),80).trim();
        delete state.drafts.profile;delete ui.formMemory["profile-form"];form.dataset.discarded="true";
        const saved=await Storage.save();if(currentRoute().name==="account")renderAccount();
        toast(saved?tx("حُفظ اسم العرض.","Display name saved."):tx("حُفظ الاسم في هذه الجلسة فقط.","The name is saved in this session only."),saved?"success":"warning");
      }
      }finally{delete form.dataset.submitting;form.removeAttribute("aria-busy");for(const entry of submitters)if(entry.node.isConnected)entry.node.disabled=entry.disabled;}
    });

    const updateSuggestionsSoon=debounce(()=>{ui.searchIndex=-1;renderSuggestions();},100);
    document.addEventListener("input",event=>{
      const input=event.target;
      if(input.id==="search-query"){updateSuggestionsSoon();return;}
      if(input.form){
        captureForm(input.form);saveDraftSoon();
        if(input.form.getAttribute("id")==="settings-form"){
          const target=$("settings-preview");
          if(target)target.innerHTML=settingsPreview(Object.fromEntries(new FormData(input.form).entries()));
        }
      }
    });
    document.addEventListener("change",event=>{
      const target=event.target;
      if(target.form){captureForm(target.form);saveDraftSoon();}
      if(target.matches("[data-filter]")){
        const key=target.dataset.filter;
        if(!Object.hasOwn(defaultFilters(),key))return;
        ui.filters[key]=target.type==="checkbox"?target.checked:["maxPrice","budget"].includes(key)?Number(target.value):target.value;
        refreshCatalog();
      }else if(target.matches("[data-sort]")){
        ui.sort=target.value;refreshCatalog();
      }
    });
    document.addEventListener("keydown",event=>{
      trapFocus(event);
      if(event.target.id==="search-query"){
        if(event.key==="ArrowDown"||event.key==="ArrowUp"){
          event.preventDefault();updateSuggestionsSoon.cancel();renderSuggestions();
          if(ui.searchItems.length){
            ui.searchIndex=event.key==="ArrowDown"?(ui.searchIndex+1)%ui.searchItems.length:(ui.searchIndex<=0?ui.searchItems.length-1:ui.searchIndex-1);
            updateSearchSelection();
            $("suggestion-"+ui.searchIndex)?.scrollIntoView({block:"nearest"});
          }
          return;
        }
        if(event.key==="Enter"){
          event.preventDefault();updateSuggestionsSoon.cancel();
          if(ui.searchIndex>=0&&ui.searchItems[ui.searchIndex])activateSuggestion(ui.searchIndex);
          else submitSearch(event.target.value);
          return;
        }
      }
      if(event.key==="Escape"&&ui.dialog){
        event.preventDefault();
        if(ui.dialog==="product"&&ui.selection&&ui.selection.zoom){
          ui.selection.zoom=false;renderProduct(productBy(ui.selection.productId),false,".gallery-main");
        }else dismissDialog();
        return;

        throw new Error("Provide a query of 1–100 characters.");

/* Component: catalog.js */
// Category discovery is a presentation adapter over the verified catalog filter.
const V2_CATEGORY_COPY={
  Shoes:bi('خطوتك القادمة.','Your next move.'),Fashion:bi('قطع تختارها لنفسك.','Make it your own.'),
  Beauty:bi('تفاصيل لروتينك اليومي.','A little everyday ritual.'),Electronics:bi('تقنية تناسب يومك.','Better-connected days.'),
  Accessories:bi('التفاصيل تصنع الفرق.','The finishing touches.')
};
function V2CatalogChoices(params=currentRoute().params){
  const products=Catalog.all(),result={};
  for(const [key,field] of [['size','sizes'],['color','colors']]){
    const value=params.get(key)||'';
    result[key]=value.length<=80&&products.some(p=>p[field].includes(value))?value:'';
  }
  return result;
}
function V2ChoiceResults(products){
  const choices=V2CatalogChoices();
  return products.filter(p=>(!choices.size||p.sizes.includes(choices.size))&&(!choices.color||p.colors.includes(choices.color)));
}
function V2FilterSelect({id,key,label,values,value,choice=false,help=''}){
  return `<div class="v2-filter-field"><label for="${esc(id)}">${esc(label)}</label><select class="select" id="${esc(id)}" ${choice?'data-v2-filter':'data-filter'}="${esc(key)}">${values.map(([val,title])=>`<option value="${esc(val)}"${String(val)===String(value)?' selected':''}>${esc(title)}</option>`).join('')}</select>${help?`<p class="field-help">${esc(help)}</p>`:''}</div>`;
}
function filterMarkup(suffix){
  const f=ui.filters,choice=V2CatalogChoices(),all=Catalog.all(),source=f.category?all.filter(p=>p.category===f.category):all;
  const any=tx('الكل','All'),options=(values,label=v=>v)=>[['',any],...values.map(v=>[v,label(v)])];
  const select=(key,label,values,value,extra={})=>V2FilterSelect({id:`${key}-${suffix}`,key,label,values,value,...extra});
  return `<div class="v2-filter-fields">
    ${select('category',tx('الفئة','Category'),options(Object.keys(CATEGORIES),categoryLabel),f.category)}
    ${select('brand',tx('العلامة / المجموعة','Brand / collection'),options([...new Set(all.map(p=>p.brand))]),f.brand)}
    <details class="v2-filter-section"${choice.size||choice.color?' open':''}><summary>${esc(tx('المقاس واللون','Size & color'))}</summary>
      ${select('size',tx('المقاس أو الخيار','Size or option'),options([...new Set([...source.flatMap(p=>p.sizes),...(choice.size?[choice.size]:[])])]),choice.size,{choice:true})}
      ${select('color',tx('اللون','Color'),options([...new Set([...source.flatMap(p=>p.colors),...(choice.color?[choice.color]:[])])],colorName),choice.color,{choice:true})}
    </details>
    <details class="v2-filter-section"${f.maxPrice||f.budget?' open':''}><summary>${esc(tx('السعر وتكلفة الوصول','Price & landed cost'))}</summary>
      ${select('maxPrice',tx('سعر المنتج بالدولار','Item price in USD'),[...new Set([0,50,75,150,300,f.maxPrice])].sort((a,b)=>a-b).map(v=>[v,v?tx('حتى ','Up to ')+formatUSD(v*100):any]),f.maxPrice)}
      ${select('budget',tx('ميزانية الوصول بالدينار','Landed budget in DZD'),[0,10000,15000,25000,50000,100000].map(v=>[v,v?tx('حتى ','Up to ')+formatDZD(v):any]),f.budget,{help:tx('تقدير لقطعة واحدة، دون الجمارك.','One-item estimate, excluding customs.')})}
    </details>
    <fieldset class="v2-filter-checks"><legend>${esc(tx('الاكتشاف','Discover'))}</legend>${[['available',tx('متوفر في المعاينة','Available in preview')],['isNew',tx('المضاف حديثًا','Recently added')],['popular',tx('مختارات AnoX','AnoX picks')]].map(([k,label])=>`<label><input type="checkbox" data-filter="${k}"${f[k]?' checked':''}><span>${esc(label)}</span></label>`).join('')}</fieldset>
  </div>`;
}
function filterChips(){
  const f=ui.filters,choice=V2CatalogChoices();
  const base=Object.keys(f).filter(k=>f[k]).map(key=>{
    const label=key==='category'?categoryLabel(f[key]):key==='brand'?f[key]:key==='budget'?formatDZD(f[key]):key==='maxPrice'?formatUSD(f[key]*100):key==='available'?tx('متوفر','Available'):key==='isNew'?tx('جديد','New'):tx('مختارات','Picks');
    return `<button type="button" class="v2-filter-chip" data-remove-filter="${key}" aria-label="${esc(tx('إزالة: ','Remove: ')+label)}">${esc(label)}<span aria-hidden="true">×</span></button>`;
  });
  for(const key of ['size','color'])if(choice[key]){const label=key==='color'?colorName(choice[key]):choice[key];base.push(`<button type="button" class="v2-filter-chip" data-v2-remove-choice="${key}" aria-label="${esc(tx('إزالة: ','Remove: ')+label)}">${esc(label)}<span aria-hidden="true">×</span></button>`);}
  return base.join('');
}
function catalogResults(products,query=''){
  products=V2ChoiceResults(products);
  const pagination=catalogPage(products,ui.page),route=currentRoute();ui.page=pagination.page;
  const pageParams=filterParams();for(const [k,v] of Object.entries(V2CatalogChoices()))if(v)pageParams.set(k,v);if(route.name==='search'&&query)pageParams.set('q',query);
  const resultLabel=products.length?`${pagination.start}–${pagination.end} ${tx('من','of')} ${pagination.total} ${tx('منتج','products')}`:tx('لا توجد نتائج','No results');
  const sorts=[['featured',tx('مختاراتنا','Featured')],['low',tx('تكلفة الوصول: الأقل','Landed cost: low first')],['high',tx('تكلفة الوصول: الأعلى','Landed cost: high first')],['newest',tx('الأحدث','Newest')]];
  const toolbar=`<div class="v2-catalog-toolbar"><div><button type="button" class="btn secondary small v2-filter-trigger" data-open="filters">${icon('filter')}${esc(tx('الفلاتر','Filters'))}</button><span id="results-count" class="v2-results-count" role="status" tabindex="-1">${esc(resultLabel)}</span></div><label class="v2-sort"><span>${esc(tx('الترتيب','Sort'))}</span><select class="select" data-sort>${sorts.map(([v,l])=>`<option value="${v}"${ui.sort===v?' selected':''}>${esc(l)}</option>`).join('')}</select></label></div>`;

function v2MegaPanel(key,category=""){

function v2MegaTrigger(key,label,category=""){
  const route=currentRoute(),selected=!!category&&route.name==="shop"&&route.params.get("category")===category;
  return '<li class="v2-mega-root" data-v2-mega-root="'+esc(key)+'"><button type="button" class="v2-category-trigger'+(selected?' v2-is-current':'')+'" data-v2-mega="'+esc(key)+'" aria-expanded="false" aria-controls="v2-mega-'+esc(key)+'">'+esc(label)+'<span class="v2-caret" aria-hidden="true"></span></button>'+v2MegaPanel(key,category)+'</li>';
}
function v2CloseMega(returnFocus=false){
  clearTimeout(v2Navigation.hoverTimer);clearTimeout(v2Navigation.leaveTimer);
  const key=v2Navigation.open;v2Navigation.open="";
  $("site-header")?.querySelectorAll("[data-v2-mega]").forEach(node=>node.setAttribute("aria-expanded","false"));
  $("site-header")?.querySelectorAll("[data-v2-mega-panel]").forEach(node=>{node.hidden=true;});
  if(returnFocus&&key)$("site-header")?.querySelector('[data-v2-mega="'+key+'"]')?.focus();
}
function v2OpenMega(key){
  const trigger=$("site-header")?.querySelector('[data-v2-mega="'+key+'"]'),panel=$("v2-mega-"+key);
  if(!trigger||!panel||!window.matchMedia("(min-width: 1050px)").matches)return;
  v2CloseMega();v2Navigation.open=key;trigger.setAttribute("aria-expanded","true");panel.hidden=false;
}
function v2BindNavigation(){
  if(v2Navigation.bound)return;v2Navigation.bound=true;
  const header=$("site-header");
  header.addEventListener("click",event=>{
    const trigger=event.target.closest("[data-v2-mega]");
    if(trigger){const key=trigger.dataset.v2Mega;v2Navigation.open===key?v2CloseMega():v2OpenMega(key);return;}
    if(event.target.closest("a, [data-open], [data-language], [data-theme]"))v2CloseMega();
  });
  header.addEventListener("pointerover",event=>{
    if(event.pointerType==="touch")return;
    const root=event.target.closest("[data-v2-mega-root]");
    if(!root||root.contains(event.relatedTarget))return;
    clearTimeout(v2Navigation.leaveTimer);clearTimeout(v2Navigation.hoverTimer);
    const key=root.dataset.v2MegaRoot;
    if(key!==v2Navigation.open)v2Navigation.hoverTimer=setTimeout(()=>v2OpenMega(key),180);
  });
  header.addEventListener("pointerout",event=>{
    const root=event.target.closest("[data-v2-mega-root]");
    if(!root||root.contains(event.relatedTarget))return;
    clearTimeout(v2Navigation.hoverTimer);
    v2Navigation.leaveTimer=setTimeout(()=>{
      if(!root.contains(document.activeElement)&&v2Navigation.open===root.dataset.v2MegaRoot)v2CloseMega();
    },180);
  });
  header.addEventListener("focusout",()=>setTimeout(()=>{
    const active=document.activeElement,root=header.querySelector('[data-v2-mega-root="'+v2Navigation.open+'"]');
    if(v2Navigation.open&&root&&!root.contains(active))v2CloseMega();
  },0));
  document.addEventListener("pointerdown",event=>{if(v2Navigation.open&&!event.target.closest(".v2-category-nav"))v2CloseMega();});
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"&&v2Navigation.open){event.preventDefault();event.stopPropagation();v2CloseMega(true);}
  },true);
  window.addEventListener("hashchange",()=>v2CloseMega());
  window.matchMedia("(min-width: 1050px)").addEventListener("change",()=>v2CloseMega());
}

/* Component: search.js */
/* Search presentation. This URL screen never fetches and is not an SSRF boundary.
   A future ingestion service must validate DNS/IPs and every redirect, restrict
   egress, and bound response time, bytes and MIME types on a trusted server. */
function v2PublicURLHost(hostname){
  const host=hostname.toLowerCase().replace(/\.$/,"");
  if(!host||host==="localhost"||/(?:^|\.)(?:localhost|local|internal|home|lan|corp|intranet|invalid|test)$/.test(host))return false;
  if(host.startsWith("[")){
    const address=host.slice(1,-1),parts=address.split(":"),first=parseInt(parts[0],16),second=parseInt(parts[1]||"0",16);
    // Only global unicast, excluding documentation and transition ranges.
    return first>=0x2000&&first<=0x3fff&&first!==0x2002&&!(first===0x2001&&[0,2,0x10,0x20,0xdb8].includes(second));
  }
  if(/^\d+\.\d+\.\d+\.\d+$/.test(host)){
    const [a,b,c]=host.split(".").map(Number);
    return !(a===0||a===10||a===127||a>=224||(a===100&&b>=64&&b<=127)||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&(b===168||(b===0&&(c===0||c===2))))||(a===198&&(b===18||b===19||(b===51&&c===100)))||(a===203&&b===0&&c===113));
  }
  return host.includes(".")&&host.split(".").every(label=>/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/i.test(label));
}
function v2ClassifySearch(value){
  const raw=String(value??"").trim();
  const looksLikeURL=/^[a-z][a-z0-9+.-]*:/i.test(raw)||raw.startsWith("//")||/^www\./i.test(raw);
  if(!looksLikeURL)return raw.length>100?{kind:"invalid",reason:"query-length"}:{kind:"query",query:raw};
  if(raw.length>2000)return {kind:"invalid",reason:"url-length"};
  if(/[\u0000-\u0020\u007f\\]/.test(raw))return {kind:"invalid",reason:"url-invalid"};
  let parsed;try{parsed=new URL(raw);}catch{return {kind:"invalid",reason:"url-invalid"};}
  if(!["https:","http:"].includes(parsed.protocol))return {kind:"invalid",reason:"scheme"};
  if(parsed.username||parsed.password)return {kind:"invalid",reason:"credentials"};
  if(!v2PublicURLHost(parsed.hostname))return {kind:"invalid",reason:"public-host"};
  if(parsed.protocol!=="https:")return {kind:"invalid",reason:"https-required"};
  if(parsed.href.length>2000)return {kind:"invalid",reason:"url-length"};
  return {kind:"url",url:raw,host:parsed.hostname};
}
function v2SearchMessage(reason){
  const labels={
    "query-length":tx("اجعل البحث 100 حرف أو أقل.","Keep your search to 100 characters or fewer."),
    "url-length":tx("يقبل نموذج الطلب روابط بطول 2000 حرف كحد أقصى. استخدم رابطًا أقصر؛ لم نقتطع الرابط.","The request form accepts links up to 2,000 characters. Use a shorter link; your link has not been truncated."),
    "https-required":tx("تم التعرف على الرابط. يتطلب نموذج الطلب رابط HTTPS آمنًا؛ الصق النسخة الآمنة من صفحة المنتج.","Link recognized. The request form requires HTTPS; paste the secure version of the product page."),
    "credentials":tx("استخدم رابط منتج دون اسم مستخدم أو كلمة مرور مضمنة.","Use a product link without an embedded username or password."),
    "public-host":tx("استخدم رابط موقع عام، وليس عنوانًا محليًا أو خاصًا.","Use a public website link, rather than a local or private address."),
    "scheme":tx("الصق رابط منتج يبدأ بـ https://.","Paste a product link that starts with https://."),
    "url-invalid":tx("تحقق من الرابط والصق عنوان صفحة منتج كاملًا يبدأ بـ https://.","Check the link and paste a complete https:// product page address.")
  };
  return labels[reason]||labels["url-invalid"];
}
function v2RequestFromURL(value){
  const result=v2ClassifySearch(value);if(result.kind!=="url")return false;
  // Preserve the complete link in the existing draft; do not route it through
  // requestFromQuery, which is intentionally a product-name-only helper.
  captureForms();
  const previous=state.drafts.request||{};
  const form=$("request-form");if(form)form.dataset.discarded="true";
  state.drafts.request={...previous,name:previous.url===result.url?(previous.name||""):"",url:result.url};
  delete ui.formMemory["request-form"];
  navigate("request");return true;
}
function submitSearch(value){
  const result=v2ClassifySearch(value);
  if(result.kind==="url"){v2RequestFromURL(result.url);return;}
  if(result.kind==="invalid"){
    if($("search-query"))renderSuggestions();
    else openSearch(String(value??""));
    $("search-query")?.focus();return;
  }
  const query=result.query;saveRecent(query);
  ui.filters=defaultFilters();ui.sort="featured";
  navigate("search",query?{q:query}:{});
}
let v2SearchBound=false;
function v2BindSearch(){
  if(v2SearchBound)return;v2SearchBound=true;
  // Clear old options immediately, so Enter/click during the debounce cannot
  // activate a suggestion for text the shopper has already replaced.
  document.addEventListener("input",event=>{
    if(event.target.id!=="search-query")return;
    ui.searchIndex=-1;ui.searchItems=[];
    event.target.removeAttribute("aria-activedescendant");
    event.target.setAttribute("aria-expanded","false");
    const suggestions=$("suggestions");if(suggestions)suggestions.innerHTML="";
  },true);
}
function openSearch(query=""){
  v2BindSearch();ui.searchIndex=-1;
  openDialog("search",tx("اعثر على اختيارك القادم","Find your next discovery"),
    '<div class="v2-search"><p class="v2-search-intro">'+esc(tx("ابحث في الكتالوج أو الصق رابط منتج لبدء طلب خاص.","Search the catalog or paste a product link to start a request."))+'</p><div class="v2-search-input-row">'+icon("search")+'<label class="sr-only" for="search-query">'+esc(tx("ابحث عن منتج أو مجموعة أو فئة، أو الصق رابطًا","Search a product, collection or category, or paste a link"))+'</label><input class="input" id="search-query" type="search" value="'+esc(String(query??""))+'" maxlength="2048" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-describedby="v2-search-help v2-search-error" aria-expanded="false" placeholder="'+esc(tx("منتج، مجموعة، فئة أو رابط…","Product, collection, category or link…"))+'"></div><p id="v2-search-error" class="v2-search-error" hidden></p><div id="suggestions" role="listbox" aria-label="'+esc(tx("اقتراحات البحث","Search suggestions"))+'"></div><p class="sr-only" id="search-status" role="status" aria-live="polite"></p><p class="v2-search-help" id="v2-search-help">'+esc(tx("↑ ↓ للاختيار · Enter للمتابعة · Esc للإغلاق. الروابط لا تُفتح ولا تُجلب بياناتها.","↑ ↓ to choose · Enter to continue · Esc to close. Links are never opened or fetched."))+'</p></div>');
  renderSuggestions();
}
function renderSuggestions(){
  const input=$("search-query"),target=$("suggestions");if(!input||!target)return;
  const result=v2ClassifySearch(input.value),error=$("v2-search-error");
  ui.searchItems=[];let markup="";
  function option(item,html){
    const index=ui.searchItems.push(item)-1;
    return '<button type="button" class="v2-suggestion" role="option" tabindex="-1" id="suggestion-'+index+'" aria-selected="'+(ui.searchIndex===index)+'" data-suggestion="'+index+'">'+html+'</button>';
  }
  function label(value){return '<div class="v2-suggestion-label">'+esc(value)+'</div>';}
  function copy(title,detail=""){return '<span class="v2-suggestion-copy"><strong>'+esc(title)+'</strong>'+(detail?'<small>'+esc(detail)+'</small>':"")+'</span>';}
  if(error){error.hidden=result.kind!=="invalid";error.textContent=result.kind==="invalid"?v2SearchMessage(result.reason):"";}
  input.setAttribute("aria-invalid",String(result.kind==="invalid"));
  if(result.kind==="url"){
    markup=label(tx("رابط منتج","Product link"))+option({type:"url-request",url:result.url},'<span class="v2-suggestion-symbol">'+icon("external")+'</span>'+copy(tx("ابدأ طلبًا بهذا الرابط","Start a request with this link"),result.host)+icon("arrow","arrow"))+'<p class="v2-search-note">'+esc(tx("سنضع الرابط كاملًا في نموذج الطلب. أضف اسم المنتج وتفاصيله بنفسك؛ لا يتم استيراد بيانات أو إرسال طلب إلى متجر.","We’ll place the full link in the request form. Add the product name and details yourself; no details are imported or request sent to a store."))+'</p>';
  }else if(result.kind==="query"&&result.query){
    const query=result.query,products=SearchService.search(query),normalized=normalizeSearch(query);
    const matchingBrands=[...new Set(products.map(product=>product.brand))].filter(name=>normalizeSearch(name).includes(normalized)).slice(0,2);
    const matchingCategories=[...new Set(products.map(product=>product.category))].filter(key=>normalizeSearch([key,CATEGORIES[key]?.ar,CATEGORIES[key]?.en].join(" ")).includes(normalized)).slice(0,2);
    if(matchingCategories.length){markup+=label(tx("الفئات","Categories"));markup+=matchingCategories.map(category=>option({type:"category",category},icon("bag")+copy(categoryLabel(category),tx("استكشف الفئة","Explore the category"))+icon("arrow","arrow"))).join("");}
    if(matchingBrands.length){markup+=label(tx("المجموعات","Collections"));markup+=matchingBrands.map(brandName=>option({type:"brand",brand:brandName},icon("box")+copy(brandName,tx("مجموعة توضيحية من AnoX","Illustrative AnoX collection"))+icon("arrow","arrow"))).join("");}
    if(products.length){
      markup+=label(tx("المنتجات","Products"));
      markup+=products.slice(0,5).map(product=>option({type:"product",id:product.id},'<span class="v2-suggestion-art">'+productArt(product)+'</span>'+copy(localized(product.name),product.brand+" · "+categoryLabel(product.category))+'<bdi>'+formatUSD(product.priceCents)+'</bdi>')).join("");
      markup+=option({type:"search",query},copy(tx("عرض كل النتائج","View all results"),products.length+" "+tx("منتج توضيحي","illustrative products"))+icon("arrow","arrow"));
    }else{
      markup+='<p class="v2-search-note">'+esc(tx("لا توجد منتجات مطابقة. جرّب كلمة أخرى أو ابدأ طلب منتج خاص.","No products matched. Try another word or start a product request."))+'</p>';
      markup+=option({type:"request",query},icon("box")+copy(tx("اطلب منتجًا بهذا الاسم","Request a product with this name"),query)+icon("arrow","arrow"));
    }
  }else if(result.kind==="query"){
    const recent=state.recent.filter(query=>v2ClassifySearch(query).kind==="query").slice(0,4);
    if(recent.length){markup+=label(tx("عمليات البحث الأخيرة","Recent searches"));markup+=recent.map(query=>option({type:"search",query},icon("search")+copy(query,tx("على هذا الجهاز","On this device")))).join("");}
    markup+=label(tx("ابدأ بفئة","Start with a category"));
    markup+=Object.keys(CATEGORIES).slice(0,5).map(category=>option({type:"category",category},icon("bag")+copy(categoryLabel(category))+icon("arrow","arrow"))).join("");
    markup+='<p class="v2-search-note">'+esc(tx("هل وجدت منتجًا في موقع آخر؟ الصق رابط HTTPS عامًا لبدء طلب محلي.","Found a product elsewhere? Paste a public HTTPS link to start a local request."))+'</p>';
  }
  target.innerHTML=markup;input.setAttribute("aria-expanded",String(ui.searchItems.length>0));
  $("search-status").textContent=result.kind==="invalid"?v2SearchMessage(result.reason):ui.searchItems.length+" "+tx("اقتراح متاح","suggestions available");
  if(ui.searchIndex>=ui.searchItems.length)ui.searchIndex=-1;
  updateSearchSelection();
}
function activateSuggestion(index){
  const item=ui.searchItems[index];if(!item)return;
  const input=$("search-query"),result=v2ClassifySearch(input?input.value:"");
  if(item.type==="url-request"){v2RequestFromURL(item.url);return;}
  if(item.type==="product"){if(result.kind==="query")saveRecent(result.query);openProduct(item.id);}
  else if(item.type==="request")requestFromQuery(item.query);
  else if(item.type==="category"||item.type==="brand"){
    if(result.kind==="query"&&result.query)saveRecent(result.query);
    ui.filters=defaultFilters();ui.sort="featured";
    navigate("shop",item.type==="category"?{category:item.category}:{brand:item.brand});
  }else submitSearch(item.query);
}
