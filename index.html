<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b2a">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="AnoX — اكتشف المنتجات، وقارن تكلفة وصولها إلى الجزائر. تجربة مستقلة ببيانات توضيحية، دون مدفوعات فعلية.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-8blxRUZhDE93YUaeS3lhtzzmFCJG5s5JtMWuprPaOyo='; script-src-attr 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AnoX — اختيارات أبعد. تكلفة أوضح.</title>

  <!--
    ANOX / SELF-CONTAINED STOREFRONT
    Everything required to render and use this application is in this document.
    No network requests, external libraries, external fonts, build process or server.

    CSP boundary: script-src authorizes only the SHA-256 hash of the exact inline script.
    Recompute that hash after any script edit. style-src still needs unsafe-inline for
    the embedded stylesheet and existing, escaped style attributes; this does not permit
    inline JavaScript handlers. connect-src and default-src remain none.
    Layout refinements were audited at the source/template level for desktop and mobile;
    direct local-file browser inspection was unavailable in the build environment.

    Release-candidate audit (2026-09-11):
    RELEASE STATUS: BLOCKED pending real-browser/mobile release-gate validation.
    AUTOMATED TESTS: 105/105 PASS (isolated, in-memory; existing tests retained).
    CSP HASH: VERIFIED against the exact final inline-script UTF-8 bytes.
    NETWORK REQUESTS: NONE initiated by this application's resources or data layer.
    P0 ISSUES: No known unresolved findings in the audited and tested code.
    P1 ISSUES: No known unresolved code findings; visual/mobile QA remains unverified.
    Additional evidence: 104 Arabic/English, light/dark route-template cases passed;
    actual checkout, request and quote flows passed in the isolated DOM harness.
    This is not an approval to publish without the remaining browser release gate.
    Known limitations:
    - Real Safari, keyboard, virtual-keyboard and 320–1440px visual checks were unavailable.
    - LCP, INP and CLS were not measured; no benchmark result is claimed.
    - New records and quote decisions require coordinated writable browser storage;
      failed commits keep the cart/form unchanged and can be retried.
    - Each record collection holds 100 items; new records are refused rather than
      silently deleting earlier ones. Local file storage remains browser-dependent.
    - Commerce, inventory, quotes and tracking remain illustrative and device-local.

    Commercial boundary:
    The built-in catalog is explicitly illustrative. Orders, quotations and tracking
    are device-local simulations. This document never processes payments, verifies
    merchant inventory or pretends to create an authenticated customer account.
  -->

  <style>

    /* 01 — Foundation and design tokens */
    :root{
      color-scheme:light;
      --bg:#f6f7f9;--paper:#fff;--paper-2:#eef1f5;--ink:#17202e;
      --ink-2:#3c4859;--muted:#606d80;--line:#e1e5ec;--blue:#3154ce;
      --text-base:1rem;--text-label:.875rem;
      --blue-hover:#2543b3;--accent:#3154ce;--deep:#101b2a;--on-deep:#fff;
      --header:rgba(255,255,255,.94);--success:#167654;--danger:#b82e43;
      --warning:#936313;--focus:#426cf0;--shadow:0 16px 48px rgba(19,35,61,.09);
      --shadow-sm:0 4px 16px rgba(19,35,61,.05);
      --radius:22px;--radius-sm:13px;--max:1360px;--header-h:78px;
      --ease:cubic-bezier(.2,.7,.2,1);
      --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }
    html[data-theme="dark"]{
      color-scheme:dark;
      --bg:#11151c;--paper:#191f28;--paper-2:#232c38;--ink:#f1f4f8;
      --ink-2:#d2d9e4;--muted:#adb8c8;--line:#354152;--blue:#4763d0;
      --blue-hover:#3f58bd;--accent:#b4c3ff;--deep:#0c1017;--on-deep:#f7f9ff;
      --header:rgba(17,21,28,.96);--success:#83dbb6;--danger:#ffa9b4;
      --warning:#f2cc81;--focus:#a1b8ff;--shadow:0 18px 60px rgba(0,0,0,.3);
      --shadow-sm:0 6px 22px rgba(0,0,0,.2);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:100px;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--font);overflow-wrap:break-word}
    html[dir="rtl"] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
    body.modal-open{overflow:hidden}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea,summary{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.48;box-shadow:none!important;transform:none!important}
    input,select,textarea{min-width:0}
    a{color:inherit;text-decoration:none}
    img,svg{max-width:100%}
    svg{display:block}
    h1,h2,h3,h4,p,figure{margin:0}
    h1,h2,h3,h4{line-height:1.17;letter-spacing:-.045em}
    html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] h4{letter-spacing:0;line-height:1.45}
    h1{font-size:clamp(2.25rem,5.2vw,4.8rem);font-weight:800}
    h2{font-size:clamp(1.8rem,3.1vw,3rem);font-weight:780}
    h3{font-size:1.25rem;font-weight:750}
    p{overflow-wrap:anywhere}
    [hidden]{display:none!important}
    :focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    [tabindex="-1"]:focus{outline:none}
    ::selection{background:#c5d2ff;color:#101b2a}
    .container{width:min(calc(100% - 64px),var(--max));margin-inline:auto}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip-link:focus{position:fixed;inset:12px auto auto 12px;z-index:300;width:auto;height:auto;margin:0;padding:12px 20px;clip:auto;background:var(--paper);color:var(--ink);border-radius:10px;box-shadow:var(--shadow)}
    .muted{color:var(--muted)}
    .fine{font-size:var(--text-label);line-height:1.65;color:var(--muted)}
    .eyebrow{display:flex;align-items:center;gap:10px;font-size:var(--text-label);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
    .eyebrow::before{content:"";width:22px;height:2px;background:currentColor;flex:none}
    html[dir="rtl"] .eyebrow{letter-spacing:0}
    .section{padding-block:72px}
    .section-tight{padding-block:46px}
    .page{padding-block:48px 84px;min-height:55vh}
    .page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:34px}
    .page-heading h1{margin-block:13px}
    .page-heading p{max-width:760px;color:var(--muted);font-size:1.04rem}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:26px}
    .section-head h2{margin-top:12px}
    .surface{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
    .stack>*+*{margin-top:20px}
    .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .actions-spaced{margin-top:24px}
    .btn{min-height:48px;padding:11px 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:99px;font-weight:750;font-size:.93rem;line-height:1.4;transition:background .18s,transform .18s,box-shadow .18s;text-align:center}
    .btn:hover{transform:translateY(-1px)}
    .btn.primary{background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(49,84,206,.12)}
    .btn.primary:hover{background:var(--blue-hover)}
    .btn.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}
    .btn.secondary:hover{background:var(--paper-2)}
    .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
    .btn.small{min-height:44px;font-size:var(--text-label);padding-inline:16px}
    .btn.full{width:100%}
    form[aria-busy="true"] button[type="submit"]{cursor:progress;opacity:.7}
    .text-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px;border:0;background:none;color:var(--accent);font-size:var(--text-label);font-weight:750;border-radius:8px}
    .text-btn:hover{text-decoration:underline}
    .icon-btn{width:44px;min-width:44px;height:44px;padding:10px;border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);position:relative}
    .icon-btn:hover{background:var(--paper-2)}
    .icon{width:21px;height:21px;flex:none;display:inline-block;vertical-align:middle}
    .arrow{transition:transform .2s}
    html[dir="rtl"] .arrow,html[dir="rtl"] .menu-links a>span{transform:rotate(180deg)}
    .pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:var(--text-label);font-weight:700;color:var(--muted);background:var(--paper-2)}
    .pill.success{color:var(--success)}
    .notice{display:flex;gap:11px;padding:15px 17px;border-radius:13px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);font-size:var(--text-label)}
    .notice>.icon{margin-top:2px}
    .notice.warning{color:var(--warning)}
    .notice.success{color:var(--success)}
    .price-number,bdi{font-variant-numeric:tabular-nums}
    .price-number{white-space:normal;overflow-wrap:anywhere}
    .route-enter{animation:route-enter .22s var(--ease)}
    @keyframes route-enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}

    /* 02 — Navigation */
    .announcement{min-height:34px;padding:7px 16px;text-align:center;background:var(--deep);color:var(--on-deep);font-size:var(--text-label);line-height:1.5}
    .site-header{position:sticky;top:0;z-index:50;background:var(--header);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .header-row{min-height:var(--header-h);display:grid;grid-template-columns:auto minmax(180px,1fr) auto;gap:20px;align-items:center}
    .brand-nav{display:flex;align-items:center;min-width:max-content}
    .brand{display:inline-flex;min-height:44px;align-items:center;gap:10px;white-space:nowrap;flex:none;font-size:1.55rem;font-weight:850;letter-spacing:-.065em;line-height:1.2}
    .brand-mark{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;color:white;background:linear-gradient(135deg,#497dfc,#3154ce);font-size:23px;font-weight:850;letter-spacing:-.08em}
    .desktop-nav{display:flex;gap:19px;margin-inline-start:20px}
    .desktop-nav a{font-size:var(--text-label);font-weight:730;white-space:nowrap;padding-block:24px;position:relative}
    .desktop-nav a[aria-current="page"]::after{content:"";position:absolute;inset-inline:0;bottom:13px;height:2px;background:var(--accent)}
    .header-search{height:44px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:99px;padding-inline:16px;background:var(--bg);color:var(--muted);min-width:0;width:100%;text-align:start}
    .header-search span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:var(--text-label)}
    kbd{font:inherit;font-size:var(--text-label);padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper)}
    .header-actions{display:flex;align-items:center;gap:3px}
    .header-text{border:0;background:none;min-height:44px;padding:8px 10px;font-size:var(--text-label);font-weight:750;color:var(--ink);white-space:nowrap;border-radius:9px}
    .header-text:hover{background:var(--paper-2)}
    .badge{position:absolute;top:0;inset-inline-end:0;min-width:22px;height:22px;display:grid;place-items:center;padding-inline:4px;border:2px solid var(--paper);border-radius:99px;background:var(--blue);color:#fff;font-size:var(--text-label);font-weight:800}
    .mobile-search,.menu-toggle{display:none}
    .storage-banner{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;font-size:var(--text-label);color:var(--warning);text-align:center}
    .mobile-nav{display:none}
    .menu-links{display:grid;gap:3px}
    .menu-links a{display:flex;align-items:center;justify-content:space-between;min-height:49px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:1.05rem;font-weight:700}
    .menu-links a[aria-current="page"]{color:var(--accent)}
    .menu-tools{display:flex;gap:10px;margin-top:24px}

    /* 03 — Homepage and editorial artwork */
    .hero{background:var(--paper);padding-block:34px 42px}
    .hero-grid{display:grid;grid-template-columns:1.03fr 1fr;gap:46px;align-items:center;min-height:590px}
    .hero-copy{padding-block:30px}
    .hero-copy h1{font-size:clamp(3.1rem,5vw,5.35rem);line-height:1.16;letter-spacing:-.065em;margin-block:25px 30px}
    html[dir="rtl"] .hero-copy h1{font-size:clamp(2.65rem,4.5vw,4.6rem);line-height:1.5;letter-spacing:0}
    .hero-copy h1 span{display:block;color:var(--accent)}
    .hero-copy>p{max-width:610px;font-size:1.03rem;line-height:1.95;color:var(--muted)}
    .hero-copy>.actions{margin-top:33px}
    .hero-steps{display:flex;justify-content:space-between;gap:12px;font-size:var(--text-label);color:var(--muted);border-top:1px solid var(--line);padding-top:22px;margin-top:34px}
    .hero-visual{border-radius:27px;overflow:hidden;background:#e2ebf5;border:1px solid #d8e2ee;color:#16253a}
    .hero-scene{aspect-ratio:1.46;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 30% 20%,#fcffff 0,#d8e7f4 47%,#bacde2 100%)}
    .hero-scene::before{content:"";position:absolute;inset:0;background:linear-gradient(128deg,transparent 48%,#fff4 48.1%,transparent 73%);z-index:-1}
    .scene-label{position:absolute;top:18px;inset-inline-start:18px;z-index:4;background:#f6fbffcc;padding:7px 11px;border-radius:6px;font:700 var(--text-label)/1.3 var(--font);letter-spacing:.14em;direction:ltr}
    .scene-floor{position:absolute;left:-15%;right:-15%;height:43%;bottom:-18%;background:linear-gradient(120deg,#f5f8fb,#a9bed3);transform:rotate(-9deg);box-shadow:0 -10px 50px #ffffff70}
    .plinth{position:absolute;background:linear-gradient(120deg,#fcffff,#bccbdc);box-shadow:20px 24px 35px #344b6726;border-radius:3px}
    .plinth.back{width:37%;height:34%;left:39%;bottom:23%;transform:skewY(-8deg)}
    .plinth.front{width:53%;height:24%;left:9%;bottom:2%;transform:skewY(-8deg)}
    .hero-object{position:absolute;filter:drop-shadow(12px 17px 12px #20314930)}
    .hero-object svg{width:100%;height:auto;overflow:visible}
    .hero-object.headphones{width:44%;top:3%;left:34%;transform:rotate(6deg)}
    .hero-object.shoe{width:59%;bottom:0;left:0;transform:rotate(-8deg);z-index:3}
    .hero-object.bag{width:47%;bottom:2%;right:-2%;transform:rotate(11deg);z-index:2}
    .editorial-caption{font-size:var(--text-label);text-align:center;padding:9px 15px;color:#435972;background:#e5eef6}
    .hero-ticket{padding:20px 25px;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
    .hero-ticket>div+div{border-inline-start:1px solid var(--line);padding-inline-start:22px}
    .hero-ticket span{display:block;font-size:var(--text-label);color:var(--muted)}
    .hero-ticket strong{display:block;margin-top:4px;font-size:1.4rem;letter-spacing:-.025em}
    .hero-ticket p{grid-column:1/-1;color:var(--muted);font-size:var(--text-label)}
    .category-strip{display:flex;align-items:center;gap:22px;padding-block:25px;border-bottom:1px solid var(--line)}
    .category-strip>span{white-space:nowrap;font-size:var(--text-label);color:var(--muted)}
    .category-scroll{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
    .category-chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:10px 15px;min-height:44px;font-size:var(--text-label)}
    .category-chip:hover{border-color:var(--accent);color:var(--accent)}
    .cost-editorial{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;padding:46px;border:1px solid var(--line);border-radius:26px;background:var(--paper);align-items:center}
    .cost-editorial h2{margin-block:15px 22px}
    .cost-editorial>div>p{color:var(--muted)}
    .request-banner{display:flex;justify-content:space-between;align-items:center;gap:28px;padding:38px;background:var(--paper-2);border-radius:24px}
    .request-banner h2{margin-top:12px;font-size:clamp(1.55rem,2.5vw,2.5rem)}
    .request-banner p{color:var(--muted);margin-top:12px}

    /* 04 — Catalog and discovery */
    .product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
    .product-card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:box-shadow .2s,transform .2s}
    .product-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .product-visual{position:relative;aspect-ratio:1.08;overflow:hidden;background:#e8eef6}
    .product-image{display:block;width:100%;height:100%}
    .product-image>svg{height:100%;width:100%;transition:transform .35s var(--ease)}
    .product-card:hover .product-image>svg{transform:scale(1.035)}
    .product-image:focus-visible{outline-offset:-5px}
    .product-badge{position:absolute;bottom:11px;inset-inline-start:11px;max-width:calc(100% - 22px);font-size:var(--text-label);font-weight:780;line-height:1.4;color:#21334b;background:#fffffff0;padding:5px 9px;border-radius:99px;pointer-events:none}
    .wish-button{position:absolute;top:5px;inset-inline-end:5px;background:#ffffffbd;color:#23374d;width:44px;min-width:44px;height:44px}
    .wish-button[aria-pressed="true"]{color:#bf315c;background:#fff}
    .wish-button[aria-pressed="true"] svg{fill:#f8d7e3}
    .product-info{padding:17px}
    .product-brand{color:var(--muted);font-size:var(--text-label);font-weight:780;letter-spacing:.065em;text-transform:uppercase}
    .product-name{display:block;font-size:1rem;font-weight:760;line-height:1.5;margin-block:6px 12px;min-height:3em}
    .product-name:hover{color:var(--accent)}
    .item-price{display:flex;align-items:baseline;justify-content:space-between;gap:9px;flex-wrap:wrap;font-size:1rem;font-weight:800}
    .item-price>span{font-size:var(--text-label);font-weight:500;color:var(--muted)}
    .card-landed{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
    .card-landed span{font-size:var(--text-label);color:var(--muted)}
    .card-landed strong{font-size:1.03rem}
    .card-actions{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:14px;flex-wrap:wrap}
    .card-actions .text-btn{padding-inline:0;font-size:var(--text-label)}
    .card-actions .btn{font-size:var(--text-label);min-height:44px;padding-inline:13px}
    .catalog-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:30px}
    .catalog-layout .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .filter-panel{align-self:start;position:sticky;top:100px}
    .filter-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
    .filter-heading h2{font-size:1.15rem}
    .filter-group{padding-block:19px;border:0;border-bottom:1px solid var(--line);margin:0;min-width:0}
    .filter-title{display:block;font-size:var(--text-label);font-weight:780;margin-bottom:10px}
    .filter-group legend{padding-top:19px}
    .filter-option{display:flex;align-items:center;gap:10px;min-height:44px;font-size:var(--text-label);color:var(--ink-2);cursor:pointer}
    .filter-option input{accent-color:var(--blue);width:18px;height:18px}
    .catalog-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px;flex-wrap:wrap}
    .toolbar-start{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
    .results-count{font-size:var(--text-label);color:var(--muted);scroll-margin-top:calc(var(--header-h) + 24px)}
    .filter-extra{border-top:1px solid var(--line);margin-top:4px}
    .filter-extra>summary{min-height:48px;padding-block:12px;font-weight:650;font-size:var(--text-label);cursor:pointer}
    .filter-extra .filter-group{padding-top:10px}
    .catalog-pagination{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:30px}
    .catalog-pagination .btn{min-width:44px}
    .catalog-pagination [aria-disabled="true"]{opacity:.45;pointer-events:none}
    .pagination-gap{color:var(--muted);padding:0 2px}
    .sort-label{display:flex;align-items:center;gap:9px;font-size:var(--text-label);color:var(--muted)}
    .sort-label select{max-width:210px;font-size:var(--text-base)}
    .filter-trigger{display:none}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink-2);font-size:var(--text-label)}
    .chip:hover{color:var(--accent);border-color:var(--accent)}
    .empty{border:1px dashed var(--line);border-radius:24px;background:var(--paper);padding:60px 25px;text-align:center}
    .empty-icon{display:grid;place-items:center;width:72px;height:72px;background:var(--paper-2);border-radius:50%;margin:0 auto 22px;color:var(--accent)}
    .empty-icon .icon{width:30px;height:30px}
    .empty h2,.empty h3{font-size:1.5rem}
    .empty p{color:var(--muted);max-width:540px;margin:15px auto 23px}
    .empty .actions{justify-content:center}
    .search-page-form{display:flex;gap:12px;margin-bottom:26px;padding:17px}
    .search-page-form input{flex:1}
    .collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .collection-card{display:block;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:22px;text-align:start;color:var(--ink);padding:0}
    .collection-card .art{aspect-ratio:1.8;overflow:hidden}
    .collection-card svg{width:100%;height:100%}
    .collection-card strong,.collection-card span{display:block;padding-inline:22px}
    .collection-card strong{font-size:1.3rem;margin-block:18px 7px}
    .collection-card span{color:var(--muted);font-size:var(--text-label);margin-bottom:22px}
    .editorial-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}
    .editorial-feature{background:var(--deep);color:#fff;border-radius:24px;padding:35px;overflow:hidden}
    .editorial-feature .eyebrow{color:#a9baff}
    .editorial-feature svg{max-height:340px;margin:10px auto}
    .editorial-feature h2{font-size:2rem;margin-bottom:14px}
    .editorial-feature p{color:#c2cddd;font-size:var(--text-base);margin-bottom:22px}
    .editorial-side{display:grid;gap:24px}
    .editorial-small{display:grid;grid-template-columns:1fr 1fr;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;padding:22px;gap:15px}
    .editorial-small svg{border-radius:14px}
    .editorial-small h3{margin-top:10px;font-size:1.2rem}

    /* 05 — Prices, cart and checkout */
    .split{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:28px;align-items:start}
    .summary{border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:25px}
    .summary-head{display:flex;justify-content:space-between;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
    .summary-head strong{font-size:1rem;line-height:1.6}
    .summary-head .pill{flex:none;max-width:100%;font-size:var(--text-label)}
    .summary-row{display:flex;justify-content:space-between;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);font-size:var(--text-label);align-items:baseline;flex-wrap:wrap}
    .summary-row>span{color:var(--muted)}
    .summary-row bdi{white-space:normal;overflow-wrap:anywhere;font-weight:720}
    .summary-row.total{font-size:var(--text-base);border-bottom:0;padding-top:17px;font-weight:800}
    .summary-row.total>span{color:var(--ink)}
    .landed-total{padding:5px 0 20px}
    .landed-total strong{display:block;font-size:1.95rem;line-height:1.4;letter-spacing:-.04em}
    .landed-total span{font-size:var(--text-label);color:var(--muted)}
    .rate-foot{border-top:1px solid var(--line);margin-top:17px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:var(--text-label)}
    .cost-boundaries{margin-top:20px;border-top:1px solid var(--line);font-size:var(--text-label)}
    .cost-boundaries summary{min-height:48px;padding-block:12px;font-weight:650;cursor:pointer;color:var(--ink-2)}
    .cost-boundaries[open] summary{margin-bottom:4px}
    .cost-boundaries .spec-list{margin-top:12px}
    .summary.compact{padding:0;border:0;background:transparent}
    .summary .fine{font-size:var(--text-label)}
    .cart-line{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:19px;padding-block:24px;border-bottom:1px solid var(--line);align-items:start}
    .cart-line:first-child{padding-top:0}
    .cart-line:last-child{border-bottom:0;padding-bottom:0}
    .line-art{display:block;width:100%;border:0;padding:0;background:#e6edf5;border-radius:13px;overflow:hidden}
    .line-art svg{width:100%;height:auto}
    .line-info h3{font-size:1.04rem;line-height:1.5;margin-top:3px}
    .line-info p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .line-actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:14px}
    .line-price{text-align:end;min-width:0;flex-wrap:wrap}
    .line-price strong{display:block;font-size:var(--text-base)}
    .line-price span{display:block;color:var(--muted);font-size:var(--text-label);margin-top:5px}
    .quantity{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;overflow:hidden;min-height:44px;background:var(--paper)}
    .quantity button{width:44px;height:44px;padding:10px;border:0;color:var(--ink);background:none}
    .quantity button:hover{background:var(--paper-2)}
    .quantity span{min-width:26px;text-align:center;font-weight:750;font-size:var(--text-label)}
    .checkout-steps{display:flex;list-style:none;padding:0;margin:0 0 27px;gap:12px;counter-reset:step}
    .checkout-steps li{flex:1;display:flex;align-items:center;gap:10px;font-size:var(--text-label);color:var(--muted);padding:13px 15px;background:var(--paper);border:1px solid var(--line);border-radius:13px}
    .checkout-steps li::before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:29px;height:29px;flex:none;border-radius:50%;background:var(--paper-2);font-weight:800;font-size:var(--text-label)}
    .checkout-steps li[aria-current="step"]{border-color:var(--accent);color:var(--accent)}
    .checkout-steps li[aria-current="step"]::before{background:var(--blue);color:#fff}
    .review-address{margin-bottom:24px}
    .review-address h2{font-size:1.25rem;margin-bottom:14px}
    .review-address p{font-size:var(--text-base);color:var(--ink-2)}
    .review-address .text-btn{margin-top:9px}
    .order-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
    .snapshot-item{display:flex;justify-content:space-between;gap:18px;padding-block:20px;border-bottom:1px solid var(--line)}
    .snapshot-item:last-child{border:0}
    .snapshot-item h3{font-size:1rem;line-height:1.5}
    .snapshot-item p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .snapshot-item>div:last-child{text-align:end;white-space:nowrap}
    .snapshot-item small{display:block;color:var(--muted);font-size:var(--text-label);margin-top:5px}
    .order-delivery{margin-top:24px}
    .order-delivery h2{font-size:1.2rem;margin-bottom:15px}
    .order-delivery p{font-size:var(--text-base);color:var(--ink-2)}
    .success-banner{margin-bottom:26px}
    .order-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.93rem;overflow-wrap:anywhere}

    /* 06 — Forms and account */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:21px 18px}
    .field{min-width:0}
    .field.full{grid-column:1/-1}
    .field label{display:block;font-weight:750;font-size:var(--text-label);margin-bottom:8px}
    .input,.select,.textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);background:var(--paper);outline-offset:2px;line-height:1.5}
    .textarea{resize:vertical;min-height:118px}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--focus)}
    [aria-invalid="true"]{border-color:var(--danger)!important}
    .field-error{display:block;min-height:1.3em;font-size:var(--text-label);color:var(--danger);padding-top:5px}
    .field-help{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .form-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:25px}
    .request-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:42px;align-items:start}
    .request-aside{padding:20px}
    .request-aside h2{margin-block:18px 22px;line-height:1.45}
    .request-steps{list-style:none;padding:0;margin:20px 0}
    .request-steps li{padding-block:18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.95rem}
    .business-aside{padding:34px;background:var(--deep);color:white;border-radius:22px}
    .business-aside .eyebrow{color:#a9baff}
    .business-aside h2{margin-block:20px;line-height:1.4}
    .business-aside p{color:#c3cede;font-size:var(--text-base)}
    .requests-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .request-card{display:flex;flex-direction:column;align-items:start;gap:14px}
    .request-card h2{font-size:1.3rem;line-height:1.5}
    .request-card .btn{margin-top:auto}
    .request-card .request-card-top{display:flex;align-items:center;gap:12px;justify-content:space-between;width:100%}
    .spec-list{margin:0}
    .spec-list>div{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(0,1.2fr);gap:16px;border-bottom:1px solid var(--line);padding-block:13px;font-size:var(--text-label)}
    .spec-list dt{color:var(--muted)}
    .spec-list dd{margin:0;font-weight:650;overflow-wrap:anywhere}
    .request-details h2{font-size:1.7rem;margin-block:15px 20px}
    .source-link{display:inline-flex;gap:6px;align-items:center;font-size:var(--text-label);color:var(--accent);margin-block:20px;overflow-wrap:anywhere}
    .request-notes{white-space:pre-wrap;color:var(--muted);font-size:var(--text-base);margin-block:16px}
    .quote-decision{margin-top:22px}
    .quote-decision p{margin-top:13px;font-size:var(--text-base)}
    .quote-decision .actions{margin-top:21px}
    .budget-warning{color:var(--warning)}
    .account-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}
    .account-nav{display:grid;gap:7px;align-content:start}
    .account-nav a,.account-nav button{display:block;text-align:start;padding:12px 15px;min-height:45px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:11px;font-weight:700;font-size:.9rem}
    .profile-form{display:flex;align-items:flex-end;gap:16px}
    .profile-form .field{flex:1}
    .profile-form .field-error{display:none}
    .account-section{margin-top:30px}
    .account-section>h2{font-size:1.5rem;margin-bottom:20px}
    .order-card{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px;border:1px solid var(--line);border-radius:17px;background:var(--paper);margin-bottom:12px}
    .order-card h3{font-size:var(--text-base);line-height:1.5}
    .order-card p{font-size:var(--text-label);color:var(--muted);margin-top:6px}
    .order-card-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
    .privacy-box{margin-top:30px}

    /* 07 — Product dialog, drawers and search */
    .scrim{position:fixed;inset:0;z-index:90;background:rgba(7,15,28,.58);backdrop-filter:blur(5px)}
    .dialog{position:fixed;z-index:100;inset:5vh max(24px,calc((100vw - 1160px)/2));max-height:90vh;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:25px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .dialog-head{min-height:69px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 23px;border-bottom:1px solid var(--line);flex:none}
    .dialog-head h2{font-size:1.22rem;line-height:1.5}
    .dialog-content{overflow:auto;overscroll-behavior:contain;padding:25px;min-height:0}
    .dialog[data-kind="cart"],.dialog[data-kind="menu"],.dialog[data-kind="filters"]{inset:0;inset-inline-start:auto;width:min(460px,100%);max-height:100dvh;border-radius:22px 0 0 22px}
    html[dir="rtl"] .dialog[data-kind="cart"],html[dir="rtl"] .dialog[data-kind="menu"],html[dir="rtl"] .dialog[data-kind="filters"]{border-radius:0 22px 22px 0}
    .dialog[data-kind="confirm"],.dialog[data-kind="copy"]{inset:18vh max(24px,calc((100vw - 560px)/2));max-height:70vh}
    .dialog[data-kind="product"] .dialog-content{padding:0}
    .dialog[data-kind="product"] .dialog-head{position:absolute;inset-inline:0;top:0;z-index:5;justify-content:flex-end;border:0;pointer-events:none}
    .dialog[data-kind="product"] .dialog-head h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    .dialog[data-kind="product"] .dialog-head button{pointer-events:auto;background:var(--paper);box-shadow:var(--shadow-sm)}
    .product-detail{display:grid;grid-template-columns:1fr 1fr;min-width:0}
    .detail-gallery{padding:30px 25px;align-self:start;position:sticky;top:0}
    .gallery-stage{border-radius:20px;overflow:hidden;background:#e7edf5;position:relative}
    .gallery-main{width:100%;display:block;padding:0;border:0;background:none;cursor:zoom-in}
    .gallery-main>svg{width:100%;height:auto;max-height:490px;transition:transform .25s var(--ease)}
    .gallery-stage.zoomed .gallery-main{cursor:zoom-out}
    .gallery-stage.zoomed .gallery-main>svg{transform:scale(1.6)}
    .zoom-control{position:absolute;bottom:13px;inset-inline-end:13px;background:#fff!important;color:#1d2b41!important;border-color:#dce4ed!important}
    .gallery-thumbs{display:flex;gap:10px;margin-top:13px;justify-content:center}
    .gallery-thumb{width:86px;aspect-ratio:1.12;border:2px solid transparent;background:#e7edf5;padding:0;border-radius:12px;overflow:hidden}
    .gallery-thumb[aria-pressed="true"]{border-color:var(--blue)}
    .gallery-thumb svg{width:100%;height:100%}
    .illustration-note{margin-top:15px;text-align:center}
    .detail-info{padding:42px 30px 30px;min-width:0}
    .detail-tools{display:flex;gap:12px;align-items:center;justify-content:flex-start;margin-bottom:12px}
    .detail-info h1{font-size:clamp(1.9rem,2.6vw,2.8rem);line-height:1.35;margin:9px 0 20px}
    .detail-price{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;min-width:0;margin-bottom:22px}
    .detail-price small{display:block;font-size:var(--text-label);color:var(--muted)}
    .detail-price strong{font-size:1.8rem;line-height:1.6}
    .detail-price>bdi{color:var(--muted);font-size:.97rem}
    .detail-description{color:var(--muted);font-size:var(--text-base);margin-bottom:24px}
    .option-block{margin-block:21px}
    .option-label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:var(--text-label);font-weight:750;margin-bottom:11px}
    .swatches{display:flex;gap:10px;flex-wrap:wrap}
    .swatch{width:44px;height:44px;border:3px solid var(--paper);outline:1px solid var(--line);border-radius:50%;position:relative}
    .swatch[aria-pressed="true"]{outline:2px solid var(--accent)}
    .swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:10px;border:2px solid #fff;border-top:0;border-left:0;width:8px;height:12px;transform:rotate(45deg);filter:drop-shadow(0 1px 1px #000)}
    .sizes{display:flex;gap:8px;flex-wrap:wrap}
    .size-btn{min-width:48px;min-height:44px;padding:8px 11px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;font-size:var(--text-label);font-weight:700}
    .size-btn[aria-pressed="true"]{border-color:var(--accent);background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--accent)}
    .size-btn:disabled{text-decoration:line-through}
    .size-guide{margin-top:17px;border-block:1px solid var(--line);font-size:var(--text-label)}
    .size-guide summary{padding-block:14px;font-weight:750;cursor:pointer}
    .size-guide p{margin-bottom:12px}
    .size-guide table{width:100%;border-collapse:collapse;margin-bottom:14px}
    .size-guide th,.size-guide td{padding:8px;border-bottom:1px solid var(--line);text-align:start}
    .quantity-stock{display:flex;align-items:center;gap:19px;justify-content:space-between;margin-block:24px}
    .detail-cta{display:flex;gap:9px;margin-bottom:25px}
    .detail-cta>.primary{flex:1}
    .detail-cta>.secondary{padding-inline:14px}
    .detail-section{border-top:1px solid var(--line);margin-top:24px}
    .detail-section summary{padding-block:17px;font-weight:750;font-size:.91rem;cursor:pointer}
    .drawer-checkout{margin-top:22px}
    .dialog[data-kind="cart"] .cart-line{grid-template-columns:76px minmax(0,1fr)}
    .dialog[data-kind="cart"] .line-price{grid-column:2;text-align:start;display:flex;gap:10px;align-items:baseline}
    .dialog[data-kind="cart"] .line-actions{gap:7px}
    .search-input-row{display:flex;align-items:center;gap:14px;margin-bottom:22px}
    .search-input-row .input{font-size:clamp(1.03rem,2vw,1.55rem);min-height:60px}
    .suggestion-label{color:var(--muted);font-size:var(--text-label);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-block:18px 8px}
    .suggestion{width:100%;text-align:start;display:flex;align-items:center;gap:15px;border:1px solid transparent;border-radius:13px;padding:10px;background:none;color:var(--ink);min-height:55px}
    .suggestion:hover,.suggestion[aria-selected="true"]{background:var(--paper-2);border-color:var(--line)}
    .suggestion .suggestion-art{width:59px;height:54px;border-radius:9px;overflow:hidden;flex:none}
    .suggestion .suggestion-art svg{width:100%;height:100%}
    .suggestion .suggestion-copy{flex:1;min-width:0}
    .suggestion strong{display:block;font-size:var(--text-base)}
    .suggestion small{display:block;color:var(--muted);font-size:var(--text-label);margin-top:3px}
    .suggestion bdi{font-size:var(--text-label);font-weight:750}
    .copy-area{min-height:145px;resize:vertical;font-family:ui-monospace,monospace;font-size:var(--text-base);direction:ltr;text-align:left}

    /* 08 — Comparison, tracking, help and footer */
    .compare-bar{position:fixed;z-index:60;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;white-space:normal;padding:8px 10px 8px 19px;max-width:calc(100% - 24px);background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);font-size:var(--text-label)}
    html[dir="rtl"] .compare-bar{padding:8px 19px 8px 10px}
    .compare-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;scrollbar-width:thin}
    .compare-table{width:100%;min-width:620px;border-collapse:collapse;text-align:start}
    .compare-table th,.compare-table td{padding:21px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);vertical-align:top;text-align:start;font-size:.91rem;min-width:175px}
    .compare-table th:first-child{background:var(--bg);min-width:160px;width:22%}
    .compare-table thead th{width:26%}
    .compare-table .compare-art{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;overflow:hidden;margin-bottom:15px}
    .compare-art svg{max-height:220px;width:100%}
    .compare-table strong{display:block;line-height:1.5}
    .compare-hint{display:none;margin-bottom:12px}
    .steps-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:19px}
    .step-card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:29px}
    .step-number{font-size:2.6rem;color:var(--accent);letter-spacing:-.07em;font-weight:800;margin-bottom:30px}
    .step-card h2{font-size:1.28rem}
    .step-card p{font-size:var(--text-base);color:var(--muted);margin-top:14px}
    .track-container{max-width:920px}
    .track-form{display:flex;gap:12px;margin-block:26px}
    .track-form input{flex:1}
    .timeline{list-style:none;padding:0;margin:27px 0}
    .timeline li{display:grid;grid-template-columns:34px 1fr;gap:16px;position:relative;padding-bottom:30px}
    .timeline li:not(:last-child)::before{content:"";position:absolute;top:31px;bottom:0;inset-inline-start:15px;width:2px;background:var(--line)}
    .timeline-marker{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:var(--paper-2);display:grid;place-items:center}
    .timeline .done .timeline-marker,.timeline .current .timeline-marker{background:var(--blue);color:#fff;border-color:var(--blue)}
    .timeline .current .timeline-marker{box-shadow:0 0 0 5px var(--paper-2)}
    .timeline strong{display:block;font-size:.95rem;padding-top:3px}
    .timeline p{font-size:var(--text-base);color:var(--muted);margin-top:7px}
    .faq-list{border-top:1px solid var(--line)}
    .faq{border-bottom:1px solid var(--line);padding-block:4px}
    .faq summary{cursor:pointer;font-size:1rem;font-weight:760;padding-block:19px}
    .faq p{padding-bottom:21px;max-width:900px;color:var(--muted);font-size:var(--text-base)}
    .help-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:38px}
    .help-card{scroll-margin-top:110px}
    .help-card .icon{width:27px;height:27px;margin-bottom:22px;color:var(--accent)}
    .help-card h2{font-size:1.3rem;margin-bottom:16px}
    .help-card p{font-size:var(--text-base);color:var(--muted)}
    .footer{background:var(--deep);color:#d5dfec;padding-block:55px 25px;margin-top:30px}
    .footer-grid{display:grid;grid-template-columns:1.7fr repeat(3,1fr);gap:40px}
    .footer .brand{color:white}
    .footer-about{max-width:350px;margin-top:20px;color:#a9b8cc;font-size:var(--text-base)}

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script>

  (function(){
    "use strict";

    /* ================================================================
       01. Safe primitives, localization and formatting
       ================================================================ */

    const $ = id => document.getElementById(id);
    const clone = value => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    const isObject = value => !!value && typeof value === "object" && !Array.isArray(value);
    const text = (value,max=500) => typeof value === "string" ? value.slice(0,max) : "";
    const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[ch]));
    const bi = (ar,en) => ({ar,en});
    const tx = (ar,en) => state.lang === "ar" ? ar : en;
    const localized = value => isObject(value) ? value[state.lang] || value.en || value.ar || "" : value || "";
    const jsonEqual = (a,b) => JSON.stringify(a) === JSON.stringify(b);
    const bounded = (value,min,max,fallback) => typeof value === "number" && Number.isFinite(value) && value >= min && value <= max ? value : fallback;
    const clamp = (value,min,max) => Math.min(max,Math.max(min,value));
    const numericText = value => String(value == null ? "" : value)
      .replace(/[٠-٩]/g,ch=>String(ch.charCodeAt(0)-1632))
      .replace(/[۰-۹]/g,ch=>String(ch.charCodeAt(0)-1776))
      .replace(/٫/g,".").replace(/٬/g,"").replace(/,/g,".").trim();
    const numberInput = value => numericText(value) === "" ? NaN : Number(numericText(value));
    const whole = (value,min,max) => Number.isSafeInteger(value) && value >= min && value <= max;
    const normalizedDate = value => typeof value==="string"&&Number.isFinite(Date.parse(value)) ? new Date(value).toISOString() : null;

    function debounce(fn,delay){
      let timer;
      function debounced(...args){clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay);}
      debounced.cancel=()=>clearTimeout(timer);
      return debounced;
    }

    function uid(prefix){
      const suffix = window.crypto && typeof window.crypto.randomUUID === "function"
        ? window.crypto.randomUUID().replace(/-/g,"").slice(0,12)
        : Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      return (prefix+"-"+suffix).toUpperCase();
    }

    function safeURL(value){
      try{
        const url=new URL(text(value,2000));
        return url.protocol === "https:" && !url.username && !url.password ? url.href : "";
      }catch{return "";}
    }

    const moneyFormats=new Map();
    function formatMoney(minor,currency,digits){const market=activeMarket(),locale=market.locales[state.lang],key=[locale,currency,digits].join(':');if(!moneyFormats.has(key))moneyFormats.set(key,new Intl.NumberFormat(locale,{style:'currency',currency,minimumFractionDigits:digits,maximumFractionDigits:digits}));return moneyFormats.get(key).format(minor/10**CURRENCIES[currency].minorDigits);}
    function formatUSD(cents){return formatMoney(cents,activeMarket().baseCurrency,2);}
    function formatDZD(major){return formatMoney(major*10**CURRENCIES[activeMarket().displayCurrency].minorDigits,activeMarket().displayCurrency,0);}
    
    function dateLabel(value,withTime=false){
      const date=new Date(value);
      if(!Number.isFinite(date.getTime()))return tx("تاريخ غير متاح","Date unavailable");
      return withTime
        ? date.toLocaleString(state.lang==="ar"?"ar-DZ":"en-US",{dateStyle:"medium",timeStyle:"short"})
        : date.toLocaleDateString(state.lang==="ar"?"ar-DZ":"en-US",{dateStyle:"medium"});
    }

    const NAV={
      home:bi("الرئيسية","Home"),shop:bi("تسوّق","Shop"),new:bi("جديد أمريكا","New from the US"),
      brands:bi("المجموعات","Collections"),how:bi("كيف تعمل AnoX","How it works"),
      search:bi("بحث","Search"),wishlist:bi("المفضلة","Wishlist"),cart:bi("السلة","Cart"),
      account:bi("الحساب","Account"),track:bi("تتبّع الطلب","Track order"),
      request:bi("طلب منتج","Request a product"),requests:bi("طلباتي الخاصة","My requests"),
      business:bi("للأعمال","For business"),settings:bi("إعدادات التكلفة","Cost settings"),
      help:bi("المساعدة","Help"),compare:bi("المقارنة","Comparison"),order:bi("تفاصيل الطلب","Order details")
    };
    const CATEGORIES={
      Fashion:bi("أزياء","Fashion"),Shoes:bi("أحذية","Shoes"),Electronics:bi("إلكترونيات","Electronics"),
      Beauty:bi("عناية وجمال","Beauty"),Accessories:bi("إكسسوارات","Accessories"),
      Home:bi("المنزل","Home"),Sports:bi("رياضة","Sports"),Lifestyle:bi("أسلوب حياة","Lifestyle")

    // Query work is bounded: 100 characters, 12 distinct terms and 2,000 typo candidates per term.
    const SEARCH_STOP_WORDS=new Set(['the','a','an','for','and','or','with','to','of','in','on','my','i','me','need','want','please','some','best','great','buy','top','افضل','احسن','شراء','في','من','مع','و','او','عن','الي','لي','اريد','ابحث','فضلك','رجاء']);
    class LocalSearchIndex{
      constructor(repository){this.repository=repository;this.version=-1;this.documents=[];this.words=[];this.postings=new Map();this.wordLengths=new Map();this.cache=new Map();}
      rebuild(){
        this.documents=this.repository.all().map(product=>({product,titles:[normalizeSearch(product.name.ar),normalizeSearch(product.name.en)],words:[...new Set(normalizeSearch([product.name.ar,product.name.en,product.brand,product.kind,product.category,CATEGORIES[product.category].ar,CATEGORIES[product.category].en,...product.colors,...product.colors.map(c=>COLORS[c]?.[1]||c),...product.sizes,...product.specs.flatMap(s=>[s.value.ar,s.value.en])].join(' ').replace(/(\d)([a-z])/gi,'$1 $2')).split(' '))].filter(Boolean)}));
        this.postings=new Map();this.documents.forEach(({words},index)=>{for(const word of words){if(!this.postings.has(word))this.postings.set(word,[]);this.postings.get(word).push(index);}});
        this.words=[...this.postings.keys()].sort();this.wordLengths=new Map();
        for(const word of this.words){if(!this.wordLengths.has(word.length))this.wordLengths.set(word.length,[]);this.wordLengths.get(word.length).push(word);}
        this.version=this.repository.version;this.cache.clear();
      }
      search(query){
        if(this.version!==this.repository.version)this.rebuild();
        const normalized=normalizeSearch(text(query,100));if(this.cache.has(normalized))return this.cache.get(normalized).slice();
        const tokens=[...new Set(normalized.split(' ').filter(token=>token&&!SEARCH_STOP_WORDS.has(token)))].slice(0,12);if(!tokens.length)return [];
        const totals=new Map(),usefulTokens=[];
        for(const token of tokens){
          const group=SYNONYMS.find(words=>words.includes(token))||SYNONYMS.find(words=>token.length>=4&&token.length<=32&&words.some(word=>word.length>=4&&editDistance(token,word)<=1))||[token];
          const termScores=new Map(),wordScores=new Map();
          if(this.postings.has(token))wordScores.set(token,32);
          for(const value of group){
            if(this.postings.has(value))wordScores.set(value,Math.max(wordScores.get(value)||0,24));
            if(value.length<2)continue;
            let low=0,high=this.words.length;while(low<high){const middle=(low+high)>>>1;if(this.words[middle]<value)low=middle+1;else high=middle;}
            for(let index=low,count=0;index<this.words.length&&this.words[index].startsWith(value)&&count<2000;index++,count++){const word=this.words[index];wordScores.set(word,Math.max(wordScores.get(word)||0,12));}
          }
          if(token.length>=4&&token.length<=32){
            const candidates=[...(this.wordLengths.get(token.length)||[]),...(this.wordLengths.get(token.length-1)||[]),...(this.wordLengths.get(token.length+1)||[])].slice(0,2000);
            for(const word of candidates)if(!wordScores.has(word)&&editDistance(token,word)<=1)wordScores.set(word,6);
          }
          for(const [word,score] of wordScores)for(const index of this.postings.get(word))termScores.set(index,Math.max(termScores.get(index)||0,score));
          if(termScores.size)usefulTokens.push(token);
          // A term with no useful match contributes nothing; it never removes an otherwise relevant product.
          for(const [index,score] of termScores){const total=totals.get(index)||{index,matched:0,score:0};total.matched++;total.score+=score;totals.set(index,total);}
        }
        const phrase=usefulTokens.join(' ');
        for(const total of totals.values()){const titles=this.documents[total.index].titles;total.score+=titles.includes(phrase)?64:titles.some(title=>title.includes(phrase))?24:0;}
        const result=[...totals.values()].sort((a,b)=>b.matched-a.matched||b.score-a.score||(this.documents[a.index].product.id<this.documents[b.index].product.id?-1:this.documents[a.index].product.id>this.documents[b.index].product.id?1:0)).map(({index})=>this.documents[index].product);
        if(this.cache.size>=80)this.cache.delete(this.cache.keys().next().value);this.cache.set(normalized,result);return result.slice();
      }
    }

    function defaultFilters(){
      return {category:"",brand:"",maxPrice:0,budget:0,available:false,isNew:false,popular:false};
    }
    function parseCatalogPage(value){const page=Number(value);return Number.isSafeInteger(page)&&page>=1?page:1;}
    function parseCatalogParams(params,products=Catalog.all()){
      const filters=defaultFilters(),category=params.get("category")||"",brandName=params.get("brand")||"";
      if(Object.hasOwn(CATEGORIES,category))filters.category=category;
      if(products.some(product=>product.brand===brandName))filters.brand=brandName;
      // Zero alone means unlimited; a positive URL cap is explicit, including USD 1,000.
      const cap=params.get("maxPrice")||"";
      if(/^\d{1,7}(?:\.\d{1,2})?$/.test(cap)&&Number(cap)>0&&Number(cap)<=1000000)filters.maxPrice=Number(cap);
      if([0,10000,15000,25000,50000,100000].includes(Number(params.get("budget"))))filters.budget=Number(params.get("budget"));
      for(const key of ["available","isNew","popular"])filters[key]=params.get(key)==="1";
      return {filters,sort:["featured","low","high","newest"].includes(params.get("sort"))?params.get("sort"):"featured",page:parseCatalogPage(params.get("page"))};
    }
    function readFilterParams(params){Object.assign(ui,parseCatalogParams(params));}
    function filterCatalogProducts(source,filters,sort="featured"){
      const f=filters,estimates=new Map(),estimate=product=>{if(!estimates.has(product.id))estimates.set(product.id,productQuote(product));return estimates.get(product.id);};
      const list=source.filter(product=>
        (!f.category||product.category===f.category)&&(!f.brand||product.brand===f.brand)&&
        (!f.maxPrice||product.priceCents<=f.maxPrice*100)&&(!f.budget||estimate(product).totalDzd<=f.budget)&&
        (!f.available||product.stock>0)&&(!f.isNew||product.isNew)&&(!f.popular||product.isPopular)
      );
      if(sort==="low"||sort==="high")list.sort((a,b)=>(estimate(a).totalCents-estimate(b).totalCents)*(sort==="high"?-1:1));
      else if(sort==="newest")list.sort((a,b)=>Number(b.isNew)-Number(a.isNew));
      return list;
    }
    function filteredProducts(source=Catalog.all()){return filterCatalogProducts(source,ui.filters,ui.sort);}
    function serializeCatalogParams(filters,sort="featured",page=1){
      const params=new URLSearchParams();
      for(const [key,value] of Object.entries(filters))if(value)params.set(key,typeof value==="boolean"?"1":String(value));
      if(sort!=="featured")params.set("sort",sort);

    }
    function filterParams(){return serializeCatalogParams(ui.filters,ui.sort,ui.page);}
    const CATALOG_PAGE_SIZE=24;
    function catalogPage(products,requestedPage=1){

    }

    function trapFocus(event){

        // Search and tracking inputs belong to their URL, not to form drafts.

    function renderRoute({focus=true}={}){
      if(ui.rendering)return;
      ui.rendering=true;
      try{
        const route=currentRoute();
        if(route.name!=="product"&&ui.dialog)closeDialog(false);
        if(["shop","search"].includes(route.name))readFilterParams(route.params);
        switch(route.name){
          case "home":renderHome();break;
          case "shop":renderShop();break;
          case "search":renderSearch();break;
          case "wishlist":renderWishlist();break;
          case "cart":renderCart();break;
          case "checkout":renderCheckout();break;
          case "account":renderAccount();break;
          case "order":renderOrder();break;
          case "request":renderRequest(false);break;
          case "business":renderRequest(true);break;
          case "requests":renderRequests();break;
          case "quote":renderQuote();break;
          case "settings":renderSettings();break;
          case "compare":renderCompare();break;
          case "brands":renderCollections();break;
          case "new":renderNew();break;
          case "how":renderHow();break;
          case "track":renderTrack();break;
          case "help":renderHelp();break;
          case "debug":if(DEVELOPER_MODE)renderDeveloperTests();else renderHelp();break;
          case "product":{
            let slug;
            try{slug=decodeURIComponent(route.path.slice(8));}catch{slug="";}
            const product=productBy(slug);
            if(!product){
              history.replaceState(null,"","#shop");readFilterParams(new URLSearchParams());renderShop();
              toast(tx("هذا المنتج غير موجود في الكتالوج.","This product is not in the catalog."),"warning");
              break;
            }
            if(!$("main").querySelector(".product-grid")){readFilterParams(new URLSearchParams());renderShop();}
            pageTitle(localized(product.name));
            if(!ui.selection||ui.selection.productId!==product.id){
              ui.selection={productId:product.id,color:product.colors[0],size:product.sizes.length===1?product.sizes[0]:"",qty:1,view:0,zoom:false};
            }
            if(!state.viewed.includes(product.id)){state.viewed.unshift(product.id);state.viewed=state.viewed.slice(0,50);Storage.save();}
            renderProduct(product,true);
            focus=false;
            break;
          }
          default:
            pageTitle(tx("الصفحة غير موجودة","Page not found"));
            $("main").innerHTML=pageShell(tx("لم نجد هذه الصفحة","We couldn’t find that page"),"",emptyMarkup(tx("لنعد إلى طريق واضح","Let’s get you back on track"),tx("الرابط غير صالح أو لم يعد موجودًا.","The link is invalid or no longer available."),navLabel("home"),"home"));
        }
        updateShell();restoreForms();updateCatalogStatus();
        $("main").setAttribute("aria-busy","false");
        if(focus&&!ui.dialog){
          const catalogTarget=ui.catalogPageFocus?$("results-count"):null;ui.catalogPageFocus=false;
          (catalogTarget||$("main")).focus({preventScroll:true});
          if(catalogTarget)catalogTarget.scrollIntoView({block:"start",behavior:"auto"});
          else window.scrollTo({top:0,behavior:"auto"});
        }
        if(ui.returnProductFocus&&!ui.dialog){const productId=ui.returnProductFocus;ui.returnProductFocus="";requestAnimationFrame(()=>{if(!ui.dialog){const target=[...$("main").querySelectorAll("[data-product]")].find(node=>node.dataset.product===productId);(target||$("main")).focus({preventScroll:true});}});}
        const section=currentRoute().params.get("section");
        if(section&&["shipping","privacy","contact"].includes(section)){
          requestAnimationFrame(()=>{
            const target=$("help-"+section);
            if(target){target.scrollIntoView({block:"start"});target.focus({preventScroll:true});}
          });
        }
      }catch(error){
        closeDialog(false);
        pageTitle(tx("تعذر عرض الصفحة","Unable to display this page"));
        $("main").innerHTML=pageShell(tx("لنحاول مرة أخرى","Let’s try again"),tx("لم نرسل أي بيانات ولم نعالج أي دفعة. سجلاتك المحفوظة لم تُحذف.","No data was sent and no payment was processed. Your saved records were not deleted."),
          '<div class="notice warning">'+icon("warning")+'<span>'+esc(tx("حدث خطأ أثناء عرض هذه الصفحة.","An error occurred while displaying this page."))+'</span></div><div class="actions actions-spaced">'+button(tx("إعادة المحاولة","Try again"),"data-retry","btn primary")+routeLink("home",navLabel("home"),"btn secondary")+'</div>');
        $("main").setAttribute("aria-busy","false");
        console.error("AnoX rendering error:",error);
      }finally{ui.rendering=false;ui.lastHash=location.hash||"#home";}
    }

    function catalogPaginationMarkup(pagination,routeName,baseParams){
      if(pagination.pages<=1)return "";
      const link=(page,label,current=false)=>{
        const params=new URLSearchParams(baseParams);if(page===1)params.delete("page");else params.set("page",String(page));
        const href="#"+routeName+(params.toString()?"?"+params.toString():"");
        return '<a class="btn '+(current?'primary':'secondary')+' small" href="'+esc(href)+'" data-catalog-page="'+page+'"'+(current?' aria-current="page"':'')+' aria-label="'+esc((label===String(page)?"":label+" · ")+tx("الصفحة ","Page ")+page)+'">'+esc(label)+'</a>';
      };
      const pages=[...new Set([1,pagination.page-1,pagination.page,pagination.page+1,pagination.pages].filter(page=>page>=1&&page<=pagination.pages))].sort((a,b)=>a-b);
      let previous=0;
      const numbered=pages.map(page=>{const gap=previous&&page-previous>1?'<span class="pagination-gap" aria-hidden="true">…</span>':"";previous=page;return gap+link(page,String(page),page===pagination.page);}).join("");

    function refreshCatalog(){

      const route=currentRoute(),params=filterParams();

      if(route.name==="search")renderSearch();else renderShop();

    function saveRecent(query){

    function renderSuggestions(){
      const input=$("search-query"),target=$("suggestions");
      if(!input||!target)return;
      const query=input.value.trim();
      ui.searchItems=[];
      let markup="";
      function option(item,html){
        const index=ui.searchItems.push(item)-1;
        return '<button type="button" class="suggestion" role="option" tabindex="-1" id="suggestion-'+index+'" aria-selected="'+(ui.searchIndex===index)+'" data-suggestion="'+index+'">'+html+'</button>';

          markup+=products.slice(0,5).map(product=>option({type:"product",id:product.id},
            '<span class="suggestion-art">'+productArt(product)+'</span><span class="suggestion-copy"><strong>'+esc(localized(product.name))+'</strong><small>'+esc(product.brand+" · "+categoryLabel(product.category))+'</small></span><bdi>'+formatUSD(product.priceCents)+'</bdi>')).join("");
          markup+=option({type:"search",query},'<span class="suggestion-copy"><strong>'+esc(tx("عرض كل النتائج","View all results"))+'</strong><small>'+products.length+' '+esc(tx("منتج توضيحي","illustrative products"))+'</small></span>'+icon("arrow","arrow"));
        }else{
          markup+='<p class="fine" style="padding:15px 5px">'+esc(tx("لم نجد منتجًا مطابقًا. يمكنك حفظ طلب خاص بدلًا من ذلك.","No product matched. You can save a special request instead."))+'</p>';
          markup+=option({type:"request",query},'<span class="suggestion-copy"><strong>'+esc(tx("طلب منتج بهذا الاسم","Request a product with this name"))+'</strong><small>'+esc(query)+'</small></span>'+icon("arrow","arrow"));
        }
      }else{
        if(state.recent.length){
          markup+='<div class="suggestion-label">'+esc(tx("عمليات البحث الأخيرة","Recent searches"))+'</div>';
          markup+=state.recent.slice(0,4).map(query=>option({type:"search",query},icon("search")+'<span class="suggestion-copy"><strong>'+esc(query)+'</strong><small>'+esc(tx("بحث سابق على هذا الجهاز","Previous search on this device"))+'</small></span>')).join("");
        }
        markup+='<div class="suggestion-label">'+esc(tx("ابدأ باهتمامك","Start with an interest"))+'</div>';
        const queries=state.lang==="ar"?["أحذية الجري","سماعات","حقيبة","قارورة"]:["Running shoes","Headphones","Bag","Bottle"];

      }
      target.innerHTML=markup;input.setAttribute("aria-expanded",String(ui.searchItems.length>0));$("search-status").textContent=ui.searchItems.length+" "+tx("اقتراح متاح","suggestions available");
      if(ui.searchIndex>=ui.searchItems.length)ui.searchIndex=-1;
      updateSearchSelection();
    }
    function updateSearchSelection(){
      const input=$("search-query");if(!input)return;
      $("suggestions").querySelectorAll("[data-suggestion]").forEach((node,index)=>node.setAttribute("aria-selected",String(index===ui.searchIndex)));
      if(ui.searchIndex>=0){input.setAttribute("aria-activedescendant","suggestion-"+ui.searchIndex);$("suggestion-"+ui.searchIndex)?.scrollIntoView({block:"nearest"});}
      else input.removeAttribute("aria-activedescendant");

    function activateSuggestion(index){
      const item=ui.searchItems[index];if(!item)return;
      const query=$("search-query")?$("search-query").value:"";
      if(item.type==="product"){saveRecent(query);openProduct(item.id);}

    function inCart(productId,color,size,exceptKey=""){
      return state.cart.reduce((sum,line)=>sum+(line.productId===productId&&line.color===color&&line.size===size&&cartKey(line)!==exceptKey?line.qty:0),0);
    }
    function remainingStock(product,color,size,exceptKey=""){
      const variant=variantFor(product,color,size);
      return variant?Math.max(0,Math.min(variant.stock,20)-inCart(product.id,color,size,exceptKey)):0;
    }
    function openProduct(id,{editLine=null,moveWishlist=false}={}){
      const product=productBy(id);if(!product)return;
      const route=currentRoute();
      if(route.name!=="product")ui.productBase=location.hash||"#shop";
      const opener=document.activeElement;
      captureForms();closeDialog(false);
      ui.opener=opener;ui.editKey=editLine?cartKey(editLine):"";ui.moveWishlist=moveWishlist?product.id:"";
      ui.selection=editLine?{...clone(editLine),view:0,zoom:false}:{
        productId:product.id,color:product.colors[0],size:product.sizes.length===1?product.sizes[0]:"",qty:1,view:0,zoom:false
      };
      const hash="#product/"+product.slug;
      Storage.save();
      if(location.hash===hash)renderRoute({focus:false});else location.hash=hash;
    }
    function sizeLabel(product){
      return product.category==="Shoes"?tx("مقاسات US للبالغين — دليل المجموعة فقط","Adult US sizing — collection guide only"):
        product.category==="Fashion"?tx("مقاس المجموعة","Collection size"):tx("الخيار","Option");
    }

      const rows=product.sizes.map(size=>{

        }else if(product.category==="Fashion"){

          measure=tx("محيط صدر توضيحي: ","Illustrative chest: ")+(ranges[size]||"—")+" cm";
        }else measure=tx("الخيار المعروض في هذه المجموعة التوضيحية","The option shown for this illustrative collection");
        return '<tr><th scope="row">'+esc(size)+'</th><td>'+esc(measure)+'</td></tr>';
      }).join("");
      return '<details class="size-guide" id="size-guide"><summary>'+esc(tx("دليل المقاس والخيار","Size & option guide"))+'</summary><p class="fine">'+esc(tx("دليل توضيحي للمجموعة الخيالية، وليس جدول مقاسات أو مواصفات علامة تجارية حقيقية.","An illustrative guide for this fictional collection, not a real brand’s size chart or specification."))+'</p><table><thead><tr><th scope="col">'+esc(tx("الخيار","Option"))+'</th><th scope="col">'+esc(tx("مرجع توضيحي","Illustrative reference"))+'</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
    }
    function productDetailMarkup(product){
      const selection=ui.selection,variant=variantFor(product,selection.color,selection.size);

      const liked=state.wishlist.includes(product.id),compared=state.compare.includes(product.id);

      return '<div class="product-detail"><div class="detail-gallery"><div class="gallery-stage '+(selection.zoom?"zoomed":"")+'"><button type="button" class="gallery-main" data-zoom aria-label="'+esc(selection.zoom?tx("إلغاء التكبير","Exit zoom"):tx("تكبير الرسم","Zoom illustration"))+'" aria-pressed="'+selection.zoom+'">'+productArt(product,selection.color,selection.view)+'</button><button type="button" class="btn secondary small zoom-control" data-zoom>'+icon(selection.zoom?"minus":"plus")+esc(selection.zoom?tx("تصغير","Zoom out"):tx("تكبير","Zoom"))+'</button></div><div class="gallery-thumbs" role="group" aria-label="'+esc(tx("معرض المنتج","Product gallery"))+'">'+galleryLabels.map((label,index)=>'<button type="button" class="gallery-thumb" data-gallery="'+index+'" aria-pressed="'+(selection.view===index)+'" aria-label="'+esc(label)+'">'+productArt(product,selection.color,index)+'</button>').join("")+'</div><p class="fine illustration-note">'+esc(tx("رسوم مطابقة لنوع المنتج واللون المحدد. ليست صور بائع أو دليلًا على مخزون فعلي.","Illustrations match the product type and selected color. They are not seller photographs or proof of live inventory."))+'</p></div><div class="detail-info"><div class="detail-tools">'+button(state.lang==="ar"?"English":"العربية",'data-language="'+(state.lang==="ar"?"en":"ar")+'"',"text-btn")+'<button type="button" class="icon-btn" data-theme aria-label="'+esc(tx("تبديل المظهر","Toggle theme"))+'">'+icon(state.theme==="dark"?"sun":"moon")+'</button></div><span class="product-brand">'+esc(product.brand)+" · "+esc(tx("مجموعة خيالية","Fictional collection"))+'</span><h1>'+esc(localized(product.name))+'</h1><div class="detail-price"><div><small>'+esc(tx("سعر المنتج فقط","Item price only"))+'</small><strong><bdi>'+formatUSD(product.priceCents)+'</bdi></strong></div><bdi>'+formatDZD(itemDZD(product))+'</bdi></div><p class="detail-description">'+esc(localized(product.description))+'</p><div class="option-block"><div class="option-label"><span>'+esc(tx("اللون","Color")+" · "+colorName(selection.color))+'</span></div><div class="swatches" role="group" aria-label="'+esc(tx("اللون","Color"))+'">'+product.colors.map(color=>'<button type="button" class="swatch" data-color="'+esc(color)+'" style="background:'+colorHex(color)+'" aria-label="'+esc(colorName(color))+'" aria-pressed="'+(selection.color===color)+'"></button>').join("")+'</div></div><div class="option-block"><div class="option-label"><span>'+esc(sizeLabel(product))+'</span>'+button(tx("دليل المقاس","Size guide"),"data-size-guide","text-btn")+'</div><div class="sizes" role="group" aria-label="'+esc(tx("المقاس أو الخيار","Size or option"))+'">'+product.sizes.map(size=>'<button type="button" class="size-btn" data-size="'+esc(size)+'" aria-pressed="'+(selection.size===size)+'" '+(!remainingStock(product,selection.color,size,ui.editKey)?"disabled":"")+'>'+esc(size)+'</button>').join("")+'</div>'+(!selection.size?'<p class="fine" style="margin-top:10px">'+esc(tx("اختر المقاس للمتابعة — لا يوجد اختيار تلقائي.","Choose a size to continue — none is preselected."))+'</p>':"")+sizeGuideMarkup(product)+'</div><div class="quantity-stock"><div><div class="option-label">'+esc(tx("الكمية","Quantity"))+'</div><div class="quantity"><button type="button" data-detail-delta="-1" aria-label="'+esc(tx("إنقاص الكمية","Decrease quantity"))+'" '+(selection.qty<=1?"disabled":"")+'>'+icon("minus")+'</button><span>'+selection.qty+'</span><button type="button" data-detail-delta="1" aria-label="'+esc(tx("زيادة الكمية","Increase quantity"))+'" '+(!variant||selection.qty>=remaining?"disabled":"")+'>'+icon("plus")+'</button></div></div><p class="fine" role="status">'+esc(variant?remaining+" "+tx("متاح للإضافة توضيحيًا","illustratively available to add"):tx("اختر المقاس لعرض التوفر","Select a size to see availability"))+'</p></div><div class="detail-cta"><button type="button" class="btn primary" data-add-product '+(!product.stock||(variant&&remaining<selection.qty)?"disabled":"")+'>'+esc(ui.editKey?tx("حفظ تعديلات السلة","Save cart changes"):tx("أضف إلى السلة","Add to cart"))+'</button><button type="button" class="btn secondary" data-wishlist="'+product.id+'" aria-label="'+esc(navLabel("wishlist"))+'" aria-pressed="'+liked+'">'+icon("heart")+'</button><button type="button" class="btn secondary" data-compare="'+product.id+'" aria-pressed="'+compared+'">'+esc(tx("قارن","Compare"))+'</button></div>'+summaryMarkup(productQuote(product,selection.qty))+'<details class="detail-section"><summary>'+esc(tx("المواصفات التوضيحية","Illustrative specifications"))+'</summary><dl class="spec-list">'+product.specs.map(spec=>'<div><dt>'+esc(localized(spec.label))+'</dt><dd>'+esc(localized(spec.value))+'</dd></div>').join("")+'<div><dt>'+esc(tx("وزن الشحن التوضيحي","Illustrative shipping weight"))+'</dt><dd>'+product.weightGrams/1000+' kg</dd></div></dl></details><details class="detail-section"><summary>'+esc(tx("المصدر والشراء","Source & purchasing"))+'</summary><p class="fine">'+esc(tx("هذا المنتج جزء من مصدر AnoX التوضيحي. لا يوجد بائع متصل أو تحقق من الأصالة أو حجز مخزون. لن تتم معالجة أي دفعة.","This product belongs to the AnoX illustrative provider. No seller is connected, no authenticity or inventory is verified, and no payment is processed."))+'</p></details></div></div>';
    }
    function renderProduct(product,initial=false,focusSelector=""){
      if(!product)return;
      const content=productDetailMarkup(product);
      if(initial||ui.dialog!=="product"){
        const opener=ui.opener||document.activeElement;
        openDialog("product",localized(product.name),content,opener);
      }else{
        const scroll=$("dialog-content").scrollTop;
        $("dialog-title").textContent=localized(product.name);
        $("dialog-content").innerHTML=content;
        $("dialog-content").scrollTop=scroll;
        if(focusSelector){
          const target=$("dialog-content").querySelector(focusSelector);
          if(target)target.focus({preventScroll:true});
        }
      }
    }
    async function addSelectedProduct(){
      if(ui.cartBusy)return;
      const selection=clone(ui.selection),product=selection&&productBy(selection.productId);
      if(!product)return;
      const target=$("dialog-content").querySelector("[data-add-product]");ui.cartBusy=true;if(target)target.disabled=true;
      try{
      await Storage.sync();
      if(Storage.notice==="clearedElsewhere"||!jsonEqual(selection,ui.selection))return;
      const variant=variantFor(product,selection.color,selection.size);
      if(!variant){toast(tx("اختر المقاس أو الخيار أولًا.","Choose a size or option first."),"warning");$("dialog-content").querySelector("[data-size]")?.focus();return;}
      if(!CommercePolicy.line(product,variant,selection.qty,'preview').allowed){toast(tx('هذا الخيار غير مؤهل للمحاكاة، والشراء الحقيقي غير متصل.','This option is not eligible for preview; live purchasing is not connected.'),'warning');return;}
      if(!whole(selection.qty,1,20)||selection.qty>remainingStock(product,selection.color,selection.size,ui.editKey)){
        toast(tx("الكمية تتجاوز المتاح لهذا اللون والمقاس، مع احتساب السلة.","Quantity exceeds this color and size’s availability, including your cart."),"warning");return;
      }
      const updated=state.cart.filter(line=>!ui.editKey||cartKey(line)!==ui.editKey);
      const newLine={productId:product.id,color:selection.color,size:selection.size,qty:selection.qty};
      const existing=updated.find(line=>cartKey(line)===cartKey(newLine));
      if(existing)existing.qty+=newLine.qty;else updated.push(newLine);
      state.cart=updated;
      const editing=!!ui.editKey;
      if(ui.moveWishlist===product.id)state.wishlist=state.wishlist.filter(id=>id!==product.id);
      await Storage.save();updateShell();
      if(editing){ui.editKey="";ui.moveWishlist="";dismissDialog();}
      else if(ui.dialog==="product"&&ui.selection?.productId===product.id)renderProduct(product,false,"[data-add-product]");
      toast(editing?tx("حُفظت خيارات السلة.","Cart options updated."):tx("أُضيف إلى السلة.","Added to cart."),"success");
      }finally{ui.cartBusy=false;if(target?.isConnected)target.disabled=false;}
    }
    function toggleWishlist(id){
      if(!productBy(id))return;
      const exists=state.wishlist.includes(id);
      state.wishlist=exists?state.wishlist.filter(value=>value!==id):[...state.wishlist,id];
      Storage.save();updateShell();
      document.querySelectorAll("[data-wishlist]").forEach(node=>node.setAttribute("aria-pressed",String(state.wishlist.includes(node.dataset.wishlist))));
      if(currentRoute().name==="wishlist")renderWishlist();
      toast(exists?tx("أُزيل من المفضلة.","Removed from wishlist."):tx("حُفظ في المفضلة.","Saved to wishlist."),"success");
    }
    function renderWishlist(){
      pageTitle(navLabel("wishlist"));
      const products=state.wishlist.map(productBy).filter(Boolean),pagination=catalogPage(products,currentRoute().params.get("page"));
      $("main").innerHTML=pageShell(tx("احفظ ما يعجبك لوقت لاحق","Saved for later"),tx("قارن اختياراتك أو انقلها إلى السلة بعد تحديد خياراتها.","Compare your picks or move them to your cart after choosing their options."),
        products.length?productGrid(pagination.items,"wishlist")+catalogPaginationMarkup(pagination,"wishlist",new URLSearchParams()):emptyMarkup(tx("المفضلة فارغة","Your wishlist is empty"),tx("احفظ المنتجات التي ترغب بمقارنتها أو زيارتها لاحقًا.","Save products you want to compare or revisit later.")), "WISHLIST");
    }
    function toggleCompare(id){
      const product=productBy(id);if(!product)return;
      if(state.compare.includes(id))state.compare=state.compare.filter(value=>value!==id);
      else{

    async function placeOrder(target){
      if(target.disabled||ui.orderBusy||!state.cart.length)return;
      const issues=cartIssues();if(issues.length){toast(issues[0],"error");ui.checkoutStep=1;renderCheckout();return;}
      ui.deliveryErrors=deliveryErrors(state.checkoutData);
      if(Object.keys(ui.deliveryErrors).length){ui.checkoutStep=2;renderCheckout();focusInvalidField($("main"),ui.deliveryErrors);return;}
      if(state.orders.length>=100){toast(tx("تتسع هذه النسخة لـ100 سجل طلب محلي. لم نحذف أي سجل سابق.","This version holds 100 local order records. No previous record was deleted."),"warning");return;}
      const reviewed={cart:clone(state.cart),settings:clone(state.settings),checkoutData:clone(state.checkoutData)},orderId=uid("ANX");
      ui.orderBusy=true;target.disabled=true;
      try{
        await Storage.save({
          guard:(remote,current)=>current.orders.length<100&&jsonEqual(remote.cart,reviewed.cart)&&jsonEqual(remote.settings,reviewed.settings)&&["cart","settings","checkoutData"].every(key=>jsonEqual(current[key],reviewed[key]))&&CommercePolicy.checkout(current.cart,{mode:"preview"}).allowed,
          mutate:current=>{
            const items=current.cart.map(line=>{const product=productBy(line.productId);return {...clone(line),name:clone(product.name),brand:product.brand,priceCents:product.priceCents,weightGrams:product.weightGrams,source:clone(product.source),catalogVersion:Catalog.version,handling:clone(product.handling),classification:clone(product.classification),dimensionsMm:clone(product.dimensionsMm)};});
            const config=clone(current.settings),marketId=activeMarket().id,totals=quote(items,config,marketId);
            const order={schema:"anox.order/3",mode:"preview",engineVersion:ENGINE_VERSION,marketId,id:orderId,createdAt:new Date().toISOString(),stage:0,source:"cart",legacy:false,items,delivery:clone(current.checkoutData),totals,config,pricingSnapshot:pricingSnapshot(items,config,totals,marketId)};
            current.orders.unshift(order);current.cart=[];
          }
        });
        if(Storage.notice==="clearedElsewhere")return;
        if(!state.orders.some(order=>order.id===orderId)){
          toast(Storage.notice==="conflict"?tx("تغيّرت السلة أو بيانات المراجعة، أو امتلأت مساحة السجلات. راجعها ثم حاول مجددًا؛ لم يُنشأ طلب مكرر.","The cart or reviewed details changed, or the record limit was reached. Review them and try again; no duplicate order was created."):tx("تعذر حفظ سجل الطلب بأمان. بقيت السلة دون تغيير؛ يمكنك إعادة المحاولة.","The order record could not be saved safely. Your cart is unchanged; you can try again."),"warning");
          if(currentRoute().name==="checkout")renderCheckout();return;
        }
        ui.checkoutStep=1;ui.deliveryErrors={};delete ui.formMemory["delivery-form"];
        if(currentRoute().name==="checkout")navigate("order",{id:orderId,created:"1"});
        else toast(tx("أُنشئ سجل الطلب المحلي.","Local order record created."),"success");
      }finally{ui.orderBusy=false;if(target.isConnected)target.disabled=false;}
