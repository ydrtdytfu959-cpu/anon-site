    function setFormErrors(form,errors){
      for(const element of form.elements){
        if(!element.name||!element.id||element.type==="hidden")continue;
        const message=errors[element.name]||"";
        element.setAttribute("aria-invalid",String(!!message));
        const target=$(element.id+"-error");
        if(target)target.textContent=message;
      }
      focusInvalidField(form,errors);
    }
    async function saveRequest(form){
      const business=form.getAttribute("id")==="business-form",data=Object.fromEntries(new FormData(form).entries()),errors={};
      if(!text(data.name,160).trim())errors.name=tx("أدخل اسم المنتج.","Enter a product name.");
      if(data.url&&!safeURL(data.url))errors.url=tx("استخدم رابط HTTPS صالحًا دون بيانات دخول.","Use a valid HTTPS link without embedded credentials.");
      const qty=numberInput(data.qty),budget=data.budget?numberInput(data.budget):0;
      if(!whole(qty,1,500))errors.qty=tx("أدخل عددًا صحيحًا من 1 إلى 500.","Enter a whole number from 1 to 500.");
      if(!whole(budget,0,1e8))errors.budget=tx("أدخل ميزانية صحيحة وغير سالبة بالدينار.","Enter a non-negative whole-number DZD budget.");
      if(business&&!text(data.store,160).trim())errors.store=tx("أدخل اسم النشاط.","Enter a business name.");
      if(business&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email||""))errors.email=tx("أدخل بريدًا إلكترونيًا صالحًا.","Enter a valid email address.");
      setFormErrors(form,errors);if(Object.keys(errors).length)return;
      const request=normalizeRequest({
        ...data,id:uid("REQ"),createdAt:new Date().toISOString(),name:data.name.trim(),
        qty,budget,type:business?"business":"personal",status:"saved"
      });
      await Storage.save({guard:(remote,current)=>current.requests.length<100,mutate:current=>{current.requests.unshift(request);current.drafts[business?"business":"request"]={};}});
      if(!state.requests.some(value=>value.id===request.id)){
        toast(state.requests.length>=100?tx("تتسع هذه النسخة لـ100 طلب منتج محلي. لم نحذف أي طلب سابق.","This version holds 100 local product requests. No earlier request was deleted."):tx("تعذر حفظ الطلب بأمان. بقيت التفاصيل في النموذج لتعيد المحاولة.","The request could not be saved safely. Your details remain in the form so you can try again."),"warning");return;
      }
      delete ui.formMemory[form.getAttribute("id")];
      form.dataset.discarded="true";
      if(["request","business"].includes(currentRoute().name))navigate("quote",{id:request.id});
    }

    async function generateQuote(form){
      const data=Object.fromEntries(new FormData(form).entries()),request=state.requests.find(value=>value.id===data.requestId);
      if(!request||request.status==="accepted")return;
      const price=numberInput(data.unitUsd),weight=numberInput(data.weightKg),errors={};
      if(!Number.isFinite(price)||price<.01||price>10000||Math.abs(price*100-Math.round(price*100))>.00001)errors.unitUsd=tx("أدخل سعرًا من 0.01 إلى 10000، حتى منزلتين عشريتين.","Use 0.01–10000, with at most two decimal places.");
      if(!Number.isFinite(weight)||weight<.001||weight>100||Math.abs(weight*1000-Math.round(weight*1000))>.00001)errors.weightKg=tx("أدخل وزنًا من 0.001 إلى 100 كغ، حتى ثلاثة منازل.","Use 0.001–100 kg, with at most three decimal places.");
      setFormErrors(form,errors);if(Object.keys(errors).length)return;
      const now=Date.now(),unitCents=Math.round(price*100),unitWeightGrams=Math.round(weight*1000),config=clone(state.settings);
      const original=clone(request),estimate={createdAt:new Date(now).toISOString(),expiresAt:new Date(now+72*60*60*1000).toISOString(),unitCents,unitWeightGrams,config,totals:quote([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config),decisionAt:"",legacy:false};
      estimate.pricingSnapshot=pricingSnapshot([{priceCents:unitCents,weightGrams:unitWeightGrams,qty:request.qty}],config,estimate.totals);
      const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.requests.find(value=>value.id===request.id),original)&&jsonEqual(current.settings,config),mutate:current=>{const value=current.requests.find(value=>value.id===request.id);value.quote=estimate;value.status="quoted";}});
      if(!saved){toast(tx("تعذر حفظ العرض أو تغيّر الطلب في تبويب آخر. راجع حالته ثم أعد المحاولة.","The quote could not be saved or the request changed in another tab. Review its status and try again."),"warning");return;}
      delete ui.formMemory[formMemoryKey(form)];form.dataset.discarded="true";
      if(currentRoute().name==="quote"){renderQuote();$("main").focus({preventScroll:true});}
    }
    async function decideQuote(id,decision){
      if(ui.quoteBusy)return;
      const request=state.requests.find(value=>value.id===id);
      if(!request||!request.quote||request.quote.legacy||!request.quote.pricingSnapshot||request.status!=="quoted"||!["accepted","rejected"].includes(decision))return;
      if(quoteExpired(request.quote)){toast(tx("انتهت صلاحية العرض. أنشئ تقديرًا جديدًا.","The quote expired. Create a new estimate."),"warning");renderQuote();return;}
      const original=clone(request);ui.quoteBusy=true;
      try{
        const saved=await Storage.save({guard:(remote,current)=>jsonEqual(remote.requests.find(value=>value.id===id),original)&&jsonEqual(current.requests.find(value=>value.id===id),original)&&!quoteExpired(original.quote),mutate:current=>{const value=current.requests.find(value=>value.id===id);value.status=decision;value.quote.decisionAt=new Date().toISOString();}});
        if(currentRoute().name==="quote")renderQuote();
        toast(saved?tx("حُفظ قرارك محليًا. لم يحدث شراء أو دفع.","Your decision was saved locally. No purchase or payment occurred."):tx("تعذر حفظ القرار أو تغيّر العرض أو انتهت صلاحيته. راجع حالته قبل المحاولة مجددًا.","The decision could not be saved, or the quote changed or expired. Review its status before trying again."),saved?"success":"warning");
      }finally{ui.quoteBusy=false;}
    }

    const SETTING_FIELDS=[
      ["usdToDzd",bi("سعر الصرف: دينار لكل دولار","Exchange rate: DZD per USD"),1,1000],
      ["serviceFeePercent",bi("رسوم الخدمة %","Service fee %"),0,50],
      ["baseShippingUsd",bi("رسم الشحن الأساسي USD لكل سلة","Base shipping USD per cart"),0,500],
      ["shippingPerKgUsd",bi("الشحن USD لكل كغ","Shipping USD per kg"),0,100]
    ];
    function parseSettingsDraft(draft){
      const result={};
      for(const [key,,min,max] of SETTING_FIELDS){
        const value=numberInput(draft&&draft[key]);
        if(!Number.isFinite(value)||value<min||value>max||Math.abs(value*100-Math.round(value*100))>.00001)return null;
        result[key]=value;
      }
      return result;
    }
    function settingsPreview(draft){

    async function saveSettings(form){
      const data=Object.fromEntries(new FormData(form).entries()),errors={};
      for(const [key,,min,max] of SETTING_FIELDS){

        if(!Number.isFinite(value)||value<min||value>max||Math.abs(value*100-Math.round(value*100))>.00001){
          errors[key]=tx("القيمة بين ","Value between ")+min+"–"+max+tx("، حتى منزلتين عشريتين.","; at most two decimal places.");

    let catalogToolLifecycle=null;
    function searchPreviewCatalog(input){
      if(!isObject(input)||Object.keys(input).some(key=>!["query","limit"].includes(key))||typeof input.query!=="string"||!input.query.trim()||input.query.length>100){
        throw new Error("Provide a query of 1–100 characters.");
      }
      const limit=input.limit===undefined?6:input.limit;
      requireInteger(limit,1,12,"search limit");
      const matches=searchCatalog(input.query).filter(product=>product.source.mode==="preview");
      return {
        mode:"preview",livePurchasing:false,query:input.query.trim(),total:matches.length,
        items:matches.slice(0,limit).map(product=>({
          id:product.id,slug:product.slug,name:clone(product.name),currency:"USD",itemPriceMinor:product.priceCents,
          estimatedLandedDzd:productQuote(product,1,DEFAULT_SETTINGS).totalDzd,excludes:["customs","local_taxes","insurance"],
          sourceMode:"preview",purchasable:false
        }))
      };
    }
    function registerCatalogTool(){
      let context;try{context=document.modelContext;}catch{return;}
      if(!context||typeof context.registerTool!=="function"||catalogToolLifecycle)return;
      const lifecycle=new AbortController();catalogToolLifecycle=lifecycle;
      const failed=()=>{lifecycle.abort();if(catalogToolLifecycle===lifecycle)catalogToolLifecycle=null;};
      try{
        Promise.resolve(context.registerTool({
          name:"search_preview_catalog",title:"Search AnoX preview catalog",
          description:"Read-only Arabic or English search of fictional AnoX products. Returns illustrative prices under fixed public illustrative cost assumptions. No purchasing, navigation, inventory verification or access to private device records.",
          inputSchema:{
            type:"object",properties:{query:{type:"string",minLength:1,maxLength:100},limit:{type:"integer",minimum:1,maximum:12}},
            required:["query"],additionalProperties:false
          },
          annotations:{readOnlyHint:true,untrustedContentHint:true},execute:searchPreviewCatalog
        },{signal:lifecycle.signal})).catch(failed);
      }catch{failed();}
    }
    window.addEventListener("pagehide",()=>{

    });

      await test('Records: capacity rejection preserves all 100 prior orders newest-first',async()=>{const io=memoryJournal(),{box,journal}=journalClient(io),base=defaultState();base.orders=Array.from({length:100},(_,index)=>releaseOrder('KEPT-'+index,index));io.setItem(journal.key,JSON.stringify({schema:3,generation:'0',data:base}));await journal.load();const ids=box.data.orders.map(value=>value.id);equal(ids[0],'KEPT-99');equal(ids[99],'KEPT-0');assert(!(await journal.save({guard:(remote,current)=>current.orders.length<100,mutate:current=>current.orders.unshift(releaseOrder('OVERFLOW',101))})));const fresh=journalClient(io);await fresh.journal.load();equal(fresh.box.data.orders.map(value=>value.id),ids);});

    async function renderDeveloperTests(){if(!DEVELOPER_MODE)return;pageTitle('AnoX · Developer checks');$('main').innerHTML=pageShell('Developer checks','Isolated in-memory checks. No customer records are created or saved.','<p role="status">Running…</p>');const results=await runSelfTests();if(currentRoute().name!=='debug')return;$('main').innerHTML=pageShell('Developer checks',results.filter(r=>r.pass).length+'/'+results.length+' PASS','<div class="surface"><div class="actions">'+button('Run again','data-run-tests','btn secondary')+'</div><div class="comparison-scroll" tabindex="0" role="region" aria-label="Automated test results"><table class="comparison-table"><caption>Isolated application self-tests</caption><thead><tr><th scope="col">Result</th><th scope="col">Check</th></tr></thead><tbody>'+results.map(r=>'<tr><td>'+ (r.pass?'PASS':'FAIL')+'</td><th scope="row">'+esc(r.name)+(r.pass?'':' · '+esc(r.error))+'</th></tr>').join('')+'</tbody></table></div></div>');$('main').setAttribute('aria-busy','false');}
